        <div class="relative z-50 text-center px-4 w-full max-w-4xl mx-auto py-8">
            <h1 id="web_tagline" class="text-3xl sm:text-4xl md:text-5xl font-extrabold mb-4 tracking-tight drop-shadow-lg">আপনার পছন্দের বই, এক জায়গায়</h1>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allBooksData = [];
        let filteredBooksData = [];
        let userWishlist = [];

        window.showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-animate px-5 py-4 rounded-lg shadow-2xl text-white font-bold flex items-center gap-3 ${isError ? 'bg-red-600 border-l-4 border-red-800' : 'bg-green-600 border-l-4 border-green-800'}`;
            toast.innerHTML = `<span class="text-2xl">${isError ? '⚠️' : '✅'}</span><span class="text-sm md:text-base pr-2">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transform = 'translateX(100%)'; 
                toast.style.transition = 'all 0.3s ease'; 
                setTimeout(() => toast.remove(), 300); 
            }, 4000);
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function sanitizeSearchQuery(query) {
            return query.replace(/[<>]/g, '').trim(); 
        }

        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        window.toggleDarkMode = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            const mobEl = document.getElementById('cartCountMobile');
            const deskEl = document.getElementById('cartCountDesktop');
            if(mobEl) mobEl.innerText = cart.length;
            if(deskEl) deskEl.innerText = cart.length;
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authBtn = document.getElementById('authButtonsDesktop');
            
            if (session) {
                currentUser = session.user;
                const { data: wish } = await supabaseClient.from('wishlists').select('book_id').eq('user_id', currentUser.id);
                if(wish) userWishlist = wish.map(w => w.book_id);

                authBtn.innerHTML = `
                    <a href="/profile.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-200 transition">প্রোফাইল</a>
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-semibold border border-red-200 hover:bg-red-100 transition">লগআউট</button>
                `;
                loadNotifications();
            } else {
                currentUser = null;
                authBtn.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">লগইন</a>`;
            }
        }

        async function loadNotifications() {
            if(!currentUser) return;
            const { data: notifs } = await supabaseClient.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            
            const badge = document.getElementById('notifBadge');
            const badgeMob = document.getElementById('notifBadgeMobile');
            const list = document.getElementById('notifList');
            
            if(!notifs || notifs.length === 0) {
                list.innerHTML = `<div class="p-4 text-center text-sm text-gray-500">কোনো নোটিফিকেশন নেই</div>`;
                if(badge) badge.classList.add('hidden');
                if(badgeMob) badgeMob.classList.add('hidden');
                return;
            }

            const unread = notifs.filter(n => !n.is_read).length;
            if(unread > 0) { 
                if(badge) { badge.innerText = unread; badge.classList.remove('hidden'); }
                if(badgeMob) { badgeMob.innerText = unread; badgeMob.classList.remove('hidden'); }
            } else {
                if(badge) badge.classList.add('hidden');
                if(badgeMob) badgeMob.classList.add('hidden');
            }

            list.innerHTML = notifs.map(n => `
                <div class="p-3 text-sm border-b dark:border-gray-700 ${!n.is_read ? 'bg-blue-50 dark:bg-gray-700 font-semibold' : 'text-gray-600'}">
                    ${escapeHTML(n.message)}
                    <p class="text-[10px] text-gray-400 mt-1">${new Date(n.created_at).toLocaleString('bn-BD')}</p>
                </div>
            `).join('');
        }

        window.toggleNotifications = () => { document.getElementById('notifDropdown').classList.toggle('hidden'); };

        async function loadBooks() {
            const grid = document.getElementById('bookGrid');
            const { data: books, error } = await supabaseClient.from('books').select('*');
            
            if (error || !books || books.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">কোনো বই পাওয়া যায়নি।</p>`;
                return;
            }

            allBooksData = books;
            filteredBooksData = [...books];

            const { data: categories } = await supabaseClient.from('categories').select('*').order('name');
            const categoryContainer = document.getElementById('categoryButtons');
            if (categories) {
                categories.forEach(cat => {
                    categoryContainer.insertAdjacentHTML('beforeend', `
                        <button onclick="filterCategory('${escapeHTML(cat.name)}')" class="category-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600 px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold hover:bg-blue-50 transition shadow-sm">${escapeHTML(cat.name)}</button>
                    `);
                });
            }
            renderBooks(filteredBooksData);
        }

        function createBookCard(book) {
            const currentPrice = book.discount_price || book.original_price || 0;
            const hasDiscount = book.original_price && book.discount_price && book.original_price > book.discount_price;
            let discountPercent = 0;
            if (hasDiscount) discountPercent = Math.round(((book.original_price - book.discount_price) / book.original_price) * 100);
            
            const safeTitle = escapeHTML(book.title);
            const safeAuthor = escapeHTML(book.author);
            const safeImage = book.cover_url ? book.cover_url : 'https://via.placeholder.com/300x400';

            return `
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col overflow-hidden relative group">
                <a href="/book-details.html?id=${book.id}" class="block w-full aspect-[3/4] bg-gray-100 dark:bg-gray-700 overflow-hidden relative">
                    ${hasDiscount ? `<div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-md z-10">${discountPercent}% ছাড়</div>` : ''}
                    <img src="${safeImage}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                </a>
                <div class="p-3 flex flex-col flex-grow">
                    <a href="/book-details.html?id=${book.id}">
                        <h3 class="font-bold text-sm text-gray-900 dark:text-white leading-snug line-clamp-2 mb-1">${safeTitle}</h3>
                    </a>
                    <p class="text-xs text-gray-500 mb-3">${safeAuthor}</p>
                    <div class="mt-auto flex items-center gap-2">
                        <span class="text-lg font-bold text-blue-600 dark:text-blue-400">৳ ${currentPrice}</span>
                        ${hasDiscount ? `<span class="text-gray-400 line-through text-xs">৳ ${book.original_price}</span>` : ''}
                    </div>
                </div>
            </div>`;
        }

        function renderBooks(books) {
            const grid = document.getElementById('bookGrid');
            if(books.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">এই ক্যাটাগরিতে কোনো বই নেই।</p>`;
                return;
            }
            grid.innerHTML = books.map(book => createBookCard(book)).join('');
        }

        window.filterCategory = (category) => {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'); 
                btn.classList.add('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300', 'border-gray-200', 'dark:border-gray-600');
            });
            const clickedBtn = Array.from(document.querySelectorAll('.category-btn')).find(btn => btn.innerText.trim() === (category === 'all' ? 'সব বই' : category));
            if (clickedBtn) { 
                clickedBtn.classList.remove('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300', 'border-gray-200', 'dark:border-gray-600'); 
                clickedBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-600'); 
            }

            if(category === 'all') {
                filteredBooksData = [...allBooksData];
            } else {
                filteredBooksData = allBooksData.filter(b => b.category === category);
            }
            renderBooks(filteredBooksData);
        }

        window.handleSearch = (source) => {
            const input = source === 'desktop' ? document.getElementById('searchInput') : document.getElementById('searchInputMobile');
            const query = sanitizeSearchQuery(input.value.toLowerCase());
            const dropdown = source === 'desktop' ? document.getElementById('searchResultsDropdown') : document.getElementById('searchResultsDropdownMobile');
            
            if(query === '') {
                dropdown.classList.add('hidden');
                renderBooks(allBooksData);
                return;
            }

            filteredBooksData = allBooksData.filter(book => {
                const title = (book.title || '').toLowerCase();
                const author = (book.author || '').toLowerCase();
                return title.includes(query) || author.includes(query);
            });
            
            renderBooks(filteredBooksData);

            if(filteredBooksData.length > 0) {
                dropdown.classList.remove('hidden');
                dropdown.innerHTML = filteredBooksData.slice(0, 5).map(book => `
                    <a href="/book-details.html?id=${book.id}" class="flex items-center gap-3 p-3 hover:bg-gray-50 dark:hover:bg-gray-700 border-b border-gray-100 dark:border-gray-700 last:border-0 cursor-pointer">
                        <img src="${book.cover_url || 'https://via.placeholder.com/50'}" class="w-10 h-14 object-cover rounded shadow-sm">
                        <div class="overflow-hidden">
                            <p class="font-bold text-sm text-gray-900 dark:text-white truncate">${escapeHTML(book.title)}</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${escapeHTML(book.author)}</p>
                        </div>
                    </a>
                `).join('');
            } else {
                dropdown.classList.remove('hidden');
                dropdown.innerHTML = `<p class="p-4 text-center text-sm text-gray-500 dark:text-gray-400">কোনো বই পাওয়া যায়নি।</p>`;
            }
        }

        // ==========================================
        // ব্লগ, লাইক, কমেন্ট ও প্রোফাইল লিংক
        // ==========================================
        async function loadBlogs() {
            const blogList = document.getElementById('blogList');
            
            // approved ব্লগগুলো আনছি, সাথে লেখকের নাম ও ছবি
            const { data: blogs, error } = await supabaseClient
                .from('blogs')
                .select('*, profiles(full_name, profile_image)')
                .eq('status', 'approved')
                .order('created_at', { ascending: false });
            
            if (error || !blogs || blogs.length === 0) {
                blogList.innerHTML = `<div class="col-span-full text-center py-10 bg-white dark:bg-gray-800 rounded-xl"><p class="text-gray-500">এখনো কোনো ব্লগ প্রকাশিত হয়নি।</p></div>`;
                return;
            }

            const blogHTML = await Promise.all(blogs.map(async (blog) => {
                const authorName = blog.profiles?.full_name || 'একজন পাঠক';
                const authorImage = blog.profiles?.profile_image || `https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&background=random`;
                
                const { count: likeCount } = await supabaseClient.from('blog_likes').select('*', { count: 'exact', head: true }).eq('blog_id', blog.id);

                return `
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col h-full overflow-hidden">
                    ${blog.image_url ? `<img src="${blog.image_url}" class="w-full h-48 object-cover">` : ''}
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="text-xl font-bold mb-3 text-gray-900 dark:text-white line-clamp-2">${escapeHTML(blog.title)}</h3>
                        
                        <!-- লেখকের প্রোফাইল লিংক -->
                        <a href="/profile.html?id=${blog.author_id}" class="flex items-center gap-2 mb-4 hover:bg-gray-50 dark:hover:bg-gray-700 p-1 rounded transition">
                            <img src="${authorImage}" class="w-8 h-8 rounded-full object-cover">
                            <p class="text-sm text-gray-600 dark:text-gray-400">লেখক: <span class="text-blue-600 font-semibold hover:underline">${escapeHTML(authorName)}</span></p>
                        </a>

                        <p class="text-gray-700 dark:text-gray-300 text-sm mb-4 line-clamp-3">${escapeHTML(blog.content)}</p>
                        
                        <!-- লাইক ও কমেন্ট সেকশন -->
                        <div class="mt-auto pt-4 border-t border-gray-100 dark:border-gray-700 flex items-center gap-4">
                            <button onclick="likeBlog('${blog.id}')" class="flex items-center gap-1 text-gray-500 hover:text-red-500 transition">
                                ❤️ <span id="like-count-${blog.id}">${likeCount || 0}</span>
                            </button>
                            <button onclick="toggleCommentBox('${blog.id}')" class="flex items-center gap-1 text-gray-500 hover:text-blue-500 transition">
                                💬 কমেন্ট
                            </button>
                        </div>
                        
                        <!-- কমেন্ট বক্স -->
                        <div id="comments-${blog.id}" class="hidden mt-4 border-t border-gray-100 dark:border-gray-700 pt-4">
                            <div id="comment-list-${blog.id}" class="space-y-2 mb-4 max-h-40 overflow-y-auto"></div>
                            <div class="flex gap-2">
                                <input type="text" id="comment-input-${blog.id}" placeholder="কমেন্ট লিখুন..." class="flex-grow px-3 py-1.5 border rounded-md text-sm dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
                                <button onclick="postComment('${blog.id}')" class="bg-blue-600 text-white px-4 py-1.5 rounded-md text-sm hover:bg-blue-700 transition">পাঠান</button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }));

            blogList.innerHTML = blogHTML.join('');
        }

        window.likeBlog = async (blogId) => {
            if(!currentUser) { showToast('লাইক দিতে লগইন করুন!', true); return; }
            const { data: existing } = await supabaseClient.from('blog_likes').select('id').eq('blog_id', blogId).eq('user_id', currentUser.id).maybeSingle();
            
            if(existing) {
                await supabaseClient.from('blog_likes').delete().eq('id', existing.id);
            } else {
                await supabaseClient.from('blog_likes').insert([{ blog_id: blogId, user_id: currentUser.id }]);
            }
            loadBlogs();
        }

        window.toggleCommentBox = (blogId) => {
            const box = document.getElementById(`comments-${blogId}`);
            box.classList.toggle('hidden');
            if(!box.classList.contains('hidden')) loadComments(blogId);
        }

        window.postComment = async (blogId) => {
            if(!currentUser) { showToast('কমেন্ট দিতে লগইন করুন!', true); return; }
            const input = document.getElementById(`comment-input-${blogId}`);
            const comment = input.value.trim();
            if(!comment) return;

            await supabaseClient.from('blog_comments').insert([{ blog_id: blogId, user_id: currentUser.id, comment }]);
            input.value = '';
            loadComments(blogId);
        }

        async function loadComments(blogId) {
            const list = document.getElementById(`comment-list-${blogId}`);
            list.innerHTML = '<p class="text-xs text-gray-500">লোড হচ্ছে...</p>';
            const { data: comments } = await supabaseClient.from('blog_comments').select('*, profiles(full_name)').eq('blog_id', blogId).order('created_at');
            
            if(!comments || comments.length === 0) { list.innerHTML = '<p class="text-xs text-gray-500">কোনো কমেন্ট নেই।</p>'; return; }
            list.innerHTML = comments.map(c => `
                <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded text-xs text-gray-800 dark:text-gray-200"><span class="font-bold">${c.profiles?.full_name || 'User'}:</span> ${escapeHTML(c.comment)}</div>
            `).join('');
        }

        window.submitBlog = async () => {
            if(!currentUser) { showToast('ব্লগ লিখতে প্রথমে লগইন করুন!', true); return; }
            
            const title = document.getElementById('newBlogTitle').value.trim();
            const content = document.getElementById('newBlogContent').value.trim();
            const imageFile = document.getElementById('newBlogImage').files[0];
            const btn = document.getElementById('submitBlogBtn');
            
            if(!title || !content) { showToast('শিরোনাম এবং বিষয়বস্তু লিখুন!', true); return; }
            btn.innerText = 'সাবমিট হচ্ছে...'; btn.disabled = true;

            try {
                let image_url = null;
                if (imageFile) {
                    const fileName = `blog_${Date.now()}.${imageFile.name.split('.').pop()}`;
                    const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, imageFile);
                    if (uploadError) throw new Error("ছবি আপলোডে সমস্যা: " + uploadError.message);
                    const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                    image_url = data.publicUrl;
                }

                const { error } = await supabaseClient.from('blogs').insert([{ 
                    author_id: currentUser.id, title: title, content: content, image_url: image_url, status: 'pending' 
                }]);
                
                if (error) throw new Error(error.message);

                showToast('✅ আপনার ব্লগটি সফলভাবে জমা হয়েছে।', false);
                document.getElementById('newBlogTitle').value = '';
                document.getElementById('newBlogContent').value = '';
                document.getElementById('newBlogImage').value = '';
                document.getElementById('writeBlogForm').classList.add('hidden');

            } catch (err) {
                showToast('সমস্যা: ' + err.message, true);
            } finally {
                btn.innerText = 'সাবমিট করুন'; btn.disabled = false;
            }
        }

        window.handleLogout = async () => { await supabaseClient.auth.signOut(); checkAuth(); showToast('লগআউট হয়েছে।', false); }

        checkAuth();
        loadBooks();
        loadBlogs();
        updateCartCount();
    </script>
</body>
</html>
