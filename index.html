<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Boi Chokro - অনলাইন বইয়ের দোকান ও সাহিত্য প্ল্যাটফর্ম</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-animate { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors">

    <!-- হেডার / নেভবার (অ্যাডমিন সেটিংস লোগো ও টাইটেল সহ) -->
    <nav class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="flex items-center gap-2 text-2xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight">
                <img id="siteLogo" src="" class="h-8 w-8 object-contain rounded hidden">
                <span id="siteTitleText">📚 Boi Chokro</span>
            </a>
            
            <!-- সার্চ বার (ডেস্কটপ) -->
            <div class="hidden md:flex items-center flex-1 max-w-md mx-8">
                <input type="text" id="searchInput" placeholder="বই বা লেখক খুঁজুন..." class="w-full px-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-l-lg border-0 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <button class="bg-blue-600 px-5 py-2 rounded-r-lg text-white font-bold text-sm hover:bg-blue-700 transition">🔍</button>
            </div>

            <!-- ডেস্কটপ মেনু ও মোবাইল টগল -->
            <div class="flex items-center gap-3">
                <a href="/cart.html" class="relative flex items-center gap-1.5 bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-400 px-3.5 py-2 rounded-lg font-semibold transition border border-blue-100 dark:border-gray-600">
                    🛒 <span class="text-sm hidden sm:inline">কার্ট</span>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">0</span>
                </a>
                
                <div id="authNavContainer" class="flex items-center gap-2">
                    <a href="/login.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 transition">লগইন</a>
                    <a href="/signup.html" class="hidden sm:inline-block bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-700 transition">সাইন আপ</a>
                </div>

                <!-- মোবাইল মেনু বাটন -->
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-gray-600 dark:text-gray-300 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
                </button>
            </div>
        </div>

        <!-- মোবাইল ড্রপডাউন মেনু -->
        <div id="mobileMenu" class="hidden md:hidden bg-white dark:bg-gray-800 border-t dark:border-gray-700 px-4 py-3 space-y-3">
            <div class="flex items-center">
                <input type="text" id="mobileSearchInput" placeholder="বই খুঁজুন..." class="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 rounded-l-lg text-sm outline-none">
                <button class="bg-blue-600 text-white px-4 py-2 rounded-r-lg text-sm font-bold">🔍</button>
            </div>
            <div class="flex flex-col gap-2 pt-2 border-t dark:border-gray-700" id="mobileAuthLinks">
                <!-- ডাইনামিক লোড হবে -->
            </div>
        </div>
    </nav>

    <!-- মূল কনটেন্ট সেকশন -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6 space-y-12">

        <!-- ১. মূল ই-কমার্স বইয়ের দোকান সেকশন -->
        <section>
            <div class="flex justify-between items-center mb-6 border-b pb-3 dark:border-gray-700">
                <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white flex items-center gap-2">🔥 জনপ্রিয় ই-কমার্স বইসমূহ</h2>
            </div>
            <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
                <!-- ডাইনামিক বইয়ের প্রোডাক্ট কার্ড লোড হবে -->
            </div>
        </section>

        <!-- ২. সোশ্যাল মিডিয়া ও সাহিত্য ফিড সেকশন -->
        <section class="space-y-6">
            <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                <h2 class="text-xl font-extrabold text-gray-900 dark:text-white flex items-center gap-2">📖 গল্প, ব্লগ এবং সাহিত্য ফিড</h2>
                <a href="/profile.html" id="createPostTrigger" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow transition flex items-center gap-1.5">
                    ✍️ পোস্ট লিখুন
                </a>
            </div>

            <!-- পোস্ট গ্রিড ফিড -->
            <div id="blogsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- ডাইনামিক পোস্ট কার্ড লোড হবে -->
            </div>
        </section>
    </main>

    <!-- ফুল পোস্ট ভিউ ও কমেন্ট মডাল -->
    <div id="postDetailsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl relative modal-animate">
            <button onclick="closePostModal()" class="absolute top-4 right-4 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-red-500 hover:text-white h-8 w-8 rounded-full flex items-center justify-center font-bold transition">✕</button>
            <div id="modalBodyContent" class="p-6 space-y-4">
                <!-- ফুল পোস্ট ও কমেন্ট এখানে লোড হবে -->
            </div>
        </div>
    </div>

    <!-- ফুটার (অ্যাডমিন সেটিংস থেকে ডাইনামিক তথ্য সহ) -->
    <footer class="bg-white dark:bg-gray-800 border-t dark:border-gray-700 py-6 text-center text-sm text-gray-500 mt-12">
        <p id="footerText">&copy; ২০২৬ Boi Chokro. সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            if(menu) menu.classList.toggle('hidden');
        }

        async function initIndex() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) currentUser = session.user;

            await loadAdminSettings();
            renderAuthNav();
            loadEcommerceBooks();
            loadApprovedBlogs();
        }

        // অ্যাডমিন ড্যাশবোর্ডের সেটিংস (লোগো, টাইটেল, ফুটার) লোড করার ফাংশন
        async function loadAdminSettings() {
            try {
                const { data: settings } = await supabaseClient.from('settings').select('*').maybeSingle();
                if (settings) {
                    if (settings.site_title || settings.title) {
                        const title = settings.site_title || settings.title;
                        document.getElementById('pageTitle').innerText = title;
                        document.getElementById('siteTitleText').innerText = title;
                    }
                    if (settings.logo_url || settings.logo) {
                        const logoUrl = settings.logo_url || settings.logo;
                        const logoEl = document.getElementById('siteLogo');
                        logoEl.src = logoUrl;
                        logoEl.classList.remove('hidden');
                    }
                    if (settings.footer_text || settings.footer) {
                        document.getElementById('footerText').innerHTML = settings.footer_text || settings.footer;
                    }
                }
            } catch (e) {
                console.log('Settings table might not exist yet, using defaults.');
            }
        }

        function renderAuthNav() {
            const authContainer = document.getElementById('authNavContainer');
            const mobileAuthLinks = document.getElementById('mobileAuthLinks');

            if (currentUser) {
                authContainer.innerHTML = `
                    <a href="/profile.html" class="flex items-center gap-2 bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-300 px-3.5 py-2 rounded-lg font-bold text-sm border border-blue-100 dark:border-gray-600 hover:bg-blue-100 transition">
                        👤 প্রোফাইল
                    </a>
                    <button onclick="logoutUser()" class="bg-red-50 dark:bg-gray-700 text-red-600 dark:text-red-400 px-3 py-2 rounded-lg font-bold text-sm hover:bg-red-100 transition">লগআউট</button>
                `;
                mobileAuthLinks.innerHTML = `
                    <a href="/profile.html" class="block py-2 px-3 bg-blue-50 dark:bg-gray-700 rounded-lg font-bold text-blue-600 dark:text-blue-300">👤 আমার প্রোফাইল</a>
                    <button onclick="logoutUser()" class="w-full text-left py-2 px-3 bg-red-50 dark:bg-gray-700 rounded-lg font-bold text-red-600 dark:text-red-400">লগআউট</button>
                `;
            } else {
                authContainer.innerHTML = `
                    <a href="/login.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-lg font-bold text-sm hover:bg-gray-200 transition">লগইন</a>
                    <a href="/signup.html" class="hidden sm:inline-block bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-700 transition">সাইন আপ</a>
                `;
                mobileAuthLinks.innerHTML = `
                    <a href="/login.html" class="block py-2 px-3 text-center bg-gray-100 dark:bg-gray-700 rounded-lg font-bold">লগইন</a>
                    <a href="/signup.html" class="block py-2 px-3 text-center bg-blue-600 text-white rounded-lg font-bold">সাইন আপ</a>
                `;
            }
        }

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // ই-কমার্স বই ও প্রোডাক্ট লোড করার সঠিক ফাংশন
        async function loadEcommerceBooks() {
            const grid = document.getElementById('productsGrid');
            if(!grid) return;
            
            const { data: books, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });

            if (error || !books || books.length === 0) {
                grid.innerHTML = `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col justify-between">
                        <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300" class="w-full h-48 object-cover rounded-lg mb-3">
                        <h4 class="font-bold text-sm mb-1 text-gray-900 dark:text-white">প্রোগ্রামিংয়ের হাতেখড়ি</h4>
                        <p class="text-xs text-blue-600 font-bold mb-3">৳ ৩৫০</p>
                        <button onclick="alert('কার্টে যোগ করা হয়েছে!')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-xs font-bold transition">কার্টে যোগ করুন</button>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col justify-between">
                        <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=300" class="w-full h-48 object-cover rounded-lg mb-3">
                        <h4 class="font-bold text-sm mb-1 text-gray-900 dark:text-white">ডিজিটাল মার্কেটিং গাইড</h4>
                        <p class="text-xs text-blue-600 font-bold mb-3">৳ ৪৫০</p>
                        <button onclick="alert('কার্টে যোগ করা হয়েছে!')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-xs font-bold transition">কার্টে যোগ করুন</button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = books.map(book => `
                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col justify-between hover:shadow-md transition">
                    <img src="${book.image_url || book.image || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300'}" class="w-full h-48 object-cover rounded-lg mb-3">
                    <h4 class="font-bold text-sm mb-1 text-gray-900 dark:text-white line-clamp-1">${escapeHTML(book.title)}</h4>
                    <p class="text-xs text-blue-600 dark:text-blue-400 font-bold mb-3">৳ ${book.price || 0}</p>
                    <button onclick="addToCart('${book.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-xs font-bold transition">কার্টে যোগ করুন</button>
                </div>
            `).join('');
        }

        // কার্টে যোগ করার ফাংশন
        window.addToCart = async (bookId) => {
            if(!currentUser) {
                alert('দয়া করে প্রথমে লগইন করুন!');
                window.location.href = '/login.html';
                return;
            }
            alert('✅ সফলভাবে কার্টে যোগ করা হয়েছে!');
        };

        // শুধুমাত্র 'approved' স্ট্যাটাসযুক্ত পোস্টগুলো ইনডেক্সে দেখাবে
        async function loadApprovedBlogs() {
            const grid = document.getElementById('blogsGrid');
            if(!grid) return;
            grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">পোস্ট লোড হচ্ছে...</p>';

            const { data: blogs, error } = await supabaseClient
                .from('blogs')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: false });

            if (error || !blogs || blogs.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8 bg-white dark:bg-gray-800 rounded-2xl shadow-sm">কোনো প্রকাশিত পোস্ট বা গল্প পাওয়া যায়নি।</p>`;
                return;
            }

            const authorIds = [...new Set(blogs.map(b => b.author_id))];
            const { data: profiles } = await supabaseClient.from('profiles').select('id, full_name, profile_image').in('id', authorIds);
            const profileMap = {};
            if(profiles) {
                profiles.forEach(p => profileMap[p.id] = p);
            }

            grid.innerHTML = blogs.map(blog => {
                const author = profileMap[blog.author_id] || { full_name: 'নামহীন লেখক', profile_image: 'https://via.placeholder.com/40' };
                const authorImg = author.profile_image || `https://ui-avatars.com/api/?name=${encodeURIComponent(author.full_name)}&background=random`;

                return `
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="p-4 flex items-center gap-3 border-b dark:border-gray-700">
                            <img src="${authorImg}" class="w-10 h-10 rounded-full object-cover border">
                            <div>
                                <h4 class="font-bold text-sm text-gray-900 dark:text-white">${escapeHTML(author.full_name)}</h4>
                                <p class="text-xs text-gray-400">${new Date(blog.created_at).toLocaleDateString('bn-BD')}</p>
                            </div>
                        </div>
                        
                        ${blog.image_url ? `<div class="max-h-60 overflow-hidden bg-gray-100"><img src="${blog.image_url}" class="w-full h-full object-cover cursor-pointer" onclick="openPostDetails('${blog.id}')"></div>` : ''}
                        
                        <div class="p-4 space-y-2">
                            <h3 class="text-lg font-bold text-gray-900 dark:text-white cursor-pointer hover:text-blue-600 transition" onclick="openPostDetails('${blog.id}')">${escapeHTML(blog.title)}</h3>
                            <p class="text-sm text-gray-600 dark:text-gray-300 line-clamp-3">${escapeHTML(blog.content)}</p>
                        </div>
                    </div>

                    <div class="px-4 py-3 bg-gray-50 dark:bg-gray-750 border-t dark:border-gray-700 flex justify-between items-center">
                        <button onclick="openPostDetails('${blog.id}')" class="text-blue-600 dark:text-blue-400 font-bold text-sm hover:underline flex items-center gap-1">💬 কমেন্ট ও বিস্তারিত</button>
                        <span class="text-xs font-semibold px-2.5 py-1 bg-green-100 text-green-700 rounded-full">প্রকাশিত</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        window.openPostDetails = async (blogId) => {
            const modal = document.getElementById('postDetailsModal');
            const contentDiv = document.getElementById('modalBodyContent');
            modal.classList.remove('hidden');
            contentDiv.innerHTML = '<p class="text-center py-10 text-gray-500">লোড হচ্ছে...</p>';

            const { data: blog } = await supabaseClient.from('blogs').select('*').eq('id', blogId).single();
            if(!blog) { contentDiv.innerHTML = '<p class="text-red-500 text-center">পোস্ট পাওয়া যায়নি।</p>'; return; }

            const { data: author } = await supabaseClient.from('profiles').select('full_name, profile_image').eq('id', blog.author_id).maybeSingle();
            const authorName = author?.full_name || 'নামহীন লেখক';
            const authorImg = author?.profile_image || `https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&background=random`;

            const { data: comments } = await supabaseClient.from('comments').select('*').eq('blog_id', blogId).order('created_at', { ascending: true });
            
            let commentProfiles = {};
            if(comments && comments.length > 0) {
                const cUserIds = [...new Set(comments.map(c => c.user_id))];
                const { data: cProfiles } = await supabaseClient.from('profiles').select('id, full_name, profile_image').in('id', cUserIds);
                if(cProfiles) cProfiles.forEach(p => commentProfiles[p.id] = p);
            }

            contentDiv.innerHTML = `
                <div class="flex items-center gap-3 mb-4">
                    <img src="${authorImg}" class="w-12 h-12 rounded-full object-cover border">
                    <div>
                        <h3 class="font-bold text-base text-gray-900 dark:text-white">${escapeHTML(authorName)}</h3>
                        <p class="text-xs text-gray-400">${new Date(blog.created_at).toLocaleString('bn-BD')}</p>
                    </div>
                </div>
                <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white mb-2">${escapeHTML(blog.title)}</h2>
                ${blog.image_url ? `<img src="${blog.image_url}" class="w-full max-h-96 object-cover rounded-xl mb-4 shadow-sm">` : ''}
                <div class="text-gray-700 dark:text-gray-200 text-base leading-relaxed whitespace-pre-line mb-6">${escapeHTML(blog.content)}</div>

                <hr class="dark:border-gray-700 my-4">

                <h4 class="font-bold text-lg mb-3 text-gray-900 dark:text-white">💬 কমেন্টসমূহ (${comments ? comments.length : 0})</h4>
                
                <div class="space-y-3 max-h-60 overflow-y-auto mb-4 pr-2">
                    ${(!comments || comments.length === 0) ? '<p class="text-sm text-gray-400 text-center py-4">এখনো কোনো কমেন্ট নেই। প্রথম কমেন্ট করুন!</p>' : 
                        comments.map(c => {
                            const commenter = commentProfiles[c.user_id] || { full_name: 'ব্যবহারকারী', profile_image: 'https://via.placeholder.com/30' };
                            return `
                            <div class="flex items-start gap-2.5 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl">
                                <img src="${commenter.profile_image || 'https://via.placeholder.com/30'}" class="w-8 h-8 rounded-full object-cover mt-0.5">
                                <div class="flex-1">
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-xs text-gray-900 dark:text-white">${escapeHTML(commenter.full_name)}</span>
                                        <span class="text-[10px] text-gray-400">${new Date(c.created_at).toLocaleTimeString('bn-BD', {hour: '2-digit', minute:'2-digit'})}</span>
                                    </div>
                                    <p class="text-sm text-gray-700 dark:text-gray-200 mt-1">${escapeHTML(c.comment_text)}</p>
                                </div>
                            </div>
                            `;
                        }).join('')
                    }
                </div>

                ${currentUser ? `
                <form onsubmit="submitComment(event, '${blog.id}')" class="flex gap-2">
                    <input type="text" id="commentInput_${blog.id}" required placeholder="একটি সুন্দর কমেন্ট লিখুন..." class="flex-1 px-4 py-2 border rounded-xl dark:bg-gray-700 dark:border-gray-600 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-xl text-sm transition">পাঠান</button>
                </form>
                ` : `
                <p class="text-center text-sm py-2 bg-gray-50 dark:bg-gray-700 rounded-xl text-gray-500">কমেন্ট করতে অনুগ্রহ করে <a href="/login.html" class="text-blue-600 font-bold underline">লগইন করুন</a>।</p>
                `}
            `;
        }

        window.closePostModal = () => document.getElementById('postDetailsModal').classList.add('hidden');

        window.submitComment = async (e, blogId) => {
            e.preventDefault();
            if(!currentUser) { alert('লগইন করুন'); return; }

            const input = document.getElementById(`commentInput_${blogId}`);
            const text = input.value.trim();
            if(!text) return;

            const { error } = await supabaseClient.from('comments').insert([{
                blog_id: blogId,
                user_id: currentUser.id,
                comment_text: text
            }]);

            if(!error) {
                input.value = '';
                openPostDetails(blogId);
            } else {
                alert('কমেন্ট করতে সমস্যা হয়েছে: ' + error.message);
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        initIndex();
    </script>
</body>
</html>
