    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allBooksData = [];
        let filteredBooksData = [];
        let userWishlist = [];

        window.showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-animate px-5 py-4 rounded-lg shadow-2xl text-white font-bold flex items-center gap-3 ${isError ? 'bg-red-600 border-l-4 border-red-800' : 'bg-green-600 border-l-4 border-green-800'}`;
            toast.innerHTML = `<span class="text-2xl">${isError ? '⚠️' : '✅'}</span><span class="text-sm md:text-base pr-2">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transform = 'translateX(100%)'; 
                toast.style.transition = 'all 0.3s ease'; 
                setTimeout(() => toast.remove(), 300); 
            }, 4000);
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function sanitizeSearchQuery(query) {
            return query.replace(/[<>]/g, '').trim(); 
        }

        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        window.toggleDarkMode = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            const mobEl = document.getElementById('cartCountMobile');
            const deskEl = document.getElementById('cartCountDesktop');
            if(mobEl) mobEl.innerText = cart.length;
            if(deskEl) deskEl.innerText = cart.length;
        }

        async function loadAdminSettings() {
            try {
                const { data: settings, error } = await supabaseClient.from('site_settings').select('*').limit(1).maybeSingle();
                if (settings && !error) {
                    const companyName = settings.company_name || 'Boi Chokro';
                    document.getElementById('pageTitle').innerText = companyName + ' - অনলাইন বইঘর';
                    const headerName = document.getElementById('web_header_name');
                    if(headerName) headerName.innerText = companyName;

                    const logoUrl = settings.logo_url || settings.logo || '';
                    if (logoUrl) {
                        const logoEl = document.getElementById('web_header_logo');
                        if(logoEl) {
                            logoEl.src = logoUrl;
                            logoEl.classList.remove('hidden');
                        }
                    }

                    const taglineText = settings.banner_text || settings.tagline || '';
                    if (taglineText) {
                        const taglineEl = document.getElementById('web_tagline');
                        if(taglineEl) taglineEl.innerText = taglineText;
                    }

                    const bannerUrl = settings.banner_url || '';
                    if (bannerUrl) {
                        const heroBanner = document.getElementById('heroBannerImage');
                        if (heroBanner) {
                            heroBanner.style.backgroundImage = `url('${bannerUrl}')`;
                        }
                    }

                    const phone = settings.phone || '';
                    const address = settings.address || '';
                    const footerContact = document.getElementById('web_footer_contact');
                    if (footerContact) {
                        let contactHTML = '';
                        if (phone) contactHTML += `📞 ফোন: ${phone} `;
                        if (address) contactHTML += ` | 📍 ঠিকানা: ${address}`;
                        footerContact.innerHTML = contactHTML;
                    }

                    const footerText = settings.footer_text || '';
                    if (footerText) {
                        const footerEl = document.getElementById('web_footer_text');
                        if(footerEl) footerEl.innerHTML = footerText;
                    }
                }
            } catch (e) {
                console.log('site_settings table fetch error:', e);
            }
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authBtnDesktop = document.getElementById('authButtonsDesktop');
            const authBtnMobile = document.getElementById('authButtonsMobile');
            
            if (session) {
                currentUser = session.user;
                const { data: wish } = await supabaseClient.from('wishlists').select('book_id').eq('user_id', currentUser.id);
                if(wish) userWishlist = wish.map(w => w.book_id);

                if(authBtnDesktop) {
                    authBtnDesktop.innerHTML = `
                        <a href="/profile.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-200 transition">প্রোফাইল</a>
                        <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-semibold border border-red-200 hover:bg-red-100 transition">লগআউট</button>
                    `;
                }
                if(authBtnMobile) {
                    authBtnMobile.innerHTML = `
                        <a href="/profile.html" class="bg-blue-600 text-white px-2.5 py-1 rounded-md font-bold text-xs shadow">প্রোফাইল</a>
                    `;
                }
                loadNotifications();
            } else {
                currentUser = null;
                if(authBtnDesktop) {
                    authBtnDesktop.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">লগইন</a>`;
                }
                if(authBtnMobile) {
                    authBtnMobile.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-2.5 py-1 rounded-md font-bold text-xs">লগইন</a>`;
                }
            }
        }

        async function loadNotifications() {
            if(!currentUser) return;
            const { data: notifs } = await supabaseClient.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            
            const badge = document.getElementById('notifBadge');
            const badgeMob = document.getElementById('notifBadgeMobile');
            const list = document.getElementById('notifList');
            
            if(!notifs || notifs.length === 0) {
                if(list) list.innerHTML = `<div class="p-4 text-center text-sm text-gray-500">কোনো নোটিফিকেশন নেই</div>`;
                if(badge) badge.classList.add('hidden');
                if(badgeMob) badgeMob.classList.add('hidden');
                return;
            }

            const unread = notifs.filter(n => !n.is_read).length;
            if(unread > 0) { 
                if(badge) { badge.innerText = unread; badge.classList.remove('hidden'); }
                if(badgeMob) { badgeMob.innerText = unread; badgeMob.classList.remove('hidden'); }
            } else {
                if(badge) badge.classList.add('hidden');
                if(badgeMob) badgeMob.classList.add('hidden');
            }

            if(list) {
                list.innerHTML = notifs.map(n => `
                    <div class="p-3 text-sm border-b dark:border-gray-700 ${!n.is_read ? 'bg-blue-50 dark:bg-gray-700 font-semibold' : 'text-gray-600'}">
                        ${escapeHTML(n.message)}
                        <p class="text-[10px] text-gray-400 mt-1">${new Date(n.created_at).toLocaleString('bn-BD')}</p>
                    </div>
                `).join('');
            }
        }

        window.toggleNotifications = () => { document.getElementById('notifDropdown').classList.toggle('hidden'); };

        async function loadBooks() {
            const grid = document.getElementById('bookGrid');
            const { data: books, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
            
            if (error || !books || books.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">কোনো বই পাওয়া যায়নি।</p>`;
                return;
            }

            allBooksData = books;
            filteredBooksData = [...books];

            const { data: categories } = await supabaseClient.from('categories').select('*').order('name');
            const categoryContainer = document.getElementById('categoryButtons');
            if (categories) {
                categories.forEach(cat => {
                    categoryContainer.insertAdjacentHTML('beforeend', `
                        <button onclick="filterCategory('${escapeHTML(cat.name)}')" class="category-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600 px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold hover:bg-blue-50 transition shadow-sm">${escapeHTML(cat.name)}</button>
                    `);
                });
            }
            renderBooks(filteredBooksData);
        }

        function createBookCard(book) {
            const bookId = book.id || book.book_id;
            const bookTitle = book.title || book.name || book.book_name || 'বইয়ের নাম নেই';
            const bookAuthor = book.author || book.writer || 'অজ্ঞাত লেখক';
            
            const currentPrice = book.discount_price || book.price || book.sale_price || book.amount || 0;
            const originalPrice = book.original_price || book.regular_price || 0;
            const hasDiscount = originalPrice && currentPrice && originalPrice > currentPrice;
            let discountPercent = 0;
            if (hasDiscount) discountPercent = Math.round(((originalPrice - currentPrice) / originalPrice) * 100);
            
            let rawImg = book.cover_url || book.image_url || book.image || book.cover || book.cover_image || book.photo || book.img || '';
            let bookImage = 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300';
            
            if (rawImg) {
                if (rawImg.startsWith('http')) {
                    bookImage = rawImg;
                } else {
                    const { data: pubData } = supabaseClient.storage.from('book-covers').getPublicUrl(rawImg);
                    bookImage = pubData.publicUrl || rawImg;
                }
            }

            return `
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col overflow-hidden relative group">
                <a href="/book-details.html?id=${bookId}" class="block w-full aspect-[3/4] bg-gray-100 dark:bg-gray-700 overflow-hidden relative">
                    ${hasDiscount ? `<div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-md z-10">${discountPercent}% ছাড়</div>` : ''}
                    <img src="${bookImage}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300'">
                </a>
                <div class="p-3 flex flex-col flex-grow justify-between">
                    <div>
                        <a href="/book-details.html?id=${bookId}">
                            <h3 class="font-bold text-sm text-gray-900 dark:text-white leading-snug line-clamp-2 mb-1 hover:text-blue-600 transition">${escapeHTML(bookTitle)}</h3>
                        </a>
                        <p class="text-xs text-gray-500 mb-3">${escapeHTML(bookAuthor)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-lg font-bold text-blue-600 dark:text-blue-400">৳ ${currentPrice}</span>
                        ${hasDiscount ? `<span class="text-gray-400 line-through text-xs">৳ ${originalPrice}</span>` : ''}
                    </div>
                </div>
            </div>`;
        }

        function renderBooks(books) {
            const grid = document.getElementById('bookGrid');
            if(books.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">এই ক্যাটাগরিতে কোনো বই নেই।</p>`;
                return;
            }
            grid.innerHTML = books.map(book => createBookCard(book)).join('');
        }

        window.filterCategory = (category) => {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'); 
                btn.classList.add('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300', 'border-gray-200', 'dark:border-gray-600');
            });
            const clickedBtn = Array.from(document.querySelectorAll('.category-btn')).find(btn => btn.innerText.trim() === (category === 'all' ? 'সব বই' : category));
            if (clickedBtn) { 
                clickedBtn.classList.remove('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300', 'border-gray-200', 'dark:border-gray-600'); 
                clickedBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-600'); 
            }

            if(category === 'all') {
                filteredBooksData = [...allBooksData];
            } else {
                filteredBooksData = allBooksData.filter(b => b.category === category);
            }
            renderBooks(filteredBooksData);
        }

        // ==========================================
        // সার্চ ফাংশন (মোবাইলে সব রেজাল্ট দেখানোর জন্য স্ক্রোল সহ)
        // ==========================================
        window.handleSearch = (source) => {
            const input = source === 'desktop' ? document.getElementById('searchInput') : document.getElementById('searchInputMobile');
            const query = sanitizeSearchQuery(input.value.toLowerCase());
            const dropdown = source === 'desktop' ? document.getElementById('searchResultsDropdown') : document.getElementById('searchResultsDropdownMobile');
            
            if(query === '') {
                dropdown.classList.add('hidden');
                renderBooks(allBooksData);
                return;
            }

            filteredBooksData = allBooksData.filter(book => {
                const title = (book.title || '').toLowerCase();
                const author = (book.author || '').toLowerCase();
                return title.includes(query) || author.includes(query);
            });
            
            renderBooks(filteredBooksData);

            if(filteredBooksData.length > 0) {
                dropdown.classList.remove('hidden');
                // সব সার্চ রেজাল্ট স্ক্রোল করে দেখার জন্য স্লাইস বা লিমিট তুলে দেওয়া হয়েছে এবং max-h-72 দেওয়া হয়েছে
                dropdown.innerHTML = filteredBooksData.map(book => {
                    const bId = book.id || book.book_id;
                    const bTitle = book.title || book.name || 'বই';
                    const bAuthor = book.author || '';
                    let rawImg = book.cover_url || book.image_url || book.image || '';
                    let bImg = rawImg.startsWith('http') ? rawImg : 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=100';

                    return `
                    <a href="/book-details.html?id=${bId}" class="flex items-center gap-3 p-3 hover:bg-gray-50 dark:hover:bg-gray-700 border-b border-gray-100 dark:border-gray-700 last:border-0 cursor-pointer">
                        <img src="${bImg}" class="w-10 h-14 object-cover rounded shadow-sm flex-shrink-0">
                        <div class="overflow-hidden">
                            <p class="font-bold text-sm text-gray-900 dark:text-white truncate">${escapeHTML(bTitle)}</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${escapeHTML(bAuthor)}</p>
                        </div>
                    </a>
                `;}).join('');
            } else {
                dropdown.classList.remove('hidden');
                dropdown.innerHTML = `<p class="p-4 text-center text-sm text-gray-500 dark:text-gray-400">কোনো বই পাওয়া যায়নি।</p>`;
            }
        }

        // ==========================================
        // ব্লগ ও সাহিত্য ফিড
        // ==========================================
        async function loadBlogs() {
            const blogList = document.getElementById('blogList');
            if(!blogList) return;
            
            const { data: blogs, error } = await supabaseClient
                .from('blogs')
                .select('*')
                .eq('status', 'approved')
                .order('created_at', { ascending: false });
            
            if (error || !blogs || blogs.length === 0) {
                blogList.innerHTML = `<div class="col-span-full text-center py-10 bg-white dark:bg-gray-800 rounded-xl shadow-sm"><p class="text-gray-500">এখনো কোনো গল্প বা ব্লগ প্রকাশিত হয়নি।</p></div>`;
                return;
            }

            const authorIds = [...new Set(blogs.map(b => b.author_id))];
            const { data: profiles } = await supabaseClient.from('profiles').select('id, full_name, profile_image').in('id', authorIds);
            const profileMap = {};
            if(profiles) {
                profiles.forEach(p => profileMap[p.id] = p);
            }

            const blogHTML = await Promise.all(blogs.map(async (blog) => {
                const author = profileMap[blog.author_id] || { full_name: 'নামহীন লেখক', profile_image: '' };
                const authorImg = author.profile_image || `https://ui-avatars.com/api/?name=${encodeURIComponent(author.full_name)}&background=random`;
                
                const { count: likeCount } = await supabaseClient.from('blog_likes').select('*', { count: 'exact', head: true }).eq('blog_id', blog.id);

                return `
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col h-full overflow-hidden hover:shadow-md transition">
                    <div>
                        <div class="p-4 flex items-center gap-3 border-b dark:border-gray-700 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition" onclick="window.location.href='/profile.html?id=${blog.author_id}'">
                            <img src="${authorImg}" class="w-10 h-10 rounded-full object-cover border">
                            <div>
                                <h4 class="font-bold text-sm text-gray-900 dark:text-white hover:text-blue-600 transition">${escapeHTML(author.full_name)}</h4>
                                <p class="text-xs text-gray-400">${new Date(blog.created_at).toLocaleDateString('bn-BD')}</p>
                            </div>
                        </div>

                        ${blog.image_url ? `<div class="max-h-60 overflow-hidden bg-gray-100 cursor-pointer" onclick="openPostDetails('${blog.id}')"><img src="${blog.image_url}" class="w-full h-full object-cover"></div>` : ''}
                        
                        <div class="p-4 space-y-2">
                            <h3 class="text-lg font-bold text-gray-900 dark:text-white cursor-pointer hover:text-blue-600 transition line-clamp-2" onclick="openPostDetails('${blog.id}')">${escapeHTML(blog.title)}</h3>
                            <p class="text-sm text-gray-600 dark:text-gray-300 line-clamp-3">${escapeHTML(blog.content)}</p>
                        </div>
                    </div>

                    <div class="p-4 mt-auto border-t border-gray-100 dark:border-gray-700 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <button onclick="likeBlog('${blog.id}')" class="flex items-center gap-1 text-gray-500 hover:text-red-500 transition text-sm">
                                ❤️ <span id="like-count-${blog.id}">${likeCount || 0}</span>
                            </button>
                            <button onclick="openPostDetails('${blog.id}')" class="flex items-center gap-1 text-gray-500 hover:text-blue-500 transition text-sm">
                                💬 কমেন্ট
                            </button>
                        </div>
                        <button onclick="openPostDetails('${blog.id}')" class="text-xs font-bold text-blue-600 hover:underline">বিস্তারিত</button>
                    </div>
                </div>
                `;
            }));

            blogList.innerHTML = blogHTML.join('');
        }

        window.likeBlog = async (blogId) => {
            if(!currentUser) { showToast('লাইক দিতে লগইন করুন!', true); return; }
            const { data: existing } = await supabaseClient.from('blog_likes').select('id').eq('blog_id', blogId).eq('user_id', currentUser.id).maybeSingle();
            
            if(existing) {
                await supabaseClient.from('blog_likes').delete().eq('id', existing.id);
            } else {
                await supabaseClient.from('blog_likes').insert([{ blog_id: blogId, user_id: currentUser.id }]);
            }
            loadBlogs();
        }

        window.openPostDetails = async (blogId) => {
            const modal = document.getElementById('postDetailsModal');
            const contentDiv = document.getElementById('modalBodyContent');
            modal.classList.remove('hidden');
            contentDiv.innerHTML = '<p class="text-center py-10 text-gray-500">লোড হচ্ছে...</p>';

            const { data: blog } = await supabaseClient.from('blogs').select('*').eq('id', blogId).single();
            if(!blog) { contentDiv.innerHTML = '<p class="text-red-500 text-center">পোস্ট পাওয়া যায়নি।</p>'; return; }

            const { data: author } = await supabaseClient.from('profiles').select('id, full_name, profile_image').eq('id', blog.author_id).maybeSingle();
            const authorName = author?.full_name || 'নামহীন লেখক';
            const authorImg = author?.profile_image || `https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&background=random`;

            const { data: comments } = await supabaseClient.from('blog_comments').select('*').eq('blog_id', blogId).order('created_at', { ascending: true });
            
            let commentProfiles = {};
            if(comments && comments.length > 0) {
                const cUserIds = [...new Set(comments.map(c => c.user_id))];
                const { data: cProfiles } = await supabaseClient.from('profiles').select('id, full_name, profile_image').in('id', cUserIds);
                if(cProfiles) cProfiles.forEach(p => commentProfiles[p.id] = p);
            }

            contentDiv.innerHTML = `
                <div class="flex items-center gap-3 mb-4 cursor-pointer hover:opacity-80 transition" onclick="window.location.href='/profile.html?id=${blog.author_id}'">
                    <img src="${authorImg}" class="w-12 h-12 rounded-full object-cover border">
                    <div>
                        <h3 class="font-bold text-base text-gray-900 dark:text-white hover:text-blue-600">${escapeHTML(authorName)}</h3>
                        <p class="text-xs text-gray-400">${new Date(blog.created_at).toLocaleString('bn-BD')}</p>
                    </div>
                </div>
                <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white mb-2">${escapeHTML(blog.title)}</h2>
                ${blog.image_url ? `<img src="${blog.image_url}" class="w-full max-h-96 object-cover rounded-xl mb-4 shadow-sm">` : ''}
                <div class="text-gray-700 dark:text-gray-200 text-base leading-relaxed whitespace-pre-line mb-6">${escapeHTML(blog.content)}</div>

                <hr class="dark:border-gray-700 my-4">

                <h4 class="font-bold text-lg mb-3 text-gray-900 dark:text-white">💬 কমেন্টসমূহ (${comments ? comments.length : 0})</h4>
                
                <div class="space-y-3 max-h-60 overflow-y-auto mb-4 pr-2">
                    ${(!comments || comments.length === 0) ? '<p class="text-sm text-gray-400 text-center py-4">এখনো কোনো কমেন্ট নেই। প্রথম কমেন্ট করুন!</p>' : 
                        comments.map(c => {
                            const commenter = commentProfiles[c.user_id] || { full_name: 'ব্যবহারকারী', profile_image: 'https://via.placeholder.com/30' };
                            return `
                            <div class="flex items-start gap-2.5 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl">
                                <img src="${commenter.profile_image || 'https://via.placeholder.com/30'}" class="w-8 h-8 rounded-full object-cover mt-0.5">
                                <div class="flex-1">
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-xs text-gray-900 dark:text-white">${escapeHTML(commenter.full_name)}</span>
                                        <span class="text-[10px] text-gray-400">${new Date(c.created_at).toLocaleTimeString('bn-BD', {hour: '2-digit', minute:'2-digit'})}</span>
                                    </div>
                                    <p class="text-sm text-gray-700 dark:text-gray-200 mt-1">${escapeHTML(c.comment)}</p>
                                </div>
                            </div>
                            `;
                        }).join('')
                    }
                </div>

                ${currentUser ? `
                <form onsubmit="submitComment(event, '${blog.id}')" class="flex gap-2">
                    <input type="text" id="commentInput_${blog.id}" required placeholder="একটি সুন্দর কমেন্ট লিখুন..." class="flex-1 px-4 py-2 border rounded-xl dark:bg-gray-700 dark:border-gray-600 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-xl text-sm transition">পাঠান</button>
                </form>
                ` : `
                <p class="text-center text-sm py-2 bg-gray-50 dark:bg-gray-700 rounded-xl text-gray-500">কমেন্ট করতে অনুগ্রহ করে <a href="/login.html" class="text-blue-600 font-bold underline">লগইন করুন</a>।</p>
                `}
            `;
        }

        window.closePostModal = () => document.getElementById('postDetailsModal').classList.add('hidden');

        window.submitComment = async (e, blogId) => {
            e.preventDefault();
            if(!currentUser) { alert('লগইন করুন'); return; }

            const input = document.getElementById(`commentInput_${blogId}`);
            const text = input.value.trim();
            if(!text) return;

            const { error } = await supabaseClient.from('blog_comments').insert([{
                blog_id: blogId,
                user_id: currentUser.id,
                comment: text
            }]);

            if(!error) {
                input.value = '';
                openPostDetails(blogId);
            } else {
                alert('কমেন্ট করতে সমস্যা হয়েছে: ' + error.message);
            }
        }

        window.submitBlog = async () => {
            if(!currentUser) { showToast('পোস্ট লিখতে প্রথমে লগইন করুন!', true); return; }
            
            const title = document.getElementById('newBlogTitle').value.trim();
            const content = document.getElementById('newBlogContent').value.trim();
            const imageFile = document.getElementById('newBlogImage').files[0];
            const btn = document.getElementById('submitBlogBtn');
            
            if(!title || !content) { showToast('শিরোনাম এবং বিষয়বস্তু লিখুন!', true); return; }
            btn.innerText = 'সাবমিট হচ্ছে...'; btn.disabled = true;

            try {
                let image_url = null;
                if (imageFile) {
                    const fileName = `blog_${Date.now()}.${imageFile.name.spec ? '' : imageFile.name.split('.').pop()}`;
                    const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, imageFile);
                    if (uploadError) throw new Error("ছবি আপলোডে সমস্যা: " + uploadError.message);
                    const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                    image_url = data.publicUrl;
                }

                const { error } = await supabaseClient.from('blogs').insert([{ 
                    author_id: currentUser.id, title: title, content: content, image_url: image_url, status: 'pending' 
                }]);
                
                if (error) throw new Error(error.message);

                showToast('✅ আপনার পোস্টটি সফলভাবে জমা হয়েছে। অ্যাডমিন অ্যাপ্রুভ করার পর ফিডে দেখাবে।', false);
                document.getElementById('newBlogTitle').value = '';
                document.getElementById('newBlogContent').value = '';
                document.getElementById('newBlogImage').value = '';
                document.getElementById('writeBlogForm').classList.add('hidden');

            } catch (err) {
                showToast('সমস্যা: ' + err.message, true);
            } finally {
                btn.innerText = 'সাবমিট করুন'; btn.disabled, btn.disabled = false;
            }
        }

        window.handleLogout = async () => { await supabaseClient.auth.signOut(); checkAuth(); showToast('লগআউট হয়েছে।', false); }

        async function init() {
            await loadAdminSettings(); 
            await checkAuth();
            await loadBooks();
            await loadBlogs();
            updateCartCount();
        }

        init();
    </script>
</body>
</html>
