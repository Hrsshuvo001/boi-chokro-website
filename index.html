<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boi Chokro - অনলাইন বইঘর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Ensuring title takes exactly 2 lines height */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 40px; 
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .chat-animate { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-40 transition-all">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 group">
                <img id="web_header_logo" src="" class="hidden h-10 w-auto max-w-[50px] object-contain group-hover:scale-105 transition">
                <span id="web_header_name" class="text-2xl md:text-3xl font-extrabold text-blue-600 tracking-tight">Boi Chokro</span>
            </a>
            
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="/cart.html" class="relative text-gray-600 hover:text-blue-600 transition group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span id="cartCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white shadow">0</span>
                </a>
                <div id="authButtons" class="flex items-center gap-3">
                    <div class="animate-pulse bg-gray-200 h-8 w-16 rounded"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- হিরো সেকশন -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-500 text-white py-14 md:py-20 px-4 text-center rounded-b-3xl shadow-inner">
        <h1 id="web_tagline" class="text-3xl md:text-5xl lg:text-6xl font-extrabold mb-4 leading-tight tracking-tight drop-shadow-md">আপনার পছন্দের বই, এক জায়গায়</h1>
        <p class="text-base md:text-lg lg:text-xl text-blue-100 max-w-2xl mx-auto font-medium">সেরা লেখকদের বইয়ের বিশাল সংগ্রহ। আজই আপনার প্রিয় বইটি খুঁজে নিন।</p>
    </header>

    <!-- মেইন কন্টেন্ট -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-10">
        
        <!-- ১. বেস্ট সেলার -->
        <section class="mb-14">
            <div class="flex items-center justify-between mb-6 border-b pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-3xl">🔥</span>
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-800">বেস্ট সেলার</h2>
                </div>
            </div>
            <!-- গ্রিড লেআউট -->
            <div id="bestSellerGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                <p class="text-gray-500 col-span-full text-center py-10">লোড হচ্ছে...</p>
            </div>
        </section>

        <!-- ২. ডাইনামিক ক্যাটাগরি স্লাইডার -->
        <div id="dynamicCategorySections">
            <p class="text-gray-500 text-center py-10">ক্যাটাগরি লোড হচ্ছে...</p>
        </div>

        <!-- ৩. সব ক্যাটাগরি ফিল্টার ও সব বই -->
        <section class="mt-12">
            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6 border-b pb-3">সব ক্যাটাগরি</h2>
            
            <div class="flex flex-wrap gap-2 mb-8" id="categoryButtons">
                <button onclick="filterCategory('all')" class="category-btn bg-blue-600 text-white px-5 py-2.5 rounded-full text-sm font-semibold transition shadow-md hover:shadow-lg">সব বই</button>
            </div>

            <!-- গ্রিড লেআউট -->
            <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                <!-- সব বই লোড হবে -->
            </div>
        </section>
    </main>

    <!-- ফুটার -->
    <footer class="bg-gray-900 text-gray-400 py-8 text-center mt-auto">
        <p id="web_footer_text" class="text-sm font-medium">&copy; 2024 Boi Chokro. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allBooksData = []; 

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtons = document.getElementById('authButtons');
            if (session) {
                currentUser = session.user;
                authButtons.innerHTML = `<button onclick="handleLogout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-100 border border-red-200 transition">লগআউট</button>`;
            } else {
                currentUser = null;
                authButtons.innerHTML = `<a href="/login.html" class="text-blue-600 text-sm font-semibold hover:underline">লগইন</a>`;
            }
        }

        async function fetchSiteSettings() {
            const { data, error } = await supabaseClient.from('site_settings').select('*').limit(1).maybeSingle();
            if (!error && data) {
                document.getElementById('web_header_name').innerText = data.company_name || 'Boi Chokro';
                if(data.tagline) document.getElementById('web_tagline').innerText = data.tagline;
                if(data.footer_text) document.getElementById('web_footer_text').innerText = data.footer_text;
                if (data.logo_url) {
                    const logo = document.getElementById('web_header_logo');
                    logo.src = data.logo_url;
                    logo.classList.remove('hidden');
                }
            }
        }

        // ==========================================
        // ১০০% সমান সাইজের কার্ড ডিজাইন
        // ==========================================
        function createBookCard(book, isSlider = false) {
            const currentPrice = book.discount_price || book.original_price || 0;
            const hasDiscount = book.original_price && book.discount_price && book.original_price > book.discount_price;
            
            const widthClass = isSlider ? "min-w-[160px] max-w-[160px] sm:min-w-[200px] sm:max-w-[200px] snap-start flex-shrink-0" : "w-full";
            
            let discountPercent = 0;
            if (hasDiscount) discountPercent = Math.round(((book.original_price - book.discount_price) / book.original_price) * 100);
            
            const isOutOfStock = (book.stock_quantity !== undefined && book.stock_quantity !== null) ? book.stock_quantity <= 0 : false;

            return `
            <div class="bg-white rounded-xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col border border-gray-100 relative group ${widthClass}">
                
                <!-- ছবির কন্টেইনার (Fixed Height h-56) -->
                <a href="/book-details.html?id=${book.id}" class="block w-full h-48 sm:h-56 bg-gray-100 overflow-hidden relative">
                    ${hasDiscount ? `<div class="absolute top-2 left-2 bg-red-500 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded-md shadow-md z-10">${discountPercent}% ছাড়</div>` : ''}
                    
                    ${isOutOfStock ? `<div class="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-10"><span class="bg-red-600 text-white font-bold px-3 py-1 rounded-md shadow-lg">স্টক নেই</span></div>` : ''}
                    
                    <img src="${book.cover_url || 'https://via.placeholder.com/300x400?text=No+Image'}" class="w-full h-full object-cover object-center group-hover:scale-110 transition duration-500 ease-in-out">
                </a>
                
                <!-- তথ্যের কন্টেইনার -->
                <div class="p-3 sm:p-4 flex flex-col flex-grow">
                    <span class="text-[10px] sm:text-xs text-blue-600 font-bold tracking-wider uppercase mb-1">${book.category || 'সাধারণ'}</span>
                    
                    <!-- বইয়ের নাম (Fixed Height যাতে সব কার্ড সমান হয়) -->
                    <a href="/book-details.html?id=${book.id}" class="flex-grow mb-1">
                        <h3 class="font-bold text-xs sm:text-sm text-gray-800 leading-snug line-clamp-2 group-hover:text-blue-600 transition">${book.title}</h3>
                    </a>
                    
                    <!-- লেখক ও প্রকাশনী -->
                    <div class="mb-2">
                        <p class="text-[10px] sm:text-xs text-gray-600 font-medium truncate">লেখক: ${book.author}</p>
                        <p class="text-[10px] sm:text-xs text-gray-500 truncate">প্রকাশনী: ${book.publisher || 'N/A'}</p>
                    </div>
                    
                    <!-- দাম -->
                    <div class="flex items-end gap-1.5 mb-2 mt-auto">
                        <span class="text-base sm:text-lg font-extrabold text-blue-600">৳ ${currentPrice}</span>
                        ${hasDiscount ? `<span class="text-gray-400 line-through text-[10px] sm:text-xs mb-0.5 font-medium">৳ ${book.original_price}</span>` : ''}
                    </div>

                    <!-- স্টক স্ট্যাটাস -->
                    <p class="text-[10px] sm:text-xs font-bold mb-2 ${isOutOfStock ? 'text-red-500' : 'text-green-600'}">
                        ${isOutOfStock ? '❌ স্টক নেই' : '✅ স্টকে আছে'}
                    </p>

                    <!-- অ্যাকশন বাটন -->
                    ${isOutOfStock ? `
                        <button disabled class="w-full bg-gray-100 text-gray-400 font-bold py-1.5 rounded-lg text-[10px] sm:text-xs cursor-not-allowed border border-gray-200 z-10 relative">স্টক নেই</button>
                    ` : (book.is_affiliate ? `
                        <button onclick="event.preventDefault(); handleAffiliateBuy('${book.purchase_link}')" class="w-full bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-600 hover:text-white font-bold py-1.5 rounded-lg transition text-[10px] sm:text-xs z-10 relative">অন্য সাইটে কিনুন</button>
                    ` : `
                        <button onclick="event.preventDefault(); addToCart('${book.id}', '${book.title}', ${currentPrice}, '${book.cover_url}')" class="w-full bg-green-50 text-green-700 border border-green-200 hover:bg-green-600 hover:text-white font-bold py-1.5 rounded-lg transition flex justify-center items-center gap-1 text-[10px] sm:text-xs z-10 relative">কার্টে যোগ করুন</button>
                    `)}
                </div>
            </div>`;
        }

        async function loadHomePage() {
            const { data: books, error: bookError } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
            if (bookError || !books) return;
            allBooksData = books;

            const bestSellers = [...books].sort((a, b) => (b.sales_count || 0) - (a.sales_count || 0)).slice(0, 5); 
            document.getElementById('bestSellerGrid').innerHTML = bestSellers.map(book => createBookCard(book)).join('');

            const { data: categories, error: catError } = await supabaseClient.from('categories').select('*').order('name');
            const dynamicContainer = document.getElementById('dynamicCategorySections');
            const categoryButtons = document.getElementById('categoryButtons');

            if (!catError && categories && categories.length > 0) {
                dynamicContainer.innerHTML = ''; 
                categories.forEach(cat => {
                    const catBooks = books.filter(b => b.category === cat.name).slice(0, 10);
                    if (catBooks.length === 0) return;
                    
                    dynamicContainer.insertAdjacentHTML('beforeend', `
                        <section class="mb-12">
                            <div class="flex justify-between items-end mb-6 border-b pb-3">
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">📚</span>
                                    <h2 class="text-xl md:text-2xl font-bold text-gray-800">${cat.name}</h2>
                                </div>
                                <a href="/category.html?cat=${encodeURIComponent(cat.name)}" class="text-blue-600 text-sm font-semibold hover:underline flex items-center gap-1 group">
                                    সব বই দেখুন 
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 group-hover:translate-x-1 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                                </a>
                            </div>
                            <div class="flex overflow-x-auto gap-4 md:gap-6 snap-x pb-6 hide-scrollbar">
                                ${catBooks.map(book => createBookCard(book, true)).join('')}
                            </div>
                        </section>
                    `);
                    
                    categoryButtons.insertAdjacentHTML('beforeend', `
                        <button onclick="filterCategory('${cat.name}')" class="category-btn bg-white text-gray-700 border border-gray-200 px-5 py-2.5 rounded-full text-sm font-semibold hover:bg-blue-50 hover:border-blue-300 transition shadow-sm">${cat.name}</button>
                    `);
                });
            }
            renderFilteredBooks('all');
        }

        window.filterCategory = (category) => {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'); 
                btn.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
            });
            const clickedBtn = Array.from(document.querySelectorAll('.category-btn')).find(btn => btn.innerText.trim() === (category === 'all' ? 'সব বই' : category));
            
            if (clickedBtn) { 
                clickedBtn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200'); 
                clickedBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-600'); 
            }
            renderFilteredBooks(category);
        }

        function renderFilteredBooks(category) {
            const grid = document.getElementById('bookGrid');
            let filtered = allBooksData;
            if (category !== 'all') filtered = allBooksData.filter(book => book.category === category);
            
            if (filtered.length === 0) { 
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10 font-medium">এই ক্যাটাগরিতে কোনো বই পাওয়া যায়নি।</p>`; 
                return; 
            }
            grid.innerHTML = filtered.map(book => createBookCard(book)).join('');
        }

        window.addToCart = (id, title, price, image) => {
            if (!currentUser) { alert('কার্টে যোগ করতে লগইন করুন!'); window.location.href = '/login.html'; return; }
            const book = allBooksData.find(b => b.id === id);
            if (book && book.stock_quantity <= 0) { alert('দুঃখিত, বইটি স্টকে নেই!'); return; }
            let cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            if (cart.find(item => item.id === id)) { alert('বইটি আগেই কার্টে আছে!'); return; }
            cart.push({ id, title, price, image }); localStorage.setItem('boiChokroCart', JSON.stringify(cart));
            updateCartCount(); alert('সফলভাবে কার্টে যোগ হয়েছে!');
        }

        window.handleAffiliateBuy = (link) => {
            if (!currentUser) { alert('লিংকে যেতে লগইন করুন!'); window.location.href = '/login.html'; return; }
            if(link) window.open(link, '_blank');
        }

        window.handleLogout = async () => { await supabaseClient.auth.signOut(); checkAuth(); alert('লগআউট হয়েছে।'); }

        checkAuth(); fetchSiteSettings(); loadHomePage(); updateCartCount();
    </script>
</body>
</html>
