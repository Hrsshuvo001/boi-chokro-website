<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boi Chokro - অনলাইন বইঘর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .chat-animate { animation: slideUp 0.3s ease-out forwards; }

        /* প্রফেশনাল কার্ড শ্যাডো */
        .card-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .card-shadow:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 group">
                <img id="web_header_logo" src="" class="hidden h-8 sm:h-10 w-auto max-w-[40px] sm:max-w-[50px] object-contain">
                <span id="web_header_name" class="text-xl sm:text-2xl font-extrabold text-blue-600 tracking-tight">Boi Chokro</span>
            </a>
            
            <div class="flex items-center gap-2 sm:gap-4">
                <a href="/cart.html" class="relative flex items-center gap-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg font-semibold transition border border-blue-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-6 sm:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span class="hidden sm:inline text-sm">কার্ট</span>
                    <span id="cartCount" class="absolute -top-1.5 -right-1.5 sm:-top-2 sm:-right-2 bg-red-500 text-white text-[10px] sm:text-xs font-bold rounded-full h-4 w-4 sm:h-5 sm:w-5 flex items-center justify-center border-2 border-white shadow-sm">0</span>
                </a>
                <div id="authButtons" class="flex items-center text-sm">
                    <div class="animate-pulse bg-gray-200 h-7 w-14 sm:h-8 sm:w-16 rounded"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- হিরো সেকশন -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-500 text-white py-12 sm:py-16 px-4 text-center rounded-b-3xl shadow-inner relative overflow-hidden">
        <!-- ডেকোরেটিভ ব্যাকগ্রাউন্ড সার্কেল -->
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-white opacity-10 rounded-full blur-2xl"></div>
        
        <h1 id="web_tagline" class="text-2xl sm:text-4xl lg:text-5xl font-extrabold mb-3 leading-tight tracking-tight drop-shadow-md relative z-10">আপনার পছন্দের বই, এক জায়গায়</h1>
        <p class="text-sm sm:text-base lg:text-lg text-blue-100 max-w-2xl mx-auto font-medium relative z-10">সেরা লেখকদের বইয়ের বিশাল সংগ্রহ। আজই আপনার প্রিয় বইটি খুঁজে নিন।</p>
    </header>

    <!-- মেইন কন্টেন্ট -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-3 sm:px-4 py-8">
        
        <!-- ১. বেস্ট সেলার (সর্বোচ্চ ৩টি) -->
        <section class="mb-12">
            <div class="flex items-center justify-between mb-5 border-b pb-2">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🔥</span>
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800">বেস্ট সেলার</h2>
                </div>
            </div>
            <!-- গ্রিড লেআউট: মোবাইলে ২টি, বড় স্ক্রিনে ৩টি -->
            <div id="bestSellerGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-6 items-stretch">
                <p class="text-gray-500 col-span-full text-center py-10 text-sm">লোড হচ্ছে...</p>
            </div>
        </section>

        <!-- ২. ডাইনামিক ক্যাটাগরি স্লাইডার -->
        <div id="dynamicCategorySections">
            <p class="text-gray-500 text-center py-10 text-sm">ক্যাটাগরি লোড হচ্ছে...</p>
        </div>

        <!-- ৩. সব ক্যাটাগরি ফিল্টার ও সব বই -->
        <section class="mt-10">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-5 border-b pb-2">সব ক্যাটাগরি</h2>
            
            <div class="flex flex-wrap gap-2 mb-6" id="categoryButtons">
                <button onclick="filterCategory('all')" class="category-btn bg-blue-600 text-white px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition shadow-sm">সব বই</button>
            </div>

            <!-- গ্রিড লেআউট: মোবাইলে ২টি, বড় স্ক্রিনে ৪টি -->
            <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6 items-stretch">
                <!-- সব বই লোড হবে -->
            </div>
        </section>
    </main>

    <!-- ফুটার -->
    <footer class="bg-gray-900 text-gray-400 py-8 text-center mt-auto">
        <p id="web_footer_text" class="text-xs sm:text-sm font-medium">&copy; 2024 Boi Chokro. All rights reserved.</p>
    </footer>

    <!-- চ্যাট উইজেট -->
    <div class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-50 flex flex-col items-end">
        <div id="chatBox" class="hidden w-72 sm:w-80 bg-white rounded-2xl shadow-2xl border border-gray-100 flex-col overflow-hidden mb-3 chat-animate" style="height: 450px;">
            <div class="bg-blue-600 text-white p-3 flex flex-col shadow-md z-10">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-2"><div class="w-2 h-2 sm:w-3 sm:h-3 bg-green-400 rounded-full animate-pulse"></div><h3 class="font-bold text-sm sm:text-base">সাপোর্ট সেন্টার</h3></div>
                    <button onclick="toggleChat()" class="text-white hover:text-red-300"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                </div>
                <div class="flex bg-blue-800/50 rounded-lg p-1">
                    <button id="tabBtnAI" onclick="switchChatTab('ai')" class="flex-1 text-xs sm:text-sm font-semibold py-1 rounded bg-white text-blue-700 shadow-sm transition">🤖 AI চ্যাট</button>
                    <button id="tabBtnLive" onclick="switchChatTab('live')" class="flex-1 text-xs sm:text-sm font-semibold py-1 text-blue-100 hover:text-white transition">🎧 লাইভ</button>
                </div>
            </div>
            <div id="chatMessages" class="flex-grow p-3 overflow-y-auto bg-gray-50 flex flex-col gap-2"></div>
            <div class="p-2 bg-white border-t">
                <div class="flex items-center gap-2">
                    <input type="text" id="chatInput" placeholder="মেসেজ লিখুন..." class="flex-grow px-3 py-1.5 bg-gray-100 border-transparent rounded-full text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" onkeypress="handleEnter(event)">
                    <button onclick="sendMessage()" class="bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform rotate-90" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg></button>
                </div>
            </div>
        </div>
        <button onclick="toggleChat()" class="bg-blue-600 text-white p-3.5 sm:p-4 rounded-full shadow-xl hover:bg-blue-700 hover:scale-105 transition-all duration-300 flex items-center justify-center relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-8 sm:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
            <span id="chatNotifDot" class="absolute top-0 right-0 flex h-2.5 w-2.5 sm:h-3 sm:w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-full w-full bg-red-500"></span></span>
        </button>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allBooksData = []; 
        let activeChatTab = 'ai'; 
        let chatSubscription = null;

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtons = document.getElementById('authButtons');
            if (session) {
                currentUser = session.user;
                authButtons.innerHTML = `<button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-semibold hover:bg-red-100 border border-red-200 transition">লগআউট</button>`;
            } else {
                currentUser = null;
                authButtons.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg text-xs sm:text-sm font-semibold hover:bg-blue-700 transition shadow-sm">লগইন</a>`;
            }
        }

        async function fetchSiteSettings() {
            const { data, error } = await supabaseClient.from('site_settings').select('*').limit(1).maybeSingle();
            if (!error && data) {
                document.getElementById('web_header_name').innerText = data.company_name || 'Boi Chokro';
                if(data.tagline) document.getElementById('web_tagline').innerText = data.tagline;
                if(data.footer_text) document.getElementById('web_footer_text').innerText = data.footer_text;
                if (data.logo_url) {
                    const logo = document.getElementById('web_header_logo');
                    logo.src = data.logo_url;
                    logo.classList.remove('hidden');
                }
            }
        }

        // ==========================================
        // ১০০% প্রফেশনাল কার্ড ডিজাইন
        // ==========================================
        function createBookCard(book) {
            const currentPrice = book.discount_price || book.original_price || 0;
            const hasDiscount = book.original_price && book.discount_price && book.original_price > book.discount_price;
            
            let discountPercent = 0;
            if (hasDiscount) discountPercent = Math.round(((book.original_price - book.discount_price) / book.original_price) * 100);
            
            const isOutOfStock = (book.stock_quantity !== undefined && book.stock_quantity !== null) ? book.stock_quantity <= 0 : false;

            return `
            <div class="bg-white rounded-2xl card-shadow transition-all duration-300 flex flex-col relative group w-full h-full overflow-hidden border border-gray-100">
                
                <!-- ছবি -->
                <a href="/book-details.html?id=${book.id}" class="block w-full aspect-[3/4] bg-gray-100 overflow-hidden relative">
                    ${hasDiscount ? `<div class="absolute top-2 left-2 bg-red-500 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded-md shadow-md z-10">${discountPercent}% ছাড়</div>` : ''}
                    
                    ${isOutOfStock ? `<div class="absolute inset-0 bg-black/60 backdrop-blur-[2px] flex items-center justify-center z-10"><span class="bg-red-600 text-white font-bold text-xs sm:text-sm px-3 py-1 rounded-md shadow-lg">স্টক নেই</span></div>` : ''}
                    
                    <img src="${book.cover_url || 'https://via.placeholder.com/300x400?text=No+Image'}" class="w-full h-full object-cover object-center group-hover:scale-110 transition duration-500 ease-in-out">
                </a>
                
                <!-- তথ্য -->
                <div class="p-3 sm:p-4 flex flex-col flex-grow bg-white">
                    <span class="text-[10px] text-blue-600 font-bold uppercase tracking-wider mb-1">${book.category || 'সাধারণ'}</span>
                    
                    <a href="/book-details.html?id=${book.id}" class="mb-1 block">
                        <h3 class="font-bold text-sm sm:text-base text-gray-800 leading-snug line-clamp-2 group-hover:text-blue-600 transition h-[38px] sm:h-[44px]">${book.title}</h3>
                    </a>
                    
                    <div class="mt-auto pt-2 flex flex-col gap-0.5 mb-2">
                        <p class="text-[11px] sm:text-xs text-gray-500 truncate">লেখক: <span class="text-gray-700 font-medium">${book.author}</span></p>
                        <p class="text-[11px] sm:text-xs text-gray-500 truncate">প্রকাশনী: <span class="text-gray-700 font-medium">${book.publisher || 'N/A'}</span></p>
                    </div>
                    
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-lg sm:text-xl font-extrabold text-gray-900">৳ ${currentPrice}</span>
                        ${hasDiscount ? `<span class="text-gray-400 line-through text-xs font-medium">৳ ${book.original_price}</span>` : ''}
                    </div>

                    <!-- অ্যাকশন বাটন -->
                    <div class="mt-auto">
                        ${isOutOfStock ? `
                            <button disabled class="w-full bg-gray-100 text-gray-400 font-bold py-2 rounded-xl text-xs sm:text-sm cursor-not-allowed border border-gray-200">স্টক নেই</button>
                        ` : (book.is_affiliate ? `
                            <button onclick="event.preventDefault(); handleAffiliateBuy('${book.purchase_link}')" class="w-full bg-purple-600 text-white hover:bg-purple-700 font-bold py-2 rounded-xl transition text-xs sm:text-sm shadow-sm hover:shadow-md">অন্য সাইটে কিনুন</button>
                        ` : `
                            <button onclick="event.preventDefault(); addToCart('${book.id}', '${book.title}', ${currentPrice}, '${book.cover_url}')" class="w-full bg-emerald-600 text-white hover:bg-emerald-700 font-bold py-2 rounded-xl transition text-xs sm:text-sm shadow-sm hover:shadow-md flex items-center justify-center gap-1.5">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                কার্টে যোগ করুন
                            </button>
                        `)}
                    </div>
                </div>
            </div>`;
        }

        async function loadHomePage() {
            const { data: books, error: bookError } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
            if (bookError || !books) return;
            allBooksData = books;

            // ১. বেস্ট সেলার (সর্বোচ্চ ৩টি)
            const bestSellers = [...books].sort((a, b) => (b.sales_count || 0) - (a.sales_count || 0)).slice(0, 3); 
            document.getElementById('bestSellerGrid').innerHTML = bestSellers.map(book => createBookCard(book)).join('');

            // ২. ক্যাটাগরি স্লাইডার
            const { data: categories, error: catError } = await supabaseClient.from('categories').select('*').order('name');
            const dynamicContainer = document.getElementById('dynamicCategorySections');
            const categoryButtons = document.getElementById('categoryButtons');

            if (!catError && categories && categories.length > 0) {
                dynamicContainer.innerHTML = ''; 
                categories.forEach(cat => {
                    const catBooks = books.filter(b => b.category === cat.name).slice(0, 10);
                    if (catBooks.length === 0) return;
                    
                    dynamicContainer.insertAdjacentHTML('beforeend', `
                        <section class="mb-12">
                            <div class="flex justify-between items-end mb-5 border-b pb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">📚</span>
                                    <h2 class="text-xl sm:text-2xl font-bold text-gray-800">${cat.name}</h2>
                                </div>
                                <a href="/category.html?cat=${encodeURIComponent(cat.name)}" class="text-blue-600 text-xs sm:text-sm font-semibold hover:underline flex items-center gap-1 group">
                                    সব বই দেখুন 
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 group-hover:translate-x-1 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                                </a>
                            </div>
                            
                            <div class="grid grid-flow-col auto-cols-[calc(50%-0.5rem)] sm:auto-cols-[calc(33.33%-1rem)] md:auto-cols-[calc(25%-1rem)] gap-4 sm:gap-6 overflow-x-auto snap-x snap-mandatory hide-scrollbar pb-6 items-stretch">
                                ${catBooks.map(book => createBookCard(book)).join('')}
                            </div>
                        </section>
                    `);
                    
                    categoryButtons.insertAdjacentHTML('beforeend', `
                        <button onclick="filterCategory('${cat.name}')" class="category-btn bg-white text-gray-700 border border-gray-200 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold hover:bg-blue-50 hover:border-blue-300 transition shadow-sm">${cat.name}</button>
                    `);
                });
            }
            renderFilteredBooks('all');
        }

        window.filterCategory = (category) => {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'); 
                btn.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
            });
            const clickedBtn = Array.from(document.querySelectorAll('.category-btn')).find(btn => btn.innerText.trim() === (category === 'all' ? 'সব বই' : category));
            
            if (clickedBtn) { 
                clickedBtn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200'); 
                clickedBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-600'); 
            }
            renderFilteredBooks(category);
        }

        function renderFilteredBooks(category) {
            const grid = document.getElementById('bookGrid');
            let filtered = allBooksData;
            if (category !== 'all') filtered = allBooksData.filter(book => book.category === category);
            
            if (filtered.length === 0) { 
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10 font-medium text-sm">এই ক্যাটাগরিতে কোনো বই পাওয়া যায়নি।</p>`; 
                return; 
            }
            grid.innerHTML = filtered.map(book => createBookCard(book)).join('');
        }

        window.addToCart = (id, title, price, image) => {
            if (!currentUser) { alert('কার্টে যোগ করতে লগইন করুন!'); window.location.href = '/login.html'; return; }
            const book = allBooksData.find(b => b.id === id);
            if (book && book.stock_quantity <= 0) { alert('দুঃখিত, বইটি স্টকে নেই!'); return; }
            let cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            if (cart.find(item => item.id === id)) { alert('বইটি আগেই কার্টে আছে!'); return; }
            cart.push({ id, title, price, image }); localStorage.setItem('boiChokroCart', JSON.stringify(cart));
            updateCartCount(); alert('সফলভাবে কার্টে যোগ হয়েছে!');
        }

        window.handleAffiliateBuy = (link) => {
            if (!currentUser) { alert('লিংকে যেতে লগইন করুন!'); window.location.href = '/login.html'; return; }
            if(link) window.open(link, '_blank');
        }

        window.handleLogout = async () => { await supabaseClient.auth.signOut(); checkAuth(); alert('লগআউট হয়েছে।'); }

        // --- চ্যাট সিস্টেম ---
        window.toggleChat = () => {
            if (!currentUser) { alert('লাইভ চ্যাটে কথা বলতে অনুগ্রহ করে প্রথমে লগইন করুন!'); window.location.href = '/login.html'; return; }
            const chatBox = document.getElementById('chatBox');
            const notifDot = document.getElementById('chatNotifDot');
            if (chatBox.classList.contains('hidden')) {
                chatBox.classList.remove('hidden'); chatBox.classList.add('flex'); notifDot.style.display = 'none'; 
                if (document.getElementById('chatMessages').children.length === 0) {
                    appendMessage('ai', 'আসসালামু আলাইকুম! আমি Boi Chokro-এর AI অ্যাসিস্ট্যান্ট। আপনাকে কীভাবে সাহায্য করতে পারি?');
                }
                if(activeChatTab === 'live') markAdminMessagesAsRead();
            } else {
                chatBox.classList.add('hidden'); chatBox.classList.remove('flex');
            }
        };

        window.switchChatTab = (tab) => {
            activeChatTab = tab;
            const btnAI = document.getElementById('tabBtnAI');
            const btnLive = document.getElementById('tabBtnLive');
            const chatMessages = document.getElementById('chatMessages');
            if (tab === 'ai') {
                btnAI.className = "flex-1 text-xs sm:text-sm font-semibold py-1 rounded bg-white text-blue-700 shadow-sm transition";
                btnLive.className = "flex-1 text-xs sm:text-sm font-semibold py-1 rounded text-blue-100 hover:text-white transition";
                chatMessages.innerHTML = ''; 
                appendMessage('ai', 'আসসালামু আলাইকুম! আমি Boi Chokro-এর AI অ্যাসিস্ট্যান্ট। আপনাকে কীভাবে সাহায্য করতে পারি?');
                if(chatSubscription) chatSubscription.unsubscribe(); 
            } else {
                btnLive.className = "flex-1 text-xs sm:text-sm font-semibold py-1 rounded bg-white text-blue-700 shadow-sm transition";
                btnAI.className = "flex-1 text-xs sm:text-sm font-semibold py-1 rounded text-blue-100 hover:text-white transition";
                chatMessages.innerHTML = ''; 
                if(!currentUser) { appendMessage('ai', 'লাইভ চ্যাটে কথা বলতে অনুগ্রহ করে প্রথমে লগইন করুন।'); return; }
                appendMessage('admin', 'আপনি এখন লাইভ সাপোর্টে আছেন। আমাদের টিম শীঘ্রই আপনাকে উত্তর দেবে।');
                loadLiveChatHistory();
                subscribeToLiveChat();
                markAdminMessagesAsRead(); 
            }
        };

        function appendMessage(sender, text) {
            const chatMessages = document.getElementById('chatMessages');
            const isUser = sender === 'user';
            const isAdmin = sender === 'admin';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-2`;
            let bubbleClass = "bg-white border border-gray-200 text-gray-800 rounded-tl-none";
            if (isUser) bubbleClass = "bg-blue-600 text-white rounded-tr-none";
            if (isAdmin) bubbleClass = "bg-green-600 text-white rounded-tl-none";
            msgDiv.innerHTML = `<div class="max-w-[80%] px-3 py-1.5 rounded-xl text-xs sm:text-sm shadow-sm ${bubbleClass}">${text}</div>`;
            chatMessages.appendChild(msgDiv); 
            chatMessages.scrollTop = chatMessages.scrollHeight; 
        }

        window.handleEnter = (e) => { if (e.key === 'Enter') sendMessage(); };

        window.sendMessage = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            appendMessage('user', text);
            input.value = '';
            if (activeChatTab === 'ai') {
                const typingDiv = document.createElement('div'); typingDiv.id = 'typingIndicator'; typingDiv.className = "flex justify-start mb-2";
                typingDiv.innerHTML = `<div class="bg-gray-100 border border-gray-200 text-gray-500 px-3 py-1.5 rounded-xl text-xs sm:text-sm rounded-tl-none italic">টাইপ করছে...</div>`;
                document.getElementById('chatMessages').appendChild(typingDiv);
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
                setTimeout(() => {
                    document.getElementById('typingIndicator').remove();
                    let aiResponse = "দুঃখিত, আমি আপনার প্রশ্নটি বুঝতে পারিনি। আপনি বই, ডেলিভারি বা পেমেন্ট নিয়ে জিজ্ঞাসা করতে পারেন।";
                    if (text.toLowerCase().includes('ডেলিভারি') || text.toLowerCase().includes('delivery')) {
                        aiResponse = "ঢাকার ভেতরে ডেলিভারি চার্জ ৬০ টাকা এবং ঢাকার বাইরে ১২০ টাকা। ডেলিভারি পেতে ২-৩ দিন সময় লাগে।";
                    } else if (text.toLowerCase().includes('বই') || text.toLowerCase().includes('book')) {
                        aiResponse = "আমাদের স্টোরে বিভিন্ন ক্যাটাগরির বই পাওয়া যায়। আপনি উপরের মেনু থেকে আপনার পছন্দের ক্যাটাগরি বেছে নিতে পারেন।";
                    } else if (text.toLowerCase().includes('পেমেন্ট') || text.toLowerCase().includes('payment')) {
                        aiResponse = "আমরা বিকাশ এবং নগদে পেমেন্ট গ্রহণ করি। চেকআউট পেজে আপনি পেমেন্ট মেথড সিলেক্ট করতে পারবেন।";
                    }
                    appendMessage('ai', aiResponse);
                }, 1500);
            } else {
                if (!currentUser) return;
                const { error } = await supabaseClient.from('chat_messages').insert([{ user_id: currentUser.id, message: text }]);
                if (error) { console.error("Chat error: ", error); appendMessage('admin', 'মেসেজ পাঠানো যায়নি। দয়া করে আবার চেষ্টা করুন।'); }
            }
        };

        async function markAdminMessagesAsRead() {
            if (!currentUser) return;
            await supabaseClient
                .from('chat_messages')
                .update({ is_read: true })
                .eq('user_id', currentUser.id)
                .eq('is_admin', true)
                .eq('is_read', false);
        }

        async function loadLiveChatHistory() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient
                .from('chat_messages')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: true }); 

            if (!error && data) {
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = ''; 
                data.forEach(msg => {
                    appendMessage(msg.is_admin ? 'admin' : 'user', msg.message);
                });
                markAdminMessagesAsRead(); 
            }
        }

        function subscribeToLiveChat() {
            if (!currentUser) return;
            if(chatSubscription) chatSubscription.unsubscribe();
            chatSubscription = supabaseClient
                .channel('chat_customer_' + currentUser.id) 
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
                    const newMsg = payload.new;
                    if (newMsg.is_admin && newMsg.user_id === currentUser.id) {
                        appendMessage('admin', newMsg.message);
                        markAdminMessagesAsRead(); 
                    }
                })
                .subscribe();
        }

        checkAuth(); fetchSiteSettings(); loadHomePage(); updateCartCount();
    </script>
</body>
</html>
