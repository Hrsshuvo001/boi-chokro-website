<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বই চক্র | Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">বই চক্র</h1>
            <div class="space-x-4 text-sm font-medium">
                <a href="#" class="hover:text-blue-600">হোম</a>
                <a href="#" class="hover:text-blue-600">ব্লগ</a>
                <a href="/admin.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">লগইন</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-blue-50 py-16 text-center">
        <div class="max-w-3xl mx-auto px-4">
            <h2 class="text-4xl font-bold text-gray-900 mb-4">পড়ি, শেয়ার করি, এগিয়ে চলি</h2>
            <p class="text-lg text-gray-600 mb-8">আপনার প্রিয় বইয়ের সেরা রিভিউ এবং রকমারির আকর্ষণীয় ডিল এক জায়গায়।</p>
            <a href="#books" class="bg-blue-600 text-white px-8 py-3 rounded-full font-semibold hover:bg-blue-700 transition">বইগুলো দেখুন</a>
        </div>
    </header>

    <!-- Featured Books Section (Now Dynamic) -->
    <section id="books" class="max-w-6xl mx-auto px-4 py-16">
        <h3 class="text-2xl font-bold mb-8 text-center text-gray-800">আজকের সেরা বই</h3>
        
        <!-- এখানে ডেটাবেস থেকে বইগুলো লোড হবে -->
        <div id="bookContainer" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- লোডিং টেক্সট -->
            <p class="text-center col-span-3 text-gray-500">বই লোড হচ্ছে...</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 text-center mt-12">
        <p>&copy; 2026 বই চক্র | সর্বস্বত্ব সংরক্ষিত</p>
        <p class="text-sm text-gray-400 mt-2">রকমারির অফিসিয়াল অ্যাফিলিয়েট পার্টনার</p>
    </footer>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⚠️ এখানে আপনার Supabase URL এবং Anon Key বসান
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const bookContainer = document.getElementById('bookContainer');

        // ডেটাবেস থেকে বই লোড করার ফাংশন
        async function loadBooks() {
            // books টেবিল থেকে সব ডেটা আনা হচ্ছে
            const { data: books, error } = await supabase
                .from('books')
                .select('*')
                .order('created_at', { ascending: false }); // নতুন বই আগে দেখাবে

            if (error) {
                console.error('Error fetching books:', error);
                bookContainer.innerHTML = `<p class="text-center col-span-3 text-red-500">বই লোড করতে সমস্যা হচ্ছে।</p>`;
                return;
            }

            if (books.length === 0) {
                bookContainer.innerHTML = `<p class="text-center col-span-3 text-gray-500">এখনো কোনো বই যোগ করা হয়নি।</p>`;
                return;
            }

            // বইগুলো HTML কার্ডে রূপান্তর করা
            bookContainer.innerHTML = '';
            books.forEach(book => {
                // যদি ছবি না থাকে তবে একটি ডিফল্ট ছবি দেখাবে
                const imgUrl = book.cover_image_url ? book.cover_image_url : 'https://via.placeholder.com/300x400?text=No+Image';
                
                const bookHTML = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                        <img src="${imgUrl}" alt="${book.title}" class="w-full h-64 object-cover">
                        <div class="p-5">
                            <h4 class="text-xl font-bold mb-1 truncate">${book.title}</h4>
                            <p class="text-gray-500 text-sm mb-3">${book.author || 'লেখক অজানা'}</p>
                            <p class="text-green-600 font-bold text-lg mb-4">${book.price || 'দাম নেই'}</p>
                            <div class="flex space-x-2">
                                <button class="flex-1 bg-gray-100 text-gray-800 py-2 rounded-lg text-sm font-medium hover:bg-gray-200">কার্টে রাখুন</button>
                                <a href="${book.affiliate_link}" target="_blank" class="flex-1 bg-blue-600 text-white text-center py-2 rounded-lg text-sm font-medium hover:bg-blue-700">কিনুন</a>
                            </div>
                        </div>
                    </div>
                `;
                bookContainer.innerHTML += bookHTML;
            });
        }

        // পেজ লোড হলেই বই লোড হবে
        loadBooks();
    </script>
</body>
</html>
