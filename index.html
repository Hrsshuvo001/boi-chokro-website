    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allBooksData = [];
        let filteredBooksData = [];

        window.showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-animate px-5 py-4 rounded-lg shadow-2xl text-white font-bold flex items-center gap-3 ${isError ? 'bg-red-600 border-l-4 border-red-800' : 'bg-green-600 border-l-4 border-green-800'}`;
            toast.innerHTML = `<span class="text-2xl">${isError ? '⚠️' : '✅'}</span><span class="text-sm md:text-base pr-2">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 4000);
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function sanitizeSearchQuery(query) { return query.replace(/[<>]/g, '').trim(); }

        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        window.toggleDarkMode = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            const mobEl = document.getElementById('cartCountMobile');
            const deskEl = document.getElementById('cartCountDesktop');
            if(mobEl) mobEl.innerText = cart.length;
            if(deskEl) deskEl.innerText = cart.length;
        }

        function updateWishlistCount() {
            const wishlist = JSON.parse(localStorage.getItem('boiChokroWishlist')) || [];
            const badge = document.getElementById('wishlistCountBadge');
            if(badge) {
                if(wishlist.length > 0) {
                    badge.innerText = wishlist.length;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        window.toggleWishlist = (bookId, event) => {
            if(event) event.preventDefault();
            let wishlist = JSON.parse(localStorage.getItem('boiChokroWishlist')) || [];
            const index = wishlist.indexOf(bookId);
            
            if(index > -1) {
                wishlist.splice(index, 1);
                showToast('💔 উইশলিস্ট থেকে বইটি সরিয়ে ফেলা হয়েছে!');
            } else {
                wishlist.push(bookId);
                showToast('💖 আপনার উইশলিস্টে বইটি যোগ করা হয়েছে!');
            }
            localStorage.setItem('boiChokroWishlist', JSON.stringify(wishlist));
            updateWishlistCount();
            renderBooks(filteredBooksData);
        }

        async function loadAdminSettings() {
            try {
                const { data: settings, error } = await supabaseClient.from('site_settings').select('*').limit(1).maybeSingle();
                if (settings && !error) {
                    const companyName = settings.company_name || 'Boi Chokro';
                    document.getElementById('pageTitle').innerText = companyName + ' - অনলাইন বইঘর';
                    const headerName = document.getElementById('web_header_name');
                    if(headerName) headerName.innerText = companyName;

                    const logoUrl = settings.logo_url || settings.logo || '';
                    if (logoUrl) {
                        const logoEl = document.getElementById('web_header_logo');
                        if(logoEl) { logoEl.src = logoUrl; logoEl.classList.remove('hidden'); }
                    }

                    const taglineText = settings.banner_text || settings.tagline || '';
                    if (taglineText) {
                        const taglineEl = document.getElementById('web_tagline');
                        if(taglineEl) taglineEl.innerText = taglineText;
                    }

                    const subTaglineText = settings.sub_tagline || '';
                    if (subTaglineText) {
                        const subTaglineEl = document.getElementById('web_sub_tagline');
                        if(subTaglineEl) subTaglineEl.innerText = subTaglineText;
                    }

                    const bannerUrl = settings.banner_url || '';
                    if (bannerUrl) {
                        const heroBanner = document.getElementById('heroBannerImage');
                        if (heroBanner) heroBanner.style.backgroundImage = `url('${bannerUrl}')`;
                    }

                    const phone = settings.phone || '';
                    const address = settings.address || '';
                    const footerContact = document.getElementById('web_footer_contact');
                    if (footerContact) {
                        let contactHTML = '';
                        if (phone) contactHTML += `📞 ফোন: ${phone} `;
                        if (address) contactHTML += ` | 📍 ঠিকানা: ${address}`;
                        footerContact.innerHTML = contactHTML;
                    }

                    const footerText = settings.footer_text || '';

        async function loadNotificationsAndMessages() {
            if(!currentUser) return;
            
            // ১. নোটিফিকেশন লোড
            const { data: notifs } = await supabaseClient.from('notifications')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });
            
            const badge = document.getElementById('notifBadge');
            const badgeMob = document.getElementById('notifBadgeMobile');
            const list = document.getElementById('notifList');
            
            if(notifs && notifs.length > 0) {
                const unread = notifs.filter(n => !n.is_read).length;
                if(unread > 0) { 
                    if(badge) { badge.innerText = unread; badge.classList.remove('hidden'); }
                    if(badgeMob) { badgeMob.innerText = unread; badgeMob.classList.remove('hidden'); }
                } else {
                    if(badge) badge.classList.add('hidden');
                    if(badgeMob) badgeMob.classList.add('hidden');
                }

                list.innerHTML = notifs.map(n => `
                    <div onclick="handleNotificationClick('${n.id}', '${n.link || ''}')" class="p-3 text-sm border-b dark:border-gray-700 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700 transition ${!n.is_read ? 'bg-blue-50 dark:bg-gray-700 font-semibold' : 'text-gray-600'}">
                        ${escapeHTML(n.message)}
                        <p class="text-[10px] text-gray-400 mt-1">${new Date(n.created_at).toLocaleString('bn-BD')}</p>
                    </div>
                `).join('');
            } else {
                list.innerHTML = `<div class="p-4 text-center text-sm text-gray-500">কোনো নোটিফিকেশন নেই</div>`;
                if(badge) badge.classList.add('hidden');
                if(badgeMob) badgeMob.classList.add('hidden');
            }

            // ২. ইনবক্সের মোট মেসেজ কাউন্ট (শুধু আনরিড মেসেজ)
            const { count: totalMsgs } = await supabaseClient.from('messages')
                .select('*', { count: 'exact', head: true })
                .eq('receiver_id', currentUser.id)
                .eq('is_read', false);

            const msgBadge = document.getElementById('msgBadge');
            const msgBadgeMob = document.getElementById('msgBadgeMobile');

            if(totalMsgs && totalMsgs > 0) {
                if(msgBadge) { msgBadge.innerText = totalMsgs; msgBadge.classList.remove('hidden'); }
                if(msgBadgeMob) { msgBadgeMob.innerText = totalMsgs; msgBadgeMob.classList.remove('hidden'); }
            } else {
                if(msgBadge) msgBadge.classList.add('hidden');
                if(msgBadgeMob) msgBadgeMob.classList.add('hidden');
            }
        }

        function createBookCard(book) {

            const originalPrice = book.original_price || 0;
            const hasDiscount = originalPrice && currentPrice && originalPrice > currentPrice;
            let discountPercent = hasDiscount ? Math.round(((originalPrice - currentPrice) / originalPrice) * 100) : 0;
            
            let rawImg = book.cover_url || book.image_url || '';
            let bookImage = rawImg.startsWith('http') ? rawImg : 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300';

            // স্টক চেক
            const isOutOfStock = (book.stock_quantity !== undefined && book.stock_quantity !== null) ? book.stock_quantity <= 0 : false;

            // উইশলিস্টের লাল লাভ নিশ্চিত করার জন্য কন্ডিশনাল ডিজাইন

                ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 dark:text-gray-300 hover:text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;

            return `
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col overflow-hidden relative group">
                <!-- উইশলিস্ট লাভ বাটন -->

                    ${heartIcon}
                </button>

                <a href="/book-details.html?id=${bookId}" class="block w-full aspect-[3/4] bg-gray-100 dark:bg-gray-700 overflow-hidden relative">
                    ${hasDiscount ? `<div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-md z-10">${discountPercent}% ছাড়</div>` : ''}
                    ${isOutOfStock ? `<div class="absolute inset-0 bg-black/60 backdrop-blur-[2px] flex items-center justify-center z-10"><span class="bg-red-600 text-white font-bold text-[10px] sm:text-xs px-3 py-1 rounded-md shadow-lg">স্টক আউট</span></div>` : ''}
                    <img src="${bookImage}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300'">
                </a>
                <div class="p-3 flex flex-col flex-grow justify-between">
                    <div>
                        <a href="/book-details.html?id=${bookId}">
                            <h3 class="font-bold text-sm text-gray-900 dark:text-white leading-snug line-clamp-2 mb-1 hover:text-blue-600 transition">${escapeHTML(bookTitle)}</h3>
                        </a>
                        <p class="text-xs text-gray-500 mb-3">${escapeHTML(bookAuthor)}</p>

                        <span class="text-lg font-bold text-blue-600 dark:text-blue-400">৳ ${currentPrice}</span>
                        ${hasDiscount ? `<span class="text-gray-400 line-through text-xs">৳ ${originalPrice}</span>` : ''}
                    </div>
                </div>
            </div>`;
        }

            const { data: existing } = await supabaseClient.from('blog_likes').select('id').eq('blog_id', blogId).eq('user_id', currentUser.id).maybeSingle();

            const lowerText = text.toLowerCase();

                        </div>
                    </div>
                    <div class="flex items-center gap-1 text-xs font-bold bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-300 px-3 py-1 rounded-full border border-blue-100 dark:border-gray-600">
                        👁️ <span>${blog.views || 1} ভিউ</span>
                    </div>
                </div>

                <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white mb-2">${escapeHTML(blog.title)}</h2>
                ${blog.image_url ? `<img src="${blog.image_url}" class="w-full max-h-96 object-cover rounded-xl mb-4 shadow-sm">` : ''}
                <div class="text-gray-700 dark:text-gray-200 text-base leading-relaxed whitespace-pre-line mb-4">${escapeHTML(blog.content)}</div>

                <div class="flex items-center justify-between text-xs sm:text-sm text-gray-500 dark:text-gray-400 border-y dark:border-gray-700 py-2.5 my-3">
                    <div class="flex items-center gap-1.5">
                        <span class="p-1 rounded-full text-sm">🌹</span>
                        <span>${totalLikes} জন গোলাপ দিয়েছেন</span>
                    </div>
                    <div>${totalLikes > 0 ? `<span class="italic text-xs">${escapeHTML(likerNamesText)}</span>` : 'প্রথমে গোলাপ দিন'}</div>
                </div>

                <div class="flex items-center justify-around border-b dark:border-gray-700 pb-2 mb-4">
                    <button onclick="toggleModalLike('${blog.id}')" class="flex items-center justify-center gap-2 flex-1 py-1.5 rounded-lg font-bold text-sm transition ${hasLiked ? 'text-pink-600 bg-pink-50 dark:bg-gray-700' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}">
                        <span>${hasLiked ? '🌹 গোলাপ দেওয়া হয়েছে' : '🌹 গোলাপ দিন'}</span>
                    </button>
                    <button onclick="document.getElementById('commentInput_${blog.id}').focus()" class="flex items-center justify-center gap-2 flex-1 py-1.5 rounded-lg font-bold text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                        <span>💬 কমেন্ট করুন</span>
                    </button>
                </div>

                <h4 class="font-bold text-lg mb-3 text-gray-900 dark:text-white">💬 কমেন্টসমূহ (${comments ? comments.length : 0})</h4>
                
                <div class="space-y-4 max-h-72 overflow-y-auto mb-4 pr-2">
                    ${(mainComments.length === 0) ? '<p class="text-sm text-gray-400 text-center py-4">এখনো কোনো কমেন্ট নেই। প্রথম কমেন্ট করুন!</p>' : 
                        mainComments.map(c => {
                            const commenter = commentProfiles[c.user_id] || { full_name: 'ব্যবহারকারী', profile_image: '' };
                            const cImg = commenter.profile_image || `https://ui-avatars.com/api/?name=${encodeURIComponent(commenter.full_name)}&background=random`;
                            const childReplies = replies.filter(r => r.parent_id === c.id);
                            const isMyComment = currentUser && currentUser.id === c.user_id;

                            return `
                            <div class="space-y-2">
                                <div class="flex items-start gap-2.5 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl relative group">
                                    <img src="${cImg}" class="w-8 h-8 rounded-full object-cover mt-0.5">
                                    <div class="flex-1">
                                        <div class="flex justify-between items-center">
                                            <span class="font-bold text-xs text-gray-900 dark:text-white">${escapeHTML(commenter.full_name)}</span>
                                            <span class="text-[10px] text-gray-400">${new Date(c.created_at).toLocaleTimeString('bn-BD', {hour: '2-digit', minute:'2-digit'})}</span>
                                        </div>
                                        <p id="commentText_${c.id}" class="text-sm text-gray-700 dark:text-gray-200 mt-1">${escapeHTML(c.comment)}</p>
                                        
                                        <div id="editBox_${c.id}" class="hidden mt-2">
                                            <input type="text" id="editInput_${c.id}" value="${escapeHTML(c.comment)}" class="w-full px-2 py-1 text-xs border rounded dark:bg-gray-800 dark:border-gray-600 mb-1">
                                            <div class="flex gap-2">
                                                <button onclick="saveEditedComment('${c.id}', '${blog.id}')" class="bg-green-600 text-white px-2 py-0.5 rounded text-[10px] font-bold">সেভ</button>
                                                <button onclick="toggleEditBox('${c.id}')" class="bg-gray-400 text-white px-2 py-0.5 rounded text-[10px]">বাতিল</button>
                                            </div>
                                        </div>

                                        <div class="flex items-center gap-3 mt-1">
                                            <button onclick="toggleReplyBox('${c.id}')" class="text-xs text-blue-600 font-bold hover:underline">রিপ্লাই দিন</button>
                                            ${isMyComment ? `
                                                <button onclick="toggleEditBox('${c.id}')" class="text-xs text-amber-600 font-semibold hover:underline">এডিট</button>
                                                <button onclick="deleteComment('${c.id}', '${blog.id}')" class="text-xs text-red-500 font-semibold hover:underline">ডিলিট</button>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>

                                ${childReplies.length > 0 ? `
                                    <div class="pl-8 space-y-2 border-l-2 border-gray-200 dark:border-gray-600 ml-4">
                                        ${childReplies.map(r => {
                                            const replier = commentProfiles[r.user_id] || { full_name: 'ব্যবহারকারী', profile_image: '' };
                                            const rImg = replier.profile_image || `https://ui-avatars.com/api/?name=${encodeURIComponent(replier.full_name)}&background=random`;
                                            const isMyReply = currentUser && currentUser.id === r.user_id;

                                            return `
                                            <div class="flex items-start gap-2 bg-gray-100 dark:bg-gray-800 p-2.5 rounded-xl text-xs">
                                                <img src="${rImg}" class="w-6 h-6 rounded-full object-cover mt-0.5">
                                                <div class="flex-1">
                                                    <div class="flex justify-between items-center">
                                                        <span class="font-bold text-gray-900 dark:text-white">${escapeHTML(replier.full_name)}</span>
                                                        <span class="text-[9px] text-gray-400">${new Date(r.created_at).toLocaleTimeString('bn-BD', {hour: '2-digit', minute:'2-digit'})}</span>
                                                    </div>
                                                    <p id="commentText_${r.id}" class="text-gray-700 dark:text-gray-200 mt-0.5">${escapeHTML(r.comment)}</p>

                                                    <div id="editBox_${r.id}" class="hidden mt-1">
                                                        <input type="text" id="editInput_${r.id}" value="${escapeHTML(r.comment)}" class="w-full px-2 py-1 text-[10px] border rounded dark:bg-gray-700 mb-1">
                                                        <div class="flex gap-2">
                                                            <button onclick="saveEditedComment('${r.id}', '${blog.id}')" class="bg-green-600 text-white px-2 py-0.5 rounded text-[9px] font-bold">সেভ</button>
                                                            <button onclick="toggleEditBox('${r.id}')" class="bg-gray-400 text-white px-2 py-0.5 rounded text-[9px]">বাতিল</button>
                                                        </div>
                                                    </div>

                                                    ${isMyReply ? `
                                                        <div class="flex gap-2 mt-1">
                                                            <button onclick="toggleEditBox('${r.id}')" class="text-[10px] text-amber-600 font-semibold hover:underline">এডিট</button>
                                                            <button onclick="deleteComment('${r.id}', '${blog.id}')" class="text-[10px] text-red-500 font-semibold hover:underline">ডিলিট</button>
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            </div>
                                            `;
                                        }).join('')}
                                    </div>
                                ` : ''}

                                <div id="replyBox_${c.id}" class="hidden pl-8 ml-4">
                                    <form onsubmit="submitComment(event, '${blog.id}', '${c.id}')" class="flex gap-2">
                                        <input type="text" id="replyInput_${c.id}" required placeholder="${escapeHTML(commenter.full_name)}-কে রিপ্লাই দিন..." class="flex-1 px-3 py-1.5 border rounded-lg dark:bg-gray-800 dark:border-gray-600 text-xs outline-none focus:ring-1 focus:ring-blue-500">
                                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition">রিপ্লাই</button>
                                    </form>
                                </div>
                            </div>
                            `;
                        }).join('')
                    }
                </div>

                ${currentUser ? `
                <form onsubmit="submitComment(event, '${blog.id}', null)" class="flex gap-2">
                    <input type="text" id="commentInput_${blog.id}" required placeholder="একটি সুন্দর কমেন্ট লিখুন..." class="flex-1 px-4 py-2 border rounded-xl dark:bg-gray-700 dark:border-gray-600 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-xl text-sm transition">পাঠান</button>
                </form>
                ` : `
                <p class="text-center text-sm py-2 bg-gray-50 dark:bg-gray-700 rounded-xl text-gray-500">কমেন্ট করতে অনুগ্রহ করে <a href="/login.html" class="text-blue-600 font-bold underline">লগইন করুন</a>।</p>
                `}
            `;
        }

        window.toggleReplyBox = (commentId) => {
            const box = document.getElementById(`replyBox_${commentId}`);
            if(box) box.classList.toggle('hidden');
        }

        window.toggleEditBox = (commentId) => {
            const box = document.getElementById(`editBox_${commentId}`);
            if(box) box.classList.toggle('hidden');
        }

        window.saveEditedComment = async (commentId, blogId) => {
            const input = document.getElementById(`editInput_${commentId}`);
            const newText = input ? input.value.trim() : '';

            if(!newText) { showToast('কমেন্ট খালি রাখা যাবে না!', true); return; }

            if (containsForbiddenContent(newText)) {
                showToast('⚠️ আপনার কমেন্টে গালি, অ্যাডাল্ট বা অনুপযুক্ত শব্দ থাকায় এটি এডিট করা বাতিল করা হয়েছে!', true);
                return;
            }

            const { error } = await supabaseClient.from('blog_comments').update({ comment: newText }).eq('id', commentId);
            if(!error) {
                showToast('✅ কমেন্ট সফলভাবে এডিট করা হয়েছে!');
                openPostDetails(blogId);
            } else {
                showToast('এডিট করতে সমস্যা হয়েছে: ' + error.message, true);
            }
        }

        window.deleteComment = async (commentId, blogId) => {
            if(!confirm('আপনি কি নিশ্চিতভাবে এই কমেন্টটি ডিলিট করতে চান?')) return;

            const { error } = await supabaseClient.from('blog_comments').delete().eq('id', commentId);
            if(!error) {
                showToast('🗑️ কমেন্ট সফলভাবে ডিলিট করা হয়েছে!');
                openPostDetails(blogId);
            } else {
                showToast('ডিলিট করতে সমস্যা হয়েছে: ' + error.message, true);
            }
        }

        window.toggleModalLike = async (blogId) => {
            await likeBlog(blogId);
            openPostDetails(blogId);
        }

        window.closePostModal = () => document.getElementById('postDetailsModal').classList.add('hidden');

        window.submitComment = async (e, blogId, parentId = null) => {
            e.preventDefault();
            if(!currentUser) { showToast('লগইন করুন', true); return; }

            let text = '';
            if (parentId) {
                const replyInput = document.getElementById(`replyInput_${parentId}`);
                text = replyInput ? replyInput.value.trim() : '';
            } else {
                const mainInput = document.getElementById(`commentInput_${blogId}`);
                text = mainInput ? mainInput.value.trim() : '';
            }

            if(!text) return;

            if (containsForbiddenContent(text)) {
                showToast('🚫 সতর্কতা: আপনার কমেন্টে গালিগালাজ, অ্যাডাল্ট বা হ্যারেসমেন্টমূলক শব্দ শনাক্ত হয়েছে। এই কমেন্টটি ব্লক ও রিজেক্ট করা হলো!', true);
                return;
            }

            const insertData = {
                blog_id: blogId,
                user_id: currentUser.id,
                comment: text
            };
            if(parentId) insertData.parent_id = parentId;

            const { error } = await supabaseClient.from('blog_comments').insert([insertData]);

            if(!error) {
                showToast('✅ কমেন্ট সফলভাবে পোস্ট হয়েছে!');
                // নোটিফিকেশন তৈরি (পোস্টের মালিকের জন্য)
                const { data: blogData } = await supabaseClient.from('blogs').select('author_id').eq('id', blogId).single();
                if(blogData && blogData.author_id !== currentUser.id) {
                    await supabaseClient.from('notifications').insert([{
                        user_id: blogData.author_id,
                        message: `💬 আপনার একটি পোস্টে নতুন কমেন্ট এসেছে!`,
                        link: `/index.html?post=${blogId}`,
                        is_read: false
                    }]);
                }
                openPostDetails(blogId);
            } else {
                showToast('কমেন্ট সাবমিট সমস্যা: ' + error.message, true);
            }
        }

        window.submitBlog = async () => {
            if(!currentUser) { showToast('পোস্ট লিখতে প্রথমে লগইন করুন!', true); return; }
            
            const title = document.getElementById('newBlogTitle').value.trim();
            const content = document.getElementById('newBlogContent').value.trim();
            const imageFile = document.getElementById('newBlogImage').files[0];
            const btn = document.getElementById('submitBlogBtn');
            
            if(!title || !content) { showToast('শিরোনাম এবং বিষয়বস্তু লিখুন!', true); return; }
            btn.innerText = 'সাবমিট হচ্ছে...'; btn.disabled = true;

            try {
                let image_url = null;
                if (imageFile) {
                    const fileName = `blog_${Date.now()}.${imageFile.name.split('.').pop()}`;
                    const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, imageFile);
                    if (uploadError) throw new Error("ছবি আপলোডে সমস্যা: " + uploadError.message);
                    const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                    image_url = data.publicUrl;
                }

                const { error } = await supabaseClient.from('blogs').insert([{ 
                    author_id: currentUser.id, title: title, content: content, image_url: image_url, status: 'pending', views: 0 
                }]);
                
                if (error) throw new Error(error.message);

                showToast('✅ আপনার পোস্টটি সফলভাবে জমা হয়েছে। অ্যাডমিন অ্যাপ্রুভ করার পর ফিডে দেখাবে।', false);
                document.getElementById('newBlogTitle').value = '';
                document.getElementById('newBlogContent').value = '';
                document.getElementById('newBlogImage').value = '';
                document.getElementById('writeBlogForm').classList.add('hidden');
                loadBlogs();
            } catch (err) {
                showToast('সমস্যা: ' + err.message, true);
            } finally {
                btn.innerText = 'সাবমিট করুন'; btn.disabled = false;
            }
        }

        // পেজ লোড হওয়ার সময় URL-এ post প্যারামিটার থাকলে সেই পোস্টটি ওপেন করা
        async function checkUrlForPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('post');
            if (postId) {
                await openPostDetails(postId);
            }
        }

        async function init() {
            await loadAdminSettings(); 
            await checkAuth();
            await loadBooks();
            await loadBlogs(); 
            updateCartCount();
            updateWishlistCount();
            await checkUrlForPost();
        }

        init();
    </script>
</body>
</html>
