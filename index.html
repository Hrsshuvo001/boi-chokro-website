<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boi Chokro - অনলাইন বইঘর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#2563eb' } } }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .dark .card-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
        .card-shadow:hover { transform: translateY(-4px); box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12); }
        
        /* Skeleton Loader Animation */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3 md:gap-0">
            
            <div class="flex justify-between items-center w-full md:w-auto">
                <a href="/" class="flex items-center gap-2 group">
                    <img id="web_header_logo" src="" class="hidden h-8 sm:h-10 w-auto max-w-[40px] object-contain">
                    <span id="web_header_name" class="text-xl sm:text-2xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight">Boi Chokro</span>
                </a>
                
                <!-- মোবাইল ডার্ক মোড ও কার্ট -->
                <div class="flex items-center gap-3 md:hidden">
                    <button onclick="toggleDarkMode()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg></button>
                    <a href="/cart.html" class="relative flex items-center bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-400 px-3 py-1.5 rounded-lg border border-blue-100 dark:border-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                        <span id="cartCountMobile" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border border-white">0</span>
                    </a>
                </div>
            </div>

            <!-- ডেস্কটপ সার্চ বার -->
            <div class="hidden md:block w-full md:w-1/3 relative group">
                <input type="text" id="searchInput" placeholder="বই, লেখক বা প্রকাশনী খুঁজুন..." class="w-full pl-10 pr-4 py-2.5 bg-gray-100 dark:bg-gray-700 border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition shadow-inner text-sm" oninput="handleSearch('desktop')">
                <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3.5 top-3 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                <div id="searchResultsDropdown" class="hidden absolute top-full left-0 w-full mt-2 bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-100 dark:border-gray-700 z-[100] max-h-96 overflow-y-auto"></div>
            </div>

            <!-- ডেস্কটপ ডান দিকের বাটন -->
            <div class="hidden md:flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 transition p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                </button>
                <a href="/cart.html" class="relative flex items-center gap-1.5 bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-400 hover:bg-blue-100 px-4 py-2 rounded-lg font-semibold transition border border-blue-100 dark:border-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span class="text-sm">কার্ট</span>
                    <span id="cartCountDesktop" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">0</span>
                </a>
                <div id="authButtonsDesktop" class="flex items-center gap-2 text-sm"></div>
            </div>
        </div>
    </nav>

    <!-- হিরো সেকশন -->
    <header class="bg-gradient-to-br from-blue-900 via-blue-700 to-blue-500 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 text-white pt-12 pb-20 px-4 text-center rounded-b-[2rem] relative overflow-hidden">
        <h1 id="web_tagline" class="text-3xl sm:text-4xl lg:text-5xl font-extrabold mb-4 tracking-tight relative z-10">আপনার পছন্দের বই, এক জায়গায়</h1>
        <p class="text-sm sm:text-base lg:text-lg text-blue-100 dark:text-gray-300 max-w-2xl mx-auto mb-8 relative z-10">সেরা লেখকদের বইয়ের বিশাল সংগ্রহ। আজই আপনার প্রিয় বইটি খুঁজে নিন।</p>
        
        <div class="md:hidden max-w-md mx-auto relative group z-20">
            <input type="text" id="searchInputMobile" placeholder="বই খুঁজুন..." class="w-full pl-10 pr-4 py-3 bg-white/20 dark:bg-gray-800/50 backdrop-blur-md border border-white/30 text-white rounded-full focus:outline-none focus:bg-white focus:text-gray-800 transition shadow-lg text-sm" oninput="handleSearch('mobile')">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3.5 top-3 h-5 w-5 text-blue-100" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            <div id="searchResultsDropdownMobile" class="hidden absolute top-full left-0 w-full mt-2 bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-100 dark:border-gray-700 z-[100] max-h-80 overflow-y-auto text-left"></div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 -mt-10 relative z-30 pb-16">
        
        <section id="allBooksSection" class="mt-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 border-b dark:border-gray-700 pb-4 gap-4">
                <h2 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white tracking-tight">সব বই</h2>
                <div class="flex flex-wrap gap-2" id="categoryButtons">
                    <button onclick="filterCategory('all')" class="category-btn bg-blue-600 text-white px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition shadow-sm">সব বই</button>
                </div>
            </div>

            <!-- স্কেলিটন লোডার (লোড হওয়ার সময় দেখাবে) -->
            <div id="skeletonLoader" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                ${Array(4).fill().map(() => `
                <div class="bg-white dark:bg-gray-800 rounded-xl p-4 border border-gray-100 dark:border-gray-700">
                    <div class="skeleton w-full h-48 bg-gray-200 dark:bg-gray-700 rounded-lg mb-4"></div>
                    <div class="skeleton h-4 bg-gray-200 dark:bg-gray-700 rounded w-3/4 mb-2"></div>
                    <div class="skeleton h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mb-4"></div>
                    <div class="skeleton h-8 bg-gray-200 dark:bg-gray-700 rounded w-full"></div>
                </div>
                `).join('')}
            </div>

            <!-- মূল গ্রিড -->
            <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6 items-stretch hidden">
                <!-- সব বই লোড হবে -->
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 dark:bg-black text-gray-400 py-10 text-center mt-auto border-t-4 border-blue-600">
        <div class="max-w-7xl mx-auto px-4">
            <p class="text-lg font-bold text-white mb-2">Boi Chokro</p>
            <p id="web_footer_text" class="text-xs sm:text-sm font-medium">&copy; 2024 Boi Chokro. All rights reserved.</p>
        </div>
    </footer>

    <!-- চ্যাট বাটন (আগের মতোই) -->
    <button onclick="window.location.href='/chat.html'" class="fixed bottom-4 right-4 z-50 bg-blue-600 text-white p-4 rounded-full shadow-xl hover:bg-blue-700 transition flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
    </button>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allBooksData = []; 
        let userWishlist = []; // ইউজারের উইশলিস্ট ডাটা

        // ডার্ক মোড লজিক
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        window.toggleDarkMode = () => {
            document.documentElement.classList.toggle('dark');
            if(document.documentElement.classList.contains('dark')) localStorage.setItem('theme', 'dark');
            else localStorage.setItem('theme', 'light');
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            document.getElementById('cartCountMobile').innerText = cart.length;
            document.getElementById('cartCountDesktop').innerText = cart.length;
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtonsDesktop = document.getElementById('authButtonsDesktop');
            
            if (session) {
                currentUser = session.user;
                // উইশলিস্ট লোড করা
                const { data: wish } = await supabaseClient.from('wishlists').select('book_id').eq('user_id', currentUser.id);
                if(wish) userWishlist = wish.map(w => w.book_id);

                authButtonsDesktop.innerHTML = `
                    <a href="/profile.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-200 transition">প্রোফাইল</a>
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-semibold border border-red-200 hover:bg-red-100 transition">লগআউট</button>
                `;
            } else {
                currentUser = null;
                authButtonsDesktop.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition shadow-sm">লগইন</a>`;
            }
        }

        // কার্ড তৈরি (উইশলিস্ট বাটনসহ)
        function createBookCard(book) {
            const currentPrice = book.discount_price || book.original_price || 0;
            const hasDiscount = book.original_price && book.discount_price && book.original_price > book.discount_price;
            let discountPercent = 0;
            if (hasDiscount) discountPercent = Math.round(((book.original_price - book.discount_price) / book.original_price) * 100);
            const isOutOfStock = (book.stock_quantity !== undefined && book.stock_quantity !== null) ? book.stock_quantity <= 0 : false;
            const isWishlisted = userWishlist.includes(book.id);

            return `
            <div class="bg-white dark:bg-gray-800 rounded-xl card-shadow transition-all duration-300 flex flex-col relative group w-full h-full overflow-hidden border border-gray-100 dark:border-gray-700">
                
                <!-- উইশলিস্ট বাটন -->
                <button onclick="toggleWishlist(event, '${book.id}')" class="absolute top-2 right-2 z-20 p-1.5 bg-white/80 dark:bg-gray-900/80 backdrop-blur rounded-full shadow-sm hover:scale-110 transition ${isWishlisted ? 'text-red-500' : 'text-gray-400 dark:text-gray-500'}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="${isWishlisted ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                </button>

                <a href="/book-details.html?id=${book.id}" class="block w-full aspect-[3/4] bg-gray-100 dark:bg-gray-700 overflow-hidden relative">
                    ${hasDiscount ? `<div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded-md shadow-md z-10">${discountPercent}% ছাড়</div>` : ''}
                    ${isOutOfStock ? `<div class="absolute inset-0 bg-black/60 backdrop-blur-[2px] flex items-center justify-center z-10"><span class="bg-red-600 text-white font-bold text-xs sm:text-sm px-3 py-1 rounded-md shadow-lg">স্টক নেই</span></div>` : ''}
                    <img src="${book.cover_url || 'https://via.placeholder.com/300x400?text=No+Image'}" class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
                </a>
                
                <div class="p-3 sm:p-4 flex flex-col flex-grow bg-white dark:bg-gray-800">
                    <span class="text-[10px] sm:text-xs text-blue-600 dark:text-blue-400 font-bold uppercase mb-1">${book.category || 'সাধারণ'}</span>
                    <a href="/book-details.html?id=${book.id}" class="mb-1 block">
                        <h3 class="font-bold text-sm sm:text-base text-gray-900 dark:text-white leading-snug line-clamp-2 group-hover:text-blue-600 transition h-[38px] sm:h-[44px]">${book.title || 'নামহীন বই'}</h3>
                    </a>
                    <div class="mt-auto pt-2 flex flex-col gap-0.5 mb-3">
                        <p class="text-[11px] sm:text-xs text-gray-500 dark:text-gray-400 truncate">লেখক: <span class="text-gray-700 dark:text-gray-300 font-medium">${book.author || 'অজানা'}</span></p>
                        <p class="text-[11px] sm:text-xs text-gray-500 dark:text-gray-400 truncate">প্রকাশনী: <span class="text-gray-700 dark:text-gray-300 font-medium">${book.publisher || 'N/A'}</span></p>
                    </div>
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-lg sm:text-xl font-extrabold text-gray-900 dark:text-white">৳ ${currentPrice}</span>
                        ${hasDiscount ? `<span class="text-gray-400 dark:text-gray-500 line-through text-xs font-medium">৳ ${book.original_price}</span>` : ''}
                    </div>
                    <div class="mt-auto">
                        ${isOutOfStock ? `
                            <button disabled class="w-full bg-gray-100 dark:bg-gray-700 text-gray-400 font-bold py-2 rounded-xl text-xs sm:text-sm cursor-not-allowed border border-gray-200 dark:border-gray-600">স্টক নেই</button>
                        ` : `
                            <button onclick="addToCart('${book.id}', '${book.title}', ${currentPrice}, '${book.cover_url}')" class="w-full bg-emerald-600 text-white hover:bg-emerald-700 font-bold py-2 rounded-xl transition text-xs sm:text-sm shadow-sm flex items-center justify-center gap-1.5">
                                কার্টে যোগ করুন
                            </button>
                        `}
                    </div>
                </div>
            </div>`;
        }

        async function loadHomePage() {
            const { data: books, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
            
            // স্কেলিটন হাইড করে গ্রিড দেখানো
            document.getElementById('skeletonLoader').classList.add('hidden');
            document.getElementById('bookGrid').classList.remove('hidden');

            if (error || !books) return;
            allBooksData = books;

            const { data: categories } = await supabaseClient.from('categories').select('*').order('name');
            const categoryButtons = document.getElementById('categoryButtons');

            if (categories) {
                categories.forEach(cat => {
                    categoryButtons.insertAdjacentHTML('beforeend', `
                        <button onclick="filterCategory('${cat.name}')" class="category-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600 px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold hover:bg-blue-50 dark:hover:bg-gray-700 transition shadow-sm">${cat.name}</button>
                    `);
                });
            }
            renderBooks(books);
        }

        window.filterCategory = (category) => {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600'); 
                btn.classList.add('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300', 'border-gray-200', 'dark:border-gray-600');
            });
            const clickedBtn = Array.from(document.querySelectorAll('.category-btn')).find(btn => btn.innerText.trim() === (category === 'all' ? 'সব বই' : category));
            if (clickedBtn) { 
                clickedBtn.classList.remove('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300', 'border-gray-200', 'dark:border-gray-600'); 
                clickedBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-600'); 
            }

            let filtered = allBooksData;
            if (category !== 'all') filtered = allBooksData.filter(book => book.category === category);
            renderBooks(filtered);
        }

        function renderBooks(books) {
            const grid = document.getElementById('bookGrid');
            if (books.length === 0) { 
                grid.innerHTML = `<p class="text-gray-500 dark:text-gray-400 col-span-full text-center py-12 text-sm">কোনো বই পাওয়া যায়নি।</p>`; 
                return; 
            }
            grid.innerHTML = books.map(book => createBookCard(book)).join('');
        }

        // উইশলিস্ট লজিক
        window.toggleWishlist = async (event, bookId) => {
            event.preventDefault(); // পেজ রিলোড বা লিংকে যাওয়া আটকানো
            if (!currentUser) { alert('উইশলিস্টে যোগ করতে লগইন করুন!'); return; }

            const isWishlisted = userWishlist.includes(bookId);
            
            if (isWishlisted) {
                // রিমুভ করা
                await supabaseClient.from('wishlists').delete().eq('user_id', currentUser.id).eq('book_id', bookId);
                userWishlist = userWishlist.filter(id => id !== bookId);
            } else {
                // যোগ করা
                await supabaseClient.from('wishlists').insert([{ user_id: currentUser.id, book_id: bookId }]);
                userWishlist.push(bookId);
            }
            
            // UI আপডেট
            loadHomePage(); 
        }

        window.addToCart = (id, title, price, image) => {
            if (!currentUser) { alert('কার্টে যোগ করতে লগইন করুন!'); window.location.href = '/login.html'; return; }
            let cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            if (cart.find(item => item.id === id)) { alert('বইটি আগেই কার্টে আছে!'); return; }
            cart.push({ id, title, price, image }); localStorage.setItem('boiChokroCart', JSON.stringify(cart));
            updateCartCount(); alert('সফলভাবে কার্টে যোগ হয়েছে!');
        }

        window.handleLogout = async () => { await supabaseClient.auth.signOut(); checkAuth(); alert('লগআউট হয়েছে।'); }

        checkAuth(); 
        loadHomePage(); 
        updateCartCount();
    </script>
</body>
</html>
