<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boi Chokro - অনলাইন বইঘর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* স্লাইডারের স্ক্রলবার লুকানোর জন্য */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-600 tracking-tight">Boi Chokro</a>
            
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="/cart.html" class="relative text-gray-600 hover:text-blue-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span id="cartCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </a>
                <div id="authButtons" class="flex items-center gap-3">
                    <div class="animate-pulse bg-gray-200 h-8 w-16 rounded"></div>
                </div>
            </div>
        </div>
    </nav>

    <header class="bg-blue-600 text-white py-12 px-4 text-center">
        <h1 class="text-3xl md:text-5xl font-bold mb-4">আপনার পছন্দের বই, এক জায়গায়</h1>
        <p class="text-lg md:text-xl text-blue-100 max-w-2xl mx-auto">সেরা লেখকদের বইয়ের বিশাল সংগ্রহ।</p>
    </header>

    <!-- মেইন কন্টেন্ট -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
        
        <!-- ১. বেস্ট সেলার সেকশন -->
        <section class="mb-12">
            <div class="flex items-center gap-2 mb-6">
                <span class="text-3xl">🔥</span>
                <h2 class="text-2xl font-bold text-gray-800">বেস্ট সেলার</h2>
            </div>
            <div id="bestSellerGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <p class="text-gray-500 col-span-full">লোড হচ্ছে...</p>
            </div>
        </section>

        <hr class="border-gray-300 mb-8">

        <!-- ২. ইসলামিক বই স্লাইডার সেকশন -->
        <section class="mb-12">
            <div class="flex justify-between items-end mb-6">
                <div class="flex items-center gap-2">
                    <span class="text-3xl">🕌</span>
                    <h2 class="text-2xl font-bold text-gray-800">ইসলামিক বই</h2>
                </div>
                <!-- সব বই দেখুন বাটন -->
                <a href="/category.html?cat=ইসলামিক" class="text-blue-600 font-semibold hover:underline text-sm md:text-base flex items-center gap-1">
                    সব বই দেখুন 
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                </a>
            </div>
            
            <!-- স্লাইডার কন্টেইনার -->
            <div id="islamicBookSlider" class="flex overflow-x-auto gap-4 snap-x pb-4 hide-scrollbar">
                <p class="text-gray-500">লোড হচ্ছে...</p>
            </div>
        </section>

        <hr class="border-gray-300 mb-8">

        <!-- ৩. সব ক্যাটাগরি ও বই -->
        <section>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">সব ক্যাটাগরি</h2>
            
            <div class="flex flex-wrap gap-2 mb-6" id="categoryButtons">
                <button onclick="filterCategory('all')" class="category-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition">সব বই</button>
                <!-- ক্যাটাগরি বাটনগুলো ডাইনামিকভাবে লোড হবে, আপাতত হার্ডকোড করা হলো -->
                <button onclick="filterCategory('গল্পের বই')" class="category-btn bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold hover:bg-blue-50 transition">গল্পের বই</button>
                <button onclick="filterCategory('উপন্যাস')" class="category-btn bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold hover:bg-blue-50 transition">উপন্যাস</button>
                <button onclick="filterCategory('ইসলামিক')" class="category-btn bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold hover:bg-blue-50 transition">ইসলামিক</button>
            </div>

            <div id="bookGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- বই লোড হবে -->
            </div>
        </section>
    </main>

    <footer class="bg-gray-800 text-gray-300 py-6 text-center mt-auto">
        <p>&copy; 2024 Boi Chokro. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allBooksData = []; 

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtons = document.getElementById('authButtons');

            if (session) {
                currentUser = session.user;
                authButtons.innerHTML = `
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-100 border border-red-200">লগআউট</button>
                `;
            } else {
                currentUser = null;
                authButtons.innerHTML = `
                    <a href="/login.html" class="text-blue-600 text-sm font-semibold hover:underline">লগইন</a>
                `;
            }
        }

        // বইয়ের কার্ড তৈরির ফাংশন (স্লাইডার ও গ্রিড দুই জায়গায় ব্যবহারের জন্য)
        function createBookCard(book, isSlider = false) {
            const currentPrice = book.discount_price || book.original_price || 0;
            const hasDiscount = book.original_price && book.discount_price && book.original_price > book.discount_price;
            
            // স্লাইডারের জন্য নির্দিষ্ট প্রস্থ (Width) সেট করা
            const widthClass = isSlider ? "min-w-[220px] max-w-[220px] snap-start" : "w-full";

            return `
            <div class="bg-white rounded-xl shadow-sm hover:shadow-xl transition duration-300 overflow-hidden flex flex-col border border-gray-100 relative ${widthClass}">
                ${hasDiscount ? `<div class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded shadow z-10">ডিসকাউন্ট</div>` : ''}
                <div class="h-56 bg-gray-100">
                    <img src="${book.cover_url || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                </div>
                
                <div class="p-4 flex flex-col flex-grow">
                    <span class="text-xs text-blue-600 font-semibold mb-1">${book.category || 'সাধারণ'}</span>
                    <h3 class="font-bold text-md text-gray-800 leading-tight mb-1 line-clamp-2">${book.title}</h3>
                    <p class="text-xs text-gray-500 mb-3">লেখক: ${book.author}</p>
                    
                    <div class="flex items-end gap-2 mb-3 mt-auto">
                        <span class="text-xl font-bold text-blue-600">৳ ${currentPrice}</span>
                        ${hasDiscount ? `<span class="text-gray-400 line-through text-xs mb-1">৳ ${book.original_price}</span>` : ''}
                    </div>

                    ${book.is_affiliate ? `
                        <button onclick="handleAffiliateBuy('${book.purchase_link}')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-1.5 rounded-lg transition text-sm">অন্য সাইট থেকে কিনুন</button>
                    ` : `
                        <button onclick="addToCart('${book.id}', '${book.title}', ${currentPrice}, '${book.cover_url}')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-1.5 rounded-lg transition flex justify-center items-center gap-1 text-sm">
                            কার্টে যোগ করুন
                        </button>
                    `}
                </div>
            </div>
            `;
        }

        async function loadBooks() {
            const { data: books, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
            
            if (error || !books) {
                document.getElementById('bookGrid').innerHTML = `<p class="text-gray-500 col-span-full text-center">বই লোড করতে সমস্যা হয়েছে।</p>`;
                return;
            }

            allBooksData = books;

            // ১. বেস্ট সেলার
            const bestSellers = [...books].sort((a, b) => (b.sales_count || 0) - (a.sales_count || 0)).slice(0, 4);
            document.getElementById('bestSellerGrid').innerHTML = bestSellers.map(book => createBookCard(book)).join('');

            // ২. ইসলামিক স্লাইডার (সর্বোচ্চ ৫টি বই)
            const islamicBooks = books.filter(book => book.category === 'ইসলামিক').slice(0, 5);
            const sliderDiv = document.getElementById('islamicBookSlider');
            
            if (islamicBooks.length > 0) {
                sliderDiv.innerHTML = islamicBooks.map(book => createBookCard(book, true)).join('');
            } else {
                sliderDiv.innerHTML = `<p class="text-gray-500">এই ক্যাটাগরিতে এখনো কোনো বই যোগ করা হয়নি।</p>`;
            }

            // ৩. সাধারণ গ্রিড
            renderFilteredBooks('all');
        }

        window.filterCategory = (category) => {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700', 'border-gray-300');
            });
            
            const clickedBtn = Array.from(buttons).find(btn => btn.innerText.trim() === (category === 'all' ? 'সব বই' : category));
            if (clickedBtn) {
                clickedBtn.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');
                clickedBtn.classList.add('bg-blue-600', 'text-white');
            }

            renderFilteredBooks(category);
        }

        function renderFilteredBooks(category) {
            const grid = document.getElementById('bookGrid');
            let filtered = allBooksData;
            
            if (category !== 'all') {
                filtered = allBooksData.filter(book => book.category === category);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">এই ক্যাটাগরিতে কোনো বই পাওয়া যায়নি।</p>`;
                return;
            }

            grid.innerHTML = filtered.map(book => createBookCard(book)).join('');
        }

        window.addToCart = (id, title, price, image) => {
            if (!currentUser) {
                alert('কার্টে যোগ করতে অনুগ্রহ করে প্রথমে লগইন করুন!');
                window.location.href = '/login.html';
                return;
            }
            let cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            if (cart.find(item => item.id === id)) {
                alert('বইটি ইতিমধ্যে আপনার কার্টে আছে!');
                return;
            }
            cart.push({ id, title, price, image });
            localStorage.setItem('boiChokroCart', JSON.stringify(cart));
            updateCartCount();
            alert('সফলভাবে কার্টে যোগ হয়েছে!');
        }

        window.handleAffiliateBuy = (link) => {
            if (!currentUser) {
                alert('লিংকে যেতে অনুগ্রহ করে প্রথমে লগইন করুন!');
                window.location.href = '/login.html';
                return;
            }
            if(link) window.open(link, '_blank');
        }

        window.handleLogout = async () => {
            await supabaseClient.auth.signOut();
            checkAuth(); 
        }

        checkAuth();
        loadBooks();
        updateCartCount();
    </script>
</body>
</html>
