<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boi Chokro - অনলাইন বইঘর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); transition: all 0.3s ease; }
        .dark .card-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
        .card-shadow:hover { transform: translateY(-4px); box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12); }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 transition-colors duration-300 no-print">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3 md:gap-0">
            
            <div class="flex justify-between items-center w-full md:w-auto">
                <a href="/" class="flex items-center gap-2 group">
                    <img id="web_header_logo" src="" class="hidden h-8 sm:h-10 w-auto max-w-[40px] object-contain">
                    <span id="web_header_name" class="text-xl sm:text-2xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight">Boi Chokro</span>
                </a>
                
                <div class="flex items-center gap-3 md:hidden">
                    <a href="/wishlist.html" class="text-red-500 hover:text-red-600 p-1.5"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg></a>
                    <button onclick="toggleDarkMode()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg></button>
                    <a href="/cart.html" class="relative flex items-center bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-400 px-3 py-1.5 rounded-lg border border-blue-100 dark:border-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                        <span id="cartCountMobile" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border border-white">0</span>
                    </a>
                </div>
            </div>

            <div class="hidden md:block w-full md:w-1/3 relative group">
                <input type="text" id="searchInput" placeholder="বই, লেখক বা প্রকাশনী খুঁজুন..." class="w-full pl-10 pr-4 py-2.5 bg-gray-100 dark:bg-gray-700 border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition shadow-inner text-sm" oninput="handleSearch('desktop')">
                <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3.5 top-3 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                <div id="searchResultsDropdown" class="hidden search-dropdown-custom bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-100 dark:border-gray-700 max-h-96 overflow-y-auto"></div>
            </div>

            <!-- ডেস্কটপ মেনু -->
            <div class="hidden md:flex items-center gap-3">
                <!-- নোটিফিকেশন বেল -->
                <div class="relative">
                    <button onclick="toggleNotifications()" class="relative p-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                        <span id="notifBadge" class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center hidden">0</span>
                    </button>
                    <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-72 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 z-50 max-h-80 overflow-y-auto">
                        <div class="p-3 bg-gray-50 dark:bg-gray-900 border-b dark:border-gray-700 font-bold text-sm rounded-t-lg">নোটিফিকেশন</div>
                        <div id="notifList" class="divide-y divide-gray-100 dark:divide-gray-700"></div>
                    </div>
                </div>

                <!-- ইনবক্স -->
                <a href="/inbox.html" class="relative p-2 text-gray-600 dark:text-gray-300 hover:text-blue-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
                </a>

                <a href="/wishlist.html" class="text-red-500 hover:text-red-600 p-2" title="উইশলিস্ট"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg></a>
                <button onclick="toggleDarkMode()" class="text-gray-500 dark:text-gray-400 hover:text-blue-600 transition p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg></button>
                <a href="/cart.html" class="relative flex items-center gap-1.5 bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-400 hover:bg-blue-100 px-4 py-2 rounded-lg font-semibold transition border border-blue-100 dark:border-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span class="text-sm">কার্ট</span>
                    <span id="cartCountDesktop" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">0</span>
                </a>
                <div id="authButtonsDesktop" class="flex items-center gap-2 text-sm"></div>
            </div>
        </div>
    </nav>

    <!-- ডাইনামিক হিরো সেকশন -->
    <header id="heroSection" class="relative bg-gray-900 text-white rounded-b-[2rem] shadow-lg min-h-[16rem] sm:min-h-[20rem] md:min-h-[24rem] flex items-center justify-center no-print z-40">
        <div id="heroBannerImage" class="absolute inset-0 bg-gradient-to-br from-blue-900 via-blue-700 to-blue-500 bg-cover bg-center transition-all duration-500 rounded-b-[2rem]"></div>
        <div class="absolute inset-0 bg-black/40 rounded-b-[2rem]"></div>
        
        <div class="relative z-50 text-center px-4 w-full max-w-4xl mx-auto py-8">
            <h1 id="web_tagline" class="text-3xl sm:text-4xl md:text-5xl font-extrabold mb-4 tracking-tight drop-shadow-lg">আপনার পছন্দের বই, এক জায়গায়</h1>
            <p class="text-sm sm:text-base md:text-lg text-gray-200 max-w-2xl mx-auto mb-8 drop-shadow">সেরা লেখকদের বইয়ের বিশাল সংগ্রহ। আজই আপনার প্রিয় বইটি খুঁজে নিন।</p>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 -mt-8 relative z-30 pb-16 no-print">
        
        <!-- বুক সেকশন -->
        <section id="allBooksSection" class="mt-8">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border border-gray-100 dark:border-gray-700">
                <div class="flex flex-wrap gap-2 w-full md:w-auto" id="categoryButtons">
                    <button onclick="filterCategory('all')" class="category-btn bg-blue-600 text-white px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition shadow-sm">সব বই</button>
                </div>
            </div>
            <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6 items-stretch"></div>
        </section>

        <!-- নতুন ব্লগ সেকশন -->
        <section id="blogSection" class="mt-16 mb-12">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white border-l-4 border-blue-600 pl-3">ব্লগ এবং সাহিত্য</h2>
                <!-- ব্লগ লেখার বাটন -->
                <button onclick="document.getElementById('writeBlogForm').classList.toggle('hidden')" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 transition">✍️ নতুন ব্লগ লিখুন</button>
            </div>

            <!-- ব্লগ লেখার ফর্ম (লুকানো থাকবে, বাটনে ক্লিক করলে খুলবে) -->
            <div id="writeBlogForm" class="hidden bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md mb-8 border border-gray-100 dark:border-gray-700">
                <h3 class="text-xl font-bold mb-4">নতুন ব্লগ লিখুন</h3>
                <div class="space-y-4">
                    <input type="text" id="newBlogTitle" placeholder="ব্লগের শিরোনাম" class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
                    <textarea id="newBlogContent" rows="5" placeholder="আপনার ব্লগের বিষয়বস্তু লিখুন..." class="w-full px-4 py-2 border rounded-md dark:bg-gray-700 dark:border-gray-600 focus:outline-none"></textarea>
                    <button onclick="submitBlog()" id="submitBlogBtn" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700 transition">সাবমিট করুন</button>
                </div>
            </div>
            
            <div id="blogList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-gray-500 col-span-full text-center">ব্লগ লোড হচ্ছে...</p>
            </div>
        </section>
    </main>

    <!-- ফুটার -->
    <footer class="bg-gray-900 dark:bg-black text-gray-400 pt-12 pb-6 mt-auto border-t-4 border-blue-600 no-print">
        <div class="text-center border-t border-gray-800 pt-6 text-xs mt-8">
            <p id="web_footer_text">&copy; 2024 Boi Chokro. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // ডার্ক মোড
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        window.toggleDarkMode = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        // কার্ট আপডেট
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            document.getElementById('cartCountMobile').innerText = cart.length;
            document.getElementById('cartCountDesktop').innerText = cart.length;
        }

        // ইউজার চেক
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authBtn = document.getElementById('authButtonsDesktop');
            
            if (session) {
                currentUser = session.user;
                authBtn.innerHTML = `
                    <a href="/profile.html" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-200 transition">প্রোফাইল</a>
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-semibold border border-red-200 hover:bg-red-100 transition">লগআউট</button>
                `;
                loadNotifications(); // লগইন থাকলে নোটিফিকেশন লোড করব
            } else {
                currentUser = null;
                authBtn.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">লগইন</a>`;
            }
        }

        // নোটিফিকেশন লোড
        async function loadNotifications() {
            if(!currentUser) return;
            const { data: notifs } = await supabaseClient.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            
            const badge = document.getElementById('notifBadge');
            const list = document.getElementById('notifList');
            
            if(!notifs || notifs.length === 0) {
                list.innerHTML = `<div class="p-4 text-center text-sm text-gray-500">কোনো নোটিফিকেশন নেই</div>`;
                badge.classList.add('hidden');
                return;
            }

            const unread = notifs.filter(n => !n.is_read).length;
            if(unread > 0) { badge.innerText = unread; badge.classList.remove('hidden'); }
            else badge.classList.add('hidden');

            list.innerHTML = notifs.map(n => `
                <div class="p-3 text-sm border-b dark:border-gray-700 ${!n.is_read ? 'bg-blue-50 dark:bg-gray-700 font-semibold' : 'text-gray-600'}">
                    ${n.message}
                    <p class="text-[10px] text-gray-400 mt-1">${new Date(n.created_at).toLocaleString('bn-BD')}</p>
                </div>
            `).join('');
        }

        window.toggleNotifications = () => { document.getElementById('notifDropdown').classList.toggle('hidden'); };

        // ব্লগ লোড করা
        async function loadBlogs() {
            const blogList = document.getElementById('blogList');
            try {
                const { data: blogs, error } = await supabaseClient
                    .from('blogs')
                    .select('*, profiles(full_name, email)')
                    .eq('status', 'approved')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                if (!blogs || blogs.length === 0) {
                    blogList.innerHTML = `<div class="col-span-full text-center py-10 bg-white dark:bg-gray-800 rounded-xl"><p class="text-gray-500">এখনো কোনো ব্লগ প্রকাশিত হয়নি।</p></div>`;
                    return;
                }

                blogList.innerHTML = blogs.map(blog => {
                    const authorName = blog.profiles?.full_name || blog.profiles?.email?.split('@')[0] || 'Unknown';
                    const date = new Date(blog.created_at).toLocaleDateString('bn-BD');
                    return `
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col h-full">
                        <div class="flex justify-between items-start mb-2"><span class="text-xs text-gray-500">${date}</span></div>
                        <h3 class="text-xl font-bold mb-2 text-gray-900 dark:text-white line-clamp-2">${blog.title}</h3>
                        <p class="text-sm text-gray-500 mb-4">লেখক: <span class="text-blue-600 font-semibold">${authorName}</span></p>
                        <p class="text-gray-700 dark:text-gray-300 text-sm mb-4 line-clamp-3">${blog.content}</p>
                        
                        <div class="mt-auto pt-4 border-t border-gray-100 dark:border-gray-700 flex items-center gap-4">
                            <button onclick="likeBlog('${blog.id}')" class="flex items-center gap-1 text-gray-500 hover:text-red-500">❤️ <span id="like-count-${blog.id}">0</span></button>
                            <button onclick="toggleCommentBox('${blog.id}')" class="flex items-center gap-1 text-gray-500 hover:text-blue-500">💬 কমেন্ট</button>
                        </div>
                        
                        <div id="comments-${blog.id}" class="hidden mt-4 border-t pt-4">
                            <div id="comment-list-${blog.id}" class="space-y-2 mb-4 max-h-40 overflow-y-auto"></div>
                            <div class="flex gap-2">
                                <input type="text" id="comment-input-${blog.id}" placeholder="কমেন্ট লিখুন..." class="flex-grow px-3 py-1.5 border rounded-md text-sm dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
                                <button onclick="postComment('${blog.id}')" class="bg-blue-600 text-white px-4 py-1.5 rounded-md text-sm hover:bg-blue-700">পাঠান</button>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');

                blogs.forEach(async (blog) => {
                    const { count } = await supabaseClient.from('blog_likes').select('*', { count: 'exact', head: true }).eq('blog_id', blog.id);
                    document.getElementById(`like-count-${blog.id}`).innerText = count || 0;
                });

            } catch (error) {
                console.error("Blog load error:", error);
                blogList.innerHTML = `<p class="text-red-500 col-span-full text-center">ব্লগ লোড করতে সমস্যা হয়েছে।</p>`;
            }
        }

        // ব্লগ সাবমিট করা
        window.submitBlog = async () => {
            if(!currentUser) { alert('ব্লগ লিখতে লগইন করুন!'); return; }
            const title = document.getElementById('newBlogTitle').value;
            const content = document.getElementById('newBlogContent').value;
            const btn = document.getElementById('submitBlogBtn');
            
            if(!title || !content) { alert('শিরোনাম এবং বিষয়বস্তু লিখুন!'); return; }
            btn.innerText = 'সাবমিট হচ্ছে...'; btn.disabled = true;

            try {
                const { error } = await supabaseClient.from('blogs').insert([{
                    author_id: currentUser.id,
                    title: title,
                    content: content,
                    status: 'pending' // অ্যাডমিন প্যানেলে পেন্ডিং হিসেবে যাবে
                }]);
                if (error) throw error;
                alert('✅ আপনার ব্লগটি সফলভাবে জমা হয়েছে। অ্যাডমিন অ্যাপ্রুভ করলে প্রকাশ পাবে।');
                document.getElementById('newBlogTitle').value = '';
                document.getElementById('newBlogContent').value = '';
                document.getElementById('writeBlogForm').classList.add('hidden');
            } catch(err) {
                alert('⚠️ সমস্যা: ' + err.message);
            } finally {
                btn.innerText = 'সাবমিট করুন'; btn.disabled = false;
            }
        }

        // লাইক ফাংশন
        window.likeBlog = async (blogId) => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if(!session) { alert('লাইক দিতে লগইন করুন!'); return; }

            const { data: existing } = await supabaseClient.from('blog_likes').select('id').eq('blog_id', blogId).eq('user_id', session.user.id).maybeSingle();
            
            if(existing) {
                await supabaseClient.from('blog_likes').delete().eq('id', existing.id);
            } else {
                await supabaseClient.from('blog_likes').insert([{ blog_id: blogId, user_id: session.user.id }]);
            }
            loadBlogs();
        }

        window.toggleCommentBox = (blogId) => {
            const box = document.getElementById(`comments-${blogId}`);
            box.classList.toggle('hidden');
            if(!box.classList.contains('hidden')) loadComments(blogId);
        }

        window.postComment = async (blogId) => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if(!session) { alert('কমেন্ট দিতে লগইন করুন!'); return; }

            const input = document.getElementById(`comment-input-${blogId}`);
            const comment = input.value.trim();
            if(!comment) return;

            await supabaseClient.from('blog_comments').insert([{ blog_id: blogId, user_id: session.user.id, comment }]);
            input.value = '';
            loadComments(blogId);
        }

        async function loadComments(blogId) {
            const list = document.getElementById(`comment-list-${blogId}`);
            const { data: comments } = await supabaseClient.from('blog_comments').select('*, profiles(full_name)').eq('blog_id', blogId).order('created_at');
            
            if(!comments || comments.length === 0) { list.innerHTML = '<p class="text-xs text-gray-500">কোনো কমেন্ট নেই।</p>'; return; }
            list.innerHTML = comments.map(c => `
                <div class="bg-gray-50 dark:bg-gray-700 p-2 rounded text-xs text-gray-800 dark:text-gray-200"><span class="font-bold">${c.profiles?.full_name || 'User'}:</span> ${c.comment}</div>
            `).join('');
        }

        window.handleLogout = async () => { await supabaseClient.auth.signOut(); checkAuth(); alert('লগআউট হয়েছে।'); }

        // শুরু
        checkAuth();
        loadBlogs();
        updateCartCount();
    </script>
</body>
</html>
