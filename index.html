<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boi Chokro - অনলাইন বইঘর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-600 tracking-tight">Boi Chokro</a>
            
            <!-- লগইন অবস্থার ওপর ভিত্তি করে বাটন পরিবর্তন হবে -->
            <div id="authButtons" class="flex items-center gap-4">
                <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে বাটন লোড হবে -->
                <div class="animate-pulse bg-gray-200 h-8 w-20 rounded"></div>
            </div>
        </div>
    </nav>

    <!-- হিরো সেকশন -->
    <header class="bg-blue-600 text-white py-12 px-4">
        <div class="max-w-7xl mx-auto text-center">
            <h1 class="text-3xl md:text-5xl font-bold mb-4">আপনার পছন্দের বই, এক জায়গায়</h1>
            <p class="text-lg md:text-xl text-blue-100 max-w-2xl mx-auto">সেরা লেখকদের বইয়ের বিশাল সংগ্রহ। আজই আপনার প্রিয় বইটি খুঁজে নিন অথবা অন্য সাইট থেকে অ্যাফিলিয়েট লিংকের মাধ্যমে কিনুন।</p>
        </div>
    </header>

    <!-- বইয়ের গ্রিড -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-10">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">সব বই</h2>
        <div id="bookGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- লোডিং ইন্ডিকেটর -->
            <p class="text-gray-500 col-span-full text-center py-10">বই লোড হচ্ছে, অপেক্ষা করুন...</p>
        </div>
    </main>

    <!-- ফুটার -->
    <footer class="bg-gray-800 text-gray-300 py-6 text-center mt-auto">
        <p>&copy; 2024 Boi Chokro. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // ১. ইউজার লগইন আছে কি না চেক করা এবং নেভবার আপডেট করা
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtons = document.getElementById('authButtons');

            if (session) {
                currentUser = session.user;
                authButtons.innerHTML = `
                    <span class="text-sm text-gray-600 hidden sm:block">স্বাগতম, ${currentUser.email.split('@')[0]}</span>
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-100 border border-red-200">লগআউট</button>
                `;
            } else {
                currentUser = null;
                authButtons.innerHTML = `
                    <a href="/login.html" class="text-blue-600 text-sm font-semibold hover:underline">লগইন</a>
                    <a href="/signup.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 shadow-sm">সাইন আপ</a>
                `;
            }
        }

        // ২. ডাটাবেস থেকে বই লোড করা (সবার জন্য উন্মুক্ত)
        async function loadBooks() {
            const { data: books, error } = await supabaseClient
                .from('books')
                .select('*')
                .order('created_at', { ascending: false });

            const bookGrid = document.getElementById('bookGrid');

            if (error) {
                bookGrid.innerHTML = `<p class="text-red-500 col-span-full text-center">বই লোড করতে সমস্যা হয়েছে!</p>`;
                return;
            }

            if (books.length === 0) {
                bookGrid.innerHTML = `<p class="text-gray-500 col-span-full text-center">এখনো কোনো বই যোগ করা হয়নি।</p>`;
                return;
            }

            bookGrid.innerHTML = books.map(book => {
                // দাম নাল (null) হলে যেন সুন্দরভাবে দেখায়
                const currentPrice = book.discount_price || book.original_price || 'N/A';
                const hasDiscount = book.original_price && book.discount_price && book.original_price > book.discount_price;

                return `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-xl transition duration-300 overflow-hidden flex flex-col border border-gray-100 relative group">
                    
                    ${hasDiscount ? 
                        `<div class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded shadow z-10">ডিসকাউন্ট</div>` : ''}

                    <div class="overflow-hidden h-64 bg-gray-100">
                        <img src="${book.cover_url || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    </div>
                    
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="font-bold text-lg text-gray-800 leading-tight mb-1 line-clamp-2">${book.title}</h3>
                        <p class="text-sm text-gray-500 mb-3">লেখক: ${book.author}</p>
                        
                        <div class="flex items-end gap-2 mb-4 mt-auto">
                            <span class="text-2xl font-bold text-blue-600">৳ ${currentPrice}</span>
                            ${hasDiscount ? `<span class="text-gray-400 line-through text-sm mb-1">৳ ${book.original_price}</span>` : ''}
                        </div>

                        ${book.payment_info ? `<div class="bg-gray-50 p-2 rounded text-xs text-gray-600 mb-4 border border-gray-200">💳 পেমেন্ট: ${book.payment_info}</div>` : ''}

                        <!-- বাই বাটন (এখানে লগইন চেক হবে) -->
                        <button onclick="handleBuy('${book.purchase_link}')" class="w-full block text-center ${book.is_affiliate ? 'bg-purple-600 hover:bg-purple-700' : 'bg-green-600 hover:bg-green-700'} text-white font-bold py-2 rounded-lg transition">
                            ${book.is_affiliate ? 'অন্য সাইট থেকে কিনুন' : 'এখনই কিনুন'}
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        // ৩. কেনার সময় লগইন চেক
        window.handleBuy = (link) => {
            if (!currentUser) {
                // লগইন না থাকলে অ্যালার্ট দিয়ে লগইন পেজে পাঠাবে
                alert('বইটি কিনতে অনুগ্রহ করে প্রথমে লগইন করুন!');
                window.location.href = '/login.html';
                return;
            }
            
            // লগইন থাকলে লিংকে পাঠাবে
            if(link) {
                window.open(link, '_blank');
            } else {
                alert('এই বইয়ের জন্য কোনো পেমেন্ট লিংক দেওয়া নেই।');
            }
        }

        // ৪. লগআউট
        window.handleLogout = async () => {
            await supabaseClient.auth.signOut();
            checkAuth(); // নেভবার আপডেট
            alert('সফলভাবে লগআউট হয়েছেন।');
        }

        // শুরুতে রান হবে
        checkAuth();
        loadBooks();
    </script>
</body>
</html>
