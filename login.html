<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-blue-600">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">স্বাগতম!</h2>
            <p class="text-gray-500 mt-2">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ইমেইল</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">পাসওয়ার্ড</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition">
                লগইন
            </button>
        </form>

        <div id="message" class="text-center text-sm mt-4 hidden font-semibold"></div>

        <p class="text-center text-gray-600 mt-6 text-sm">
            অ্যাকাউন্ট নেই? <a href="/signup.html" class="text-blue-600 font-bold hover:underline">সাইন আপ করুন</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            loginBtn.innerText = 'অপেক্ষা করুন...';
            loginBtn.disabled = true;
            messageDiv.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // ১. প্রথমে Supabase Auth দিয়ে লগইন করা
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    throw new Error(error.message === 'Invalid login credentials' ? 'ভুল ইমেইল বা পাসওয়ার্ড!' : error.message);
                }

                // ২. লগইন সফল হলে, চেক করা সে অ্যাডমিন কি না
                if (data.user) {
                    const { data: profile, error: profileError } = await supabaseClient
                        .from('profiles')
                        .select('role')
                        .eq('id', data.user.id)
                        .maybeSingle(); // maybeSingle ব্যবহার করা হয়েছে যাতে এরর না আসে

                    if (profileError) throw new Error("প্রোফাইল চেক করতে সমস্যা হয়েছে!");

                    // ৩. যদি ইউজার অ্যাডমিন হয়
                    if (profile && profile.role === 'admin') {
                        await supabaseClient.auth.signOut(); // সাথে সাথে লগআউট করে দাও
                        
                        messageDiv.classList.remove('hidden', 'text-green-600');
                        messageDiv.classList.add('text-red-600');
                        messageDiv.innerText = '❌ আপনি একজন অ্যাডমিন! দয়া করে অ্যাডমিন পোর্টাল দিয়ে লগইন করুন।';
                    } 
                    // ৪. যদি সাধারণ ইউজার হয়
                    else {
                        messageDiv.classList.remove('hidden', 'text-red-600');
                        messageDiv.classList.add('text-green-600');
                        messageDiv.innerText = '✅ সফলভাবে লগইন হয়েছে! হোম পেজে যাচ্ছেন...';
                        
                        setTimeout(() => {
                            window.location.href = '/index.html'; // হোম পেজে পাঠিয়ে দাও
                        }, 1000);
                    }
                }
            } catch (err) {
                messageDiv.classList.remove('hidden', 'text-green-600');
                messageDiv.classList.add('text-red-600');
                messageDiv.innerText = '⚠️ ' + err.message;
            } finally {
                loginBtn.innerText = 'লগইন';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
