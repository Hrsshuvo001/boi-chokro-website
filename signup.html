<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইনআপ - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white">নতুন অ্যাকাউন্ট</h2>
            <p class="text-sm text-gray-500 mt-1">বই কিনতে আজই রেজিস্ট্রেশন করুন</p>
        </div>

        <div id="errorMsg" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm font-semibold"></div>
        <div id="successMsg" class="hidden mb-4 p-3 bg-green-100 text-green-700 rounded-lg text-sm font-semibold text-center"></div>

        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">পুরো নাম</label>
                <input type="text" id="fullName" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">ইমেইল</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">মোবাইল নম্বর</label>
                <input type="text" id="phone" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">ঠিকানা</label>
                <textarea id="address" rows="2" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">প্রোফাইল ছবি (ঐচ্ছিক)</label>
                <input type="file" id="profileImage" accept="image/*" class="w-full px-3 py-1.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 text-sm">
            </div>
            
            <!-- পাসওয়ার্ড ফিল্ড উইথ মডার্ন শো/হাইড আইকন -->
            <div>
                <label class="block text-sm font-semibold mb-1">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                <div class="relative">
                    <input type="password" id="password" required minlength="6" class="w-full px-4 py-2 pr-10 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg transition shadow-md">সাইন আপ</button>
        </form>

        <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-4">
            আগে থেকেই অ্যাকাউন্ট আছে? <a href="/login.html" class="text-green-600 dark:text-green-400 font-bold hover:underline">লগইন করুন</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            submitBtn.innerText = 'অ্যাকাউন্ট তৈরি হচ্ছে...';
            submitBtn.disabled = true;

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value;
            const imageFile = document.getElementById('profileImage').files[0];

            // ১. সুপাবেস অথ সাইনআপ (ইমেইল কনফার্মেশন সহ)
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { full_name: fullName }
                }
            });

            if (authError) {
                errorDiv.innerText = 'সাইনআপ সমস্যা: ' + authError.message;
                errorDiv.classList.remove('hidden');
                submitBtn.innerText = 'সাইন আপ';
                submitBtn.disabled = false;
                return;
            }

            const userId = authData.user?.id;
            let profileImageUrl = '';

            if (imageFile && userId) {
                const fileName = `profile_${userId}_${Date.now()}.${imageFile.name.split('.').pop()}`;
                const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, imageFile);
                if (!uploadError) {
                    const { data: pubData } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                    profileImageUrl = pubData.publicUrl;
                }
            }

            if (userId) {
                await supabaseClient.from('profiles').upsert([{
                    id: userId,
                    full_name: fullName,
                    email: email,
                    phone: phone,
                    address: address,
                    profile_image: profileImageUrl
                }]);
            }

            successDiv.innerText = '✅ সফলভাবে সাইনআপ হয়েছে! অনুগ্রহ করে আপনার ইমেইল ইনবক্স চেক করে অ্যাকাউন্ট ভেরিফাই করুন।';
            successDiv.classList.remove('hidden');
            submitBtn.innerText = 'সাইন আপ সম্পন্ন';
        });
    </script>
</body>
</html>
