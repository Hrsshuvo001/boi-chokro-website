<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইন আপ - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-green-500">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">নতুন অ্যাকাউন্ট</h2>
            <p class="text-gray-500 mt-2">বই কিনতে আজই রেজিস্ট্রেশন করুন</p>
        </div>
        
        <form id="signupForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ইমেইল</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                <input type="password" id="password" required minlength="6" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            
            <button type="submit" id="signupBtn" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg hover:bg-green-700 transition">
                সাইন আপ
            </button>
        </form>

        <div id="message" class="text-center text-sm mt-4 hidden font-semibold"></div>

        <p class="text-center text-gray-600 mt-6 text-sm">
            আগে থেকেই অ্যাকাউন্ট আছে? <a href="/login.html" class="text-green-600 font-bold hover:underline">লগইন করুন</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const signupForm = document.getElementById('signupForm');
        const messageDiv = document.getElementById('message');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.innerText = 'অপেক্ষা করুন...';
            btn.disabled = true;
            messageDiv.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signUp({ email, password });

            if (error) {
                messageDiv.classList.remove('hidden', 'text-green-600');
                messageDiv.classList.add('text-red-600');
                messageDiv.innerText = '⚠️ ' + error.message;
                btn.innerText = 'সাইন আপ';
                btn.disabled = false;
            } else {
                messageDiv.classList.remove('hidden', 'text-red-600');
                messageDiv.classList.add('text-green-600');
                
                // Supabase-এ Email Confirmation চালু থাকলে ইউজারকে ইমেইল চেক করতে বলবে
                if (data.user && data.session === null) {
                    messageDiv.innerHTML = '✅ রেজিস্ট্রেশন সফল! অনুগ্রহ করে আপনার ইমেইলে পাঠানো লিংকে ক্লিক করে অ্যাকাউন্ট ভেরিফাই করুন।';
                } else {
                    messageDiv.innerText = '✅ সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে! লগইন পেজে যাচ্ছেন...';
                    setTimeout(() => window.location.href = '/login.html', 1500);
                }
                signupForm.reset();
            }
            btn.innerText = 'সাইন আপ';
            btn.disabled = false;
        });
    </script>
</body>
</html>
