<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইন আপ - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 py-10">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-green-500">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">নতুন অ্যাকাউন্ট</h2>
            <p class="text-gray-500 mt-2">বই কিনতে আজই রেজিস্ট্রেশন করুন</p>
        </div>
        
        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">পুরো নাম</label>
                <input type="text" id="fullName" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="আপনার নাম">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ইমেইল</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="example@mail.com">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">মোবাইল নম্বর</label>
                <input type="text" id="phone" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="017XXXXXXXX">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ঠিকানা</label>
                <textarea id="address" rows="2" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="আপনার ঠিকানা"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">প্রোফাইল ছবি (ঐচ্ছিক)</label>
                <input type="file" id="profileImage" accept="image/*" class="w-full px-4 py-2 border rounded-lg bg-gray-50 text-sm">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                <input type="password" id="password" required minlength="6" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            
            <button type="submit" id="signupBtn" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg hover:bg-green-700 transition mt-4">
                সাইন আপ
            </button>
        </form>

        <div id="message" class="text-center text-sm mt-4 hidden font-semibold"></div>

        <p class="text-center text-gray-600 mt-6 text-sm">
            আগে থেকেই অ্যাকাউন্ট আছে? <a href="/login.html" class="text-green-600 font-bold hover:underline">লগইন করুন</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const signupForm = document.getElementById('signupForm');
        const messageDiv = document.getElementById('message');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.innerText = 'অপেক্ষা করুন...'; btn.disabled = true;
            messageDiv.classList.add('hidden');

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const password = document.getElementById('password').value;
            const imageFile = document.getElementById('profileImage').files[0];

            try {
                // ১. Auth-এ ইউজার তৈরি
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({ email, password });
                if (authError) throw new Error(authError.message);

                if (authData.user) {
                    let image_url = null;

                    // ২. ছবি আপলোড
                    if (imageFile) {
                        const fileName = `user_${authData.user.id}_${Date.now()}.${imageFile.name.split('.').pop()}`;
                        await supabaseClient.storage.from('book-covers').upload(fileName, imageFile);
                        const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                        image_url = data.publicUrl;
                    }

                    // ৩. profiles টেবিলে ডেটা সেভ
                    const { error: profileError } = await supabaseClient.from('profiles').upsert([{
                        id: authData.user.id,
                        full_name: fullName,
                        phone: phone,
                        address: address,
                        profile_image: image_url,
                        role: 'customer'
                    }]);

                    if (profileError) throw new Error("প্রোফাইল সেভে সমস্যা: " + profileError.message);

                    messageDiv.classList.remove('hidden', 'text-red-600');
                    messageDiv.classList.add('text-green-600');
                    messageDiv.innerText = '✅ সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে! এখন লগইন করুন।';
                    signupForm.reset();
                    
                    setTimeout(() => { window.location.href = '/login.html'; }, 2000);
                }
            } catch (err) {
                messageDiv.classList.remove('hidden', 'text-green-600');
                messageDiv.classList.add('text-red-600');
                messageDiv.innerText = '⚠️ ' + err.message;
            } finally {
                btn.innerText = 'সাইন আপ';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
