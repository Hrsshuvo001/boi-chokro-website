<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড ভুলে গেছেন? - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">পাসওয়ার্ড রিসেট করুন</h2>
        <p class="text-sm text-gray-500 text-center mb-6">আপনার ইমেইল দিন, আমরা একটি রিসেট লিংক পাঠাবো।</p>
        
        <form id="resetForm" class="space-y-4">
            <input type="email" id="email" required placeholder="আপনার ইমেইল" class="w-full px-4 py-2 border rounded-lg">
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700">লিংক পাঠান</button>
        </form>
        <div id="msg" class="text-center text-sm mt-4 hidden"></div>
        <div class="text-center mt-4">
            <a href="/login.html" class="text-blue-600 text-sm hover:underline">লগইনে ফিরে যান</a>
        </div>
    </div>

    <script>
        const supabase = supabase.createClient('https://jhbpaezbpkfwjfmazdcn.supabase.co', 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g');
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            btn.innerText = 'পাঠানো হচ্ছে...'; btn.disabled = true;

            const email = document.getElementById('email').value;
            // এখানে redirectTo তে আপনার update-password.html পেজের লিংক দিতে হবে
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/update-password.html',
            });

            if (error) {
                msg.innerText = '⚠️ ' + error.message;
                msg.className = 'text-center text-sm mt-4 text-red-600 block';
            } else {
                msg.innerText = '✅ আপনার ইমেইলে একটি রিসেট লিংক পাঠানো হয়েছে।';
                msg.className = 'text-center text-sm mt-4 text-green-600 block';
            }
            btn.innerText = 'লিংক পাঠান'; btn.disabled = false;
        });
    </script>
</body>
</html>
