<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ব্লগ - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="flex items-center gap-2">
                <span class="text-2xl font-extrabold text-blue-600 tracking-tight">Boi Chokro</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/index.html" class="text-sm font-semibold text-gray-600 hover:text-blue-600 transition">হোম</a>
                <div id="authButtons"></div>
            </div>
        </div>
    </nav>

    <!-- হিরো সেকশন -->
    <header class="bg-blue-600 text-white py-12 px-4 text-center">
        <h1 class="text-3xl md:text-4xl font-bold mb-2">বই চক্র ব্লগ</h1>
        <p class="text-blue-100 max-w-2xl mx-auto">বই, লেখক এবং সাহিত্য নিয়ে আপনার মনের ভাবনা সবার সাথে শেয়ার করুন।</p>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- বাম দিক: ব্লগ লিস্ট -->
        <div class="md:col-span-2 space-y-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">সাম্প্রতিক ব্লগসমূহ</h2>
            <div id="blogList" class="space-y-6">
                <p class="text-gray-500">ব্লগ লোড হচ্ছে...</p>
            </div>
        </div>

        <!-- ডান দিক: নতুন ব্লগ লেখার ফর্ম -->
        <div class="md:col-span-1">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-24">
                <h3 class="text-xl font-bold text-gray-800 mb-4">নতুন ব্লগ লিখুন</h3>
                <p class="text-xs text-gray-500 mb-4">* আপনার ব্লগটি অ্যাডমিন অ্যাপ্রুভ করার পর ওয়েবসাইটে প্রকাশিত হবে।</p>
                
                <form id="blogForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">ব্লগের শিরোনাম</label>
                        <input type="text" id="blogTitle" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">আপনার লেখা</label>
                        <textarea id="blogContent" required rows="6" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50"></textarea>
                    </div>
                    <button type="submit" id="submitBlogBtn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition shadow-md">
                        সাবমিট করুন
                    </button>
                </form>
                <div id="blogMessage" class="mt-3 text-sm text-center font-bold hidden"></div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-auto">
        <p class="text-sm">&copy; 2024 Boi Chokro. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtons = document.getElementById('authButtons');
            
            if (session) {
                currentUser = session.user;
                authButtons.innerHTML = `<a href="/profile.html" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200">প্রোফাইল</a>`;
            } else {
                currentUser = null;
                authButtons.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">লগইন</a>`;
            }
        }

        // ব্লগ লিস্ট লোড করা
        async function loadBlogs() {
            const list = document.getElementById('blogList');
            
            // শুধুমাত্র approved ব্লগগুলো আনব, এবং লেখকের নামসহ (profiles টেবিল থেকে)
            const { data: blogs, error } = await supabaseClient
                .from('blogs')
                .select(`
                    *,
                    profiles ( full_name, email )
                `)
                .eq('status', 'approved')
                .order('created_at', { ascending: false });

            if (error || !blogs || blogs.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-10">এখনো কোনো ব্লগ প্রকাশিত হয়নি।</p>`;
                return;
            }

            list.innerHTML = blogs.map(blog => {
                const authorName = blog.profiles?.full_name || blog.profiles?.email?.split('@')[0] || 'অজানা লেখক';
                const date = new Date(blog.created_at).toLocaleDateString('bn-BD');
                
                return `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">${blog.title}</h3>
                    <div class="flex items-center gap-3 text-sm text-gray-500 mb-4 border-b pb-3">
                        <span class="flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg> ${authorName}</span>
                        <span class="flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg> ${date}</span>
                    </div>
                    <p class="text-gray-600 line-clamp-3">${blog.content}</p>
                </div>
                `;
            }).join('');
        }

        // নতুন ব্লগ সাবমিট করা
        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                alert('ব্লগ লিখতে অনুগ্রহ করে প্রথমে লগইন করুন!');
                window.location.href = '/login.html';
                return;
            }

            const btn = document.getElementById('submitBlogBtn');
            const msg = document.getElementById('blogMessage');
            btn.innerText = 'সাবমিট হচ্ছে...'; btn.disabled = true;
            msg.classList.add('hidden');

            const newBlog = {
                author_id: currentUser.id,
                title: document.getElementById('blogTitle').value,
                content: document.getElementById('blogContent').value,
                status: 'pending' // ডিফল্টভাবে পেন্ডিং থাকবে
            };

            const { error } = await supabaseClient.from('blogs').insert([newBlog]);

            if (error) {
                msg.innerText = '⚠️ সমস্যা হয়েছে: ' + error.message;
                msg.className = 'mt-3 text-sm text-center font-bold text-red-600 block';
            } else {
                msg.innerText = '✅ আপনার ব্লগটি সফলভাবে জমা হয়েছে। অ্যাডমিন অ্যাপ্রুভ করলে এটি প্রকাশিত হবে।';
                msg.className = 'mt-3 text-sm text-center font-bold text-green-600 block';
                document.getElementById('blogForm').reset();
            }
            btn.innerText = 'সাবমিট করুন'; btn.disabled = false;
        });

        checkAuth();
        loadBlogs();
    </script>
</body>
</html>
