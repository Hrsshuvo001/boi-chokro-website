<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নতুন পাসওয়ার্ড দিন - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">নতুন পাসওয়ার্ড সেট করুন</h2>
        
        <form id="updateForm" class="space-y-4">
            <input type="password" id="password" required minlength="6" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" class="w-full px-4 py-2 border rounded-lg">
            <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700">পাসওয়ার্ড আপডেট করুন</button>
        </form>
        <div id="msg" class="text-center text-sm mt-4 hidden"></div>
    </div>

    <script>
        const supabase = supabase.createClient('https://jhbpaezbpkfwjfmazdcn.supabase.co', 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g');
        
        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            btn.innerText = 'আপডেট হচ্ছে...'; btn.disabled = true;

            const newPassword = document.getElementById('password').value;
            const { error } = await supabase.auth.updateUser({ password: newPassword });

            if (error) {
                msg.innerText = '⚠️ ' + error.message;
                msg.className = 'text-center text-sm mt-4 text-red-600 block';
            } else {
                msg.innerText = '✅ পাসওয়ার্ড সফলভাবে আপডেট হয়েছে! লগইন পেজে নিয়ে যাচ্ছি...';
                msg.className = 'text-center text-sm mt-4 text-green-600 block';
                setTimeout(() => window.location.href = '/login.html', 2000);
            }
            btn.innerText = 'পাসওয়ার্ড আপডেট করুন'; btn.disabled = false;
        });
    </script>
</body>
</html>
