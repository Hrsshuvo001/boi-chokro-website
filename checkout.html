<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চেকআউট - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">চেকআউট</h2>
        
        <form id="checkoutForm" class="space-y-6">
            <!-- ডেলিভারি তথ্য -->
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-3">ডেলিভারি তথ্য</h3>
                <div class="space-y-3">
                    <input type="text" placeholder="আপনার নাম" required class="w-full px-4 py-2 border rounded-md">
                    <input type="text" placeholder="মোবাইল নম্বর" required class="w-full px-4 py-2 border rounded-md">
                    <textarea placeholder="সম্পূর্ণ ঠিকানা" required rows="2" class="w-full px-4 py-2 border rounded-md"></textarea>
                </div>
            </div>

            <!-- পেমেন্ট মেথড -->
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-3">পেমেন্ট মেথড সিলেক্ট করুন</h3>
                <div class="space-y-2 border p-4 rounded-md bg-gray-50">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" name="payment" value="bkash" checked class="w-4 h-4 text-blue-600">
                        <span class="font-bold text-pink-600">বিকাশ (bKash)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" name="payment" value="nagad" class="w-4 h-4 text-blue-600">
                        <span class="font-bold text-orange-500">নগদ (Nagad)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" name="payment" value="sslcommerz" class="w-4 h-4 text-blue-600">
                        <span class="font-bold text-blue-600">কার্ড / SSLCommerz</span>
                    </label>
                </div>
            </div>

            <button type="submit" id="payBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition text-lg">
                পেমেন্ট করুন
            </button>
        </form>
        <p class="text-xs text-gray-500 mt-4 text-center">* এটি একটি ডেমো চেকআউট। আসল পেমেন্টের জন্য SSLCommerz API ব্যাকএন্ডে যুক্ত করতে হবে।</p>
    </div>

    <script>
        document.getElementById('checkoutForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            btn.innerText = 'প্রসেস হচ্ছে...';
            btn.disabled = true;

            // এখানে ব্যাকএন্ড API-তে কল করা হবে। 
            // আপাতত আমরা একটি অ্যালার্ট দেখিয়ে কার্ট খালি করব।
            setTimeout(() => {
                alert('ডেমো পেমেন্ট সফল হয়েছে! (ব্যাকএন্ড ইন্টিগ্রেশন প্রয়োজন)');
                localStorage.removeItem('boiChokroCart'); // কার্ট খালি করা
                window.location.href = '/index.html';
            }, 1500);
        });
    </script>
</body>
</html>
