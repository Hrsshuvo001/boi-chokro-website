<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-slate-800 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Boi Chokro - Admin</h1>
        <button id="logoutBtn" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">লগআউট</button>
    </nav>

    <div class="max-w-7xl mx-auto mt-8 p-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 flex flex-col gap-6">
            
            <!-- ক্যাটাগরি ও লেখক যোগ করার ফর্ম -->
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-purple-500">
                <h2 class="text-lg font-bold mb-4 text-gray-800">ক্যাটাগরি যোগ করুন</h2>
                <form id="addCategoryForm" class="flex gap-2 mb-4">
                    <input type="text" id="categoryName" required placeholder="নতুন ক্যাটাগরি" class="w-full px-3 py-2 border rounded-md text-sm">
                    <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 text-sm">যোগ</button>
                </form>

                <h2 class="text-lg font-bold mb-4 text-gray-800 border-t pt-4">লেখক যোগ করুন</h2>
                <form id="addAuthorForm" class="space-y-3">
                    <input type="text" id="authorName" required placeholder="লেখকের নাম" class="w-full px-3 py-2 border rounded-md text-sm">
                    <textarea id="authorBio" placeholder="লেখক পরিচিতি (Bio)" rows="2" class="w-full px-3 py-2 border rounded-md text-sm"></textarea>
                    <input type="file" id="authorImage" accept="image/*" class="w-full px-3 py-2 border rounded-md text-sm bg-gray-50">
                    <button type="submit" id="addAuthBtn" class="w-full bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-sm">লেখক যোগ করুন</button>
                </form>
            </div>

            <!-- নতুন বই যোগ করার ফর্ম -->
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
                <h2 class="text-xl font-bold mb-4 text-gray-800">নতুন বই যোগ করুন</h2>
                <form id="addBookForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">বইয়ের নাম *</label>
                        <input type="text" id="title" required class="mt-1 w-full px-3 py-2 border rounded-md">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">লেখকের নাম *</label>
                        <select id="author" required class="mt-1 w-full px-3 py-2 border rounded-md bg-white">
                            <option value="" disabled selected>লেখক লোড হচ্ছে...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">বইয়ের ক্যাটাগরি *</label>
                        <select id="category" required class="mt-1 w-full px-3 py-2 border rounded-md bg-white">
                            <option value="" disabled selected>ক্যাটাগরি লোড হচ্ছে...</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">আসল দাম (৳)</label>
                            <input type="number" id="original_price" class="mt-1 w-full px-3 py-2 border rounded-md">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">ডিসকাউন্ট দাম (৳) *</label>
                            <input type="number" id="discount_price" required class="mt-1 w-full px-3 py-2 border rounded-md">
                        </div>
                    </div>

                    <div class="p-4 bg-blue-50 border border-blue-200 rounded-md">
                        <label class="block text-sm font-bold text-blue-800 mb-2">বিক্রয়ের ধরন</label>
                        <div class="flex flex-col gap-2 mb-3">
                            <label class="flex items-center space-x-2 text-sm text-blue-900 cursor-pointer">
                                <input type="radio" name="link_type" id="type_affiliate" value="affiliate" checked onchange="toggleLinkType()">
                                <span>অ্যাফিলিয়েট লিংক</span>
                            </label>
                            <label class="flex items-center space-x-2 text-sm text-blue-900 cursor-pointer">
                                <input type="radio" name="link_type" id="type_payment" value="payment" onchange="toggleLinkType()">
                                <span>নিজের সাইটে বিক্রি (কার্ট)</span>
                            </label>
                        </div>
                        <input type="url" id="purchase_link" placeholder="https://..." class="w-full px-3 py-2 border rounded-md mb-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">বইয়ের বিবরণ</label>
                        <textarea id="description" rows="2" class="mt-1 w-full px-3 py-2 border rounded-md"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">বইয়ের ছবি</label>
                        <input type="file" id="cover_files" accept="image/*" multiple required class="mt-1 w-full px-3 py-2 border rounded-md bg-gray-50 text-sm">
                    </div>
                    
                    <button type="submit" id="addBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">বই যোগ করুন</button>
                </form>
                <div id="message" class="mt-3 text-sm text-center hidden font-bold"></div>
            </div>
        </div>

        <!-- লিস্ট -->
        <div class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-gray-800">সব বই</h2>
            <div id="bookList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const bookListDiv = document.getElementById('bookList');
        const categorySelect = document.getElementById('category');
        const authorSelect = document.getElementById('author');

        async function loadDropdowns() {
            const { data: cats } = await supabaseClient.from('categories').select('*').order('name');
            categorySelect.innerHTML = '<option value="" disabled selected>ক্যাটাগরি সিলেক্ট করুন</option>';
            if (cats) cats.forEach(c => categorySelect.innerHTML += `<option value="${c.name}">${c.name}</option>`);

            const { data: auths } = await supabaseClient.from('authors').select('*').order('name');
            authorSelect.innerHTML = '<option value="" disabled selected>লেখক সিলেক্ট করুন</option>';
            if (auths) auths.forEach(a => authorSelect.innerHTML += `<option value="${a.name}">${a.name}</option>`);
        }

        document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const catName = document.getElementById('categoryName').value.trim();
            const { error } = await supabaseClient.from('categories').insert([{ name: catName }]);
            if (!error) {
                document.getElementById('categoryName').value = '';
                loadDropdowns();
            }
        });

        document.getElementById('addAuthorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('addAuthBtn');
            btn.innerText = 'অপেক্ষা করুন...'; btn.disabled = true;

            const name = document.getElementById('authorName').value.trim();
            const bio = document.getElementById('authorBio').value.trim();
            const imageFile = document.getElementById('authorImage').files[0];
            let image_url = '';

            try {
                if (imageFile) {
                    const fileName = `author_${Date.now()}.${imageFile.name.split('.').pop()}`;
                    const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, imageFile);
                    if (!uploadError) {
                        const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                        image_url = data.publicUrl;
                    }
                }

                const { error } = await supabaseClient.from('authors').insert([{ name, bio, image_url }]);
                if (error) throw error;

                document.getElementById('authorName').value = '';
                document.getElementById('authorBio').value = '';
                document.getElementById('authorImage').value = '';
                alert('লেখক সফলভাবে যোগ হয়েছে!');
                loadDropdowns();
            } catch (err) {
                alert('লেখক যোগ করা যায়নি বা আগেই আছে!');
            } finally {
                btn.innerText = 'লেখক যোগ করুন'; btn.disabled = false;
            }
        });

        window.toggleLinkType = () => {
            const isAffiliate = document.getElementById('type_affiliate').checked;
            const input = document.getElementById('purchase_link');
            if (isAffiliate) { input.required = true; input.placeholder = "https://..."; }
            else { input.required = false; input.placeholder = "কার্টের জন্য লিংক প্রয়োজন নেই"; input.value = ""; }
        };

        async function initDashboard() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = '/admin-login.html';
            else { loadDropdowns(); loadBooks(); }
        }

        async function loadBooks() {
            const { data: books, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
            if (error || books.length === 0) return bookListDiv.innerHTML = `<p class="text-gray-500">কোনো বই নেই।</p>`;

            bookListDiv.innerHTML = books.map(book => `
                <div class="bg-white p-4 rounded-lg shadow relative flex flex-col justify-between">
                    <div>
                        <span class="absolute top-2 right-2 bg-blue-500 text-white text-xs font-bold px-2 py-1 rounded">${book.category}</span>
                        <img src="${book.cover_url || 'https://via.placeholder.com/150'}" class="w-full h-40 object-cover rounded mb-3 mt-4">
                        <h3 class="font-bold text-lg leading-tight">${book.title}</h3>
                        <p class="text-sm text-gray-600 mb-2">${book.author}</p>
                        <span class="text-green-600 font-bold text-lg">৳ ${book.discount_price || book.original_price || 0}</span>
                    </div>
                    <button onclick="deleteBook('${book.id}')" class="mt-4 w-full bg-red-50 text-red-600 py-1 rounded text-sm hover:bg-red-100 border border-red-200">ডিলিট</button>
                </div>
            `).join('');
        }

        document.getElementById('addBookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            const msgDiv = document.getElementById('message');
            
            // === নতুন ভ্যালিডেশন ===
            const origPrice = parseFloat(document.getElementById('original_price').value);
            const discPrice = parseFloat(document.getElementById('discount_price').value);

            if (origPrice && discPrice && discPrice > origPrice) {
                msgDiv.innerText = '⚠️ ডিসকাউন্ট দাম আসল দামের চেয়ে বেশি হতে পারে না!';
                msgDiv.className = 'mt-3 text-sm text-center text-red-600 block font-bold';
                return; // ফর্ম সাবমিট বন্ধ করে দেবে
            }
            // =====================

            btn.innerText = 'প্রসেস হচ্ছে...'; btn.disabled = true;
            msgDiv.classList.add('hidden');

            try {
                const files = document.getElementById('cover_files').files;
                let uploadedUrls = [];

                if (files.length > 0) {
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const fileName = `book_${Date.now()}_${i}.${file.name.split('.').pop()}`;
                        await supabaseClient.storage.from('book-covers').upload(fileName, file);
                        const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                        uploadedUrls.push(data.publicUrl);
                    }
                }

                const isAffiliate = document.getElementById('type_affiliate').checked;

                const newBook = {
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value,
                    category: document.getElementById('category').value,
                    original_price: origPrice || null,
                    discount_price: discPrice,
                    purchase_link: document.getElementById('purchase_link').value || null,
                    is_affiliate: isAffiliate,
                    description: document.getElementById('description').value,
                    cover_url: uploadedUrls[0] || '',
                    gallery_images: uploadedUrls,
                    sales_count: 0 
                };

                const { error } = await supabaseClient.from('books').insert([newBook]);
                if (error) throw error;

                msgDiv.innerText = 'সফলভাবে বই যোগ হয়েছে!';
                msgDiv.className = 'mt-3 text-sm text-center text-green-600 block font-bold';
                document.getElementById('addBookForm').reset(); toggleLinkType(); loadBooks();

            } catch (error) {
                msgDiv.innerText = '⚠️ ' + error.message;
                msgDiv.className = 'mt-3 text-sm text-center text-red-600 block font-bold';
            } finally {
                btn.innerText = 'বই যোগ করুন'; btn.disabled = false;
            }
        });

        window.deleteBook = async (id) => {
            if(!confirm("বইটি ডিলিট করবেন?")) return;
            await supabaseClient.from('books').delete().eq('id', id);
            loadBooks();
        };

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut(); window.location.href = '/admin-login.html';
        });

        initDashboard();
    </script>
</body>
</html>
