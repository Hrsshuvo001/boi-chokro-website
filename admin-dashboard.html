<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | বই চক্র</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Top Navbar -->
    <nav class="bg-white shadow-sm mb-6">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">বই চক্র - অ্যাডমিন প্যানেল</h1>
            <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-600 transition">লগআউট</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 pb-12">
        <!-- Success/Error Message -->
        <div id="msgBox" class="hidden p-3 mb-6 rounded-lg text-center font-semibold"></div>

        <!-- Add Book Form -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">📚 নতুন বই যোগ করুন</h2>
            <form id="addBookForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">বইয়ের নাম</label>
                        <input type="text" id="bookTitle" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">লেখকের নাম</label>
                        <input type="text" id="bookAuthor" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">দাম (যেমন: ৳ ৩৫০)</label>
                        <input type="text" id="bookPrice" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">বইয়ের ছবির লিংক (Image URL)</label>
                        <input type="url" id="bookImage" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">রকমারি অ্যাফিলিয়েট লিংক</label>
                    <input type="url" id="bookLink" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">বই সেভ করুন</button>
            </form>
        </div>

        <!-- Add Blog Form -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">✍️ নতুন ব্লগ পোস্ট করুন</h2>
            <form id="addBlogForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">ব্লগের শিরোনাম</label>
                    <input type="text" id="blogTitle" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ব্লগের ছবির লিংক (ঐচ্ছিক)</label>
                    <input type="url" id="blogImage" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ব্লগের মূল লেখা</label>
                    <textarea id="blogContent" rows="4" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 transition">ব্লগ পাবলিশ করুন</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⚠️ এখানে আপনার Supabase URL এবং Key বসান
        const SUPABASE_URL = 'এখানে_আপনার_Project_URL_বসান';
        const SUPABASE_ANON_KEY = 'এখানে_আপনার_anon_public_key_বসান';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const msgBox = document.getElementById('msgBox');

        // ১. পেজ লোড হলে চেক করা সে লগইন আছে কি না
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/admin.html'; // লগইন না থাকলে লগইন পেজে পাঠাবে
            }
        }
        checkAuth();

        // ২. লগআউট ফাংশন
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = '/admin.html';
        });

        // ৩. মেসেজ দেখানোর ফাংশন
        function showMessage(text, type) {
            msgBox.innerText = text;
            msgBox.className = `p-3 mb-6 rounded-lg text-center font-semibold ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            msgBox.classList.remove('hidden');
            setTimeout(() => msgBox.classList.add('hidden'), 4000);
        }

        // ৪. নতুন বই অ্যাড করা
        document.getElementById('addBookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('bookTitle').value;
            const author = document.getElementById('bookAuthor').value;
            const price = document.getElementById('bookPrice').value;
            const image = document.getElementById('bookImage').value;
            const link = document.getElementById('bookLink').value;

            const { error } = await supabase.from('books').insert([
                { title: title, author: author, price: price, cover_image_url: image, affiliate_link: link }
            ]);

            if (error) {
                showMessage("বই সেভ করা যায়নি: " + error.message, 'error');
            } else {
                showMessage("বইটি সফলভাবে সেভ হয়েছে!", 'success');
                document.getElementById('addBookForm').reset();
            }
        });

        // ৫. নতুন ব্লগ অ্যাড করা
        document.getElementById('addBlogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('blogTitle').value;
            const image = document.getElementById('blogImage').value;
            const content = document.getElementById('blogContent').value;
            
            // অ্যাডমিন নিজে লিখলে সরাসরি 'approved' স্ট্যাটাসে যাবে
            const { data: { user } } = await supabase.auth.getUser();

            const { error } = await supabase.from('blogs').insert([
                { title: title, content: content, cover_image_url: image, status: 'approved', author_id: user.id }
            ]);

            if (error) {
                showMessage("ব্লগ পাবলিশ করা যায়নি: " + error.message, 'error');
            } else {
                showMessage("ব্লগটি সফলভাবে পাবলিশ হয়েছে!", 'success');
                document.getElementById('addBlogForm').reset();
            }
        });
    </script>
</body>
</html>
