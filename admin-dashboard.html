<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-slate-800 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Boi Chokro - Admin</h1>
        <button id="logoutBtn" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">লগআউট</button>
    </nav>

    <div class="max-w-7xl mx-auto mt-8 p-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- ফর্ম -->
        <div class="bg-white p-6 rounded-lg shadow-md lg:col-span-1 h-fit">
            <h2 class="text-xl font-bold mb-4 text-gray-800">নতুন বই যোগ করুন</h2>
            <form id="addBookForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">বইয়ের নাম *</label>
                    <input type="text" id="title" required class="mt-1 w-full px-3 py-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">লেখকের নাম *</label>
                    <input type="text" id="author" required class="mt-1 w-full px-3 py-2 border rounded-md">
                </div>
                
                <!-- ডিসকাউন্ট অপশন -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">আসল দাম (৳)</label>
                        <input type="number" id="original_price" class="mt-1 w-full px-3 py-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">ডিসকাউন্ট দাম (৳) *</label>
                        <input type="number" id="discount_price" required class="mt-1 w-full px-3 py-2 border rounded-md">
                    </div>
                </div>

                <!-- নতুন লিংক অপশন -->
                <div class="p-4 bg-blue-50 border border-blue-200 rounded-md">
                    <label class="block text-sm font-bold text-blue-800 mb-2">বিক্রয়ের ধরন (Link Type)</label>
                    
                    <!-- রেডিও বাটন -->
                    <div class="flex flex-col gap-2 mb-3">
                        <label class="flex items-center space-x-2 text-sm text-blue-900 cursor-pointer">
                            <input type="radio" name="link_type" id="type_affiliate" value="affiliate" checked onchange="toggleLinkType()">
                            <span>অ্যাফিলিয়েট লিংক (অন্য সাইট থেকে কিনবে)</span>
                        </label>
                        <label class="flex items-center space-x-2 text-sm text-blue-900 cursor-pointer">
                            <input type="radio" name="link_type" id="type_payment" value="payment" onchange="toggleLinkType()">
                            <span>পেমেন্ট গেটওয়ে (নিজের সাইটে পেমেন্ট)</span>
                        </label>
                    </div>

                    <input type="url" id="purchase_link" placeholder="https://..." class="w-full px-3 py-2 border rounded-md mb-2">
                    <p class="text-xs text-gray-600" id="link_hint">এখানে অ্যাফিলিয়েট লিংক দিন। কাস্টমার 'কিনুন' বাটনে চাপ দিলে নতুন ট্যাবে ওই লিংকে চলে যাবে।</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">বিকাশ/নগদ নাম্বার (পেমেন্টের জন্য)</label>
                    <input type="text" id="payment_info" placeholder="বিকাশ: 017xxxx, নগদ: 017xxxx" class="mt-1 w-full px-3 py-2 border rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">বইয়ের বিবরণ</label>
                    <textarea id="description" rows="2" class="mt-1 w-full px-3 py-2 border rounded-md"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">বইয়ের ছবি (একাধিক সিলেক্ট করতে পারবেন)</label>
                    <input type="file" id="cover_files" accept="image/*" multiple required class="mt-1 w-full px-3 py-2 border rounded-md bg-gray-50 text-sm">
                </div>
                
                <button type="submit" id="addBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">বই যোগ করুন</button>
            </form>
            <div id="message" class="mt-3 text-sm text-center hidden font-bold"></div>
        </div>

        <!-- লিস্ট -->
        <div class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-gray-800">সব বই</h2>
            <div id="bookList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- লোডিং -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const bookListDiv = document.getElementById('bookList');
        const addBookForm = document.getElementById('addBookForm');
        const messageDiv = document.getElementById('message');

        // লিংকের ধরন পরিবর্তন হলে হিন্ট টেক্সট পরিবর্তন হবে
        window.toggleLinkType = () => {
            const isAffiliate = document.getElementById('type_affiliate').checked;
            const input = document.getElementById('purchase_link');
            const hint = document.getElementById('link_hint');
            
            if (isAffiliate) {
                input.placeholder = "https://amazon.com/... (Affiliate Link)";
                hint.innerText = "এখানে অ্যাফিলিয়েট লিংক দিন। কাস্টমার 'কিনুন' বাটনে চাপ দিলে নতুন ট্যাবে ওই লিংকে চলে যাবে।";
            } else {
                input.placeholder = "https://your-payment-gateway.com/...";
                hint.innerText = "এখানে আপনার পেমেন্ট পেজের লিংক দিন (যেমন: SSLCommerz বা আপনার চেকআউট পেজ)। কাস্টমারকে সরাসরি ওই পেজে পাঠানো হবে।";
            }
        };

        async function initDashboard() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = '/admin-login.html';
            else loadBooks();
        }

        async function loadBooks() {
            const { data: books, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
            if (error) return bookListDiv.innerHTML = `<p class="text-red-500">বই লোড ব্যর্থ!</p>`;
            if (books.length === 0) return bookListDiv.innerHTML = `<p class="text-gray-500">কোনো বই নেই।</p>`;

            bookListDiv.innerHTML = books.map(book => `
                <div class="bg-white p-4 rounded-lg shadow relative flex flex-col justify-between">
                    <div>
                        ${book.original_price && book.original_price > book.discount_price ? 
                            `<span class="absolute top-2 right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">ডিসকাউন্ট!</span>` : ''}
                        
                        <img src="${book.cover_url || 'https://via.placeholder.com/150'}" class="w-full h-40 object-cover rounded mb-3">
                        <h3 class="font-bold text-lg leading-tight">${book.title}</h3>
                        <p class="text-sm text-gray-600 mb-2">${book.author}</p>
                        
                        <div class="flex items-center gap-2">
                            <span class="text-green-600 font-bold text-lg">৳ ${book.discount_price}</span>
                            ${book.original_price ? `<span class="text-gray-400 line-through text-sm">৳ ${book.original_price}</span>` : ''}
                        </div>
                        
                        ${book.payment_info ? `<p class="text-xs text-gray-500 mt-1">💳 ${book.payment_info}</p>` : ''}
                        ${book.is_affiliate ? `<span class="inline-block mt-2 bg-purple-100 text-purple-700 text-xs px-2 py-1 rounded">Affiliate Link</span>` : `<span class="inline-block mt-2 bg-green-100 text-green-700 text-xs px-2 py-1 rounded">Direct Payment</span>`}
                    </div>
                    <button onclick="deleteBook('${book.id}')" class="mt-4 w-full bg-red-50 text-red-600 py-1 rounded text-sm hover:bg-red-100 border border-red-200">ডিলিট করুন</button>
                </div>
            `).join('');
        }

        addBookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            btn.innerText = 'ছবি আপলোড হচ্ছে...';
            btn.disabled = true;

            try {
                const files = document.getElementById('cover_files').files;
                let uploadedUrls = [];

                if (files.length > 0) {
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const fileExt = file.name.split('.').pop();
                        const fileName = `${Date.now()}_${i}.${fileExt}`;
                        
                        const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, file);
                        if (uploadError) throw new Error("ছবি আপলোড ব্যর্থ: " + uploadError.message);

                        const { data: publicUrlData } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                        uploadedUrls.push(publicUrlData.publicUrl);
                    }
                }

                // রেডিও বাটন থেকে চেক করা হচ্ছে অ্যাফিলিয়েট নাকি পেমেন্ট
                const isAffiliate = document.getElementById('type_affiliate').checked;

                const newBook = {
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value,
                    original_price: parseFloat(document.getElementById('original_price').value) || null,
                    discount_price: parseFloat(document.getElementById('discount_price').value),
                    purchase_link: document.getElementById('purchase_link').value,
                    is_affiliate: isAffiliate,
                    payment_info: document.getElementById('payment_info').value,
                    description: document.getElementById('description').value,
                    cover_url: uploadedUrls[0] || '',
                    gallery_images: uploadedUrls
                };

                const { error: insertError } = await supabaseClient.from('books').insert([newBook]);
                if (insertError) throw insertError;

                messageDiv.className = 'mt-3 text-sm text-center text-green-600 block';
                messageDiv.innerText = 'সফলভাবে বই যোগ হয়েছে!';
                addBookForm.reset();
                toggleLinkType(); // রিসেট করার পর হিন্ট আবার আগের অবস্থায় আনবে
                loadBooks();

            } catch (error) {
                messageDiv.className = 'mt-3 text-sm text-center text-red-600 block';
                messageDiv.innerText = '⚠️ ' + error.message;
            } finally {
                btn.innerText = 'বই যোগ করুন';
                btn.disabled = false;
            }
        });

        window.deleteBook = async (id) => {
            if(!confirm("বইটি ডিলিট করবেন?")) return;
            await supabaseClient.from('books').delete().eq('id', id);
            loadBooks();
        };

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/admin-login.html';
        });

        initDashboard();
    </script>
</body>
</html>
