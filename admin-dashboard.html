<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .nav-item.active { background-color: #1e293b; color: white; border-left: 4px solid #3b82f6; }
        .section-content { display: none; }
        .section-content.active { display: block; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-animate { animation: slideInRight 0.3s ease-out forwards; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); }
    </style>
</head>
<body class="bg-gray-100 h-[100dvh] overflow-hidden flex flex-col md:flex-row">

    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <!-- সাইডবার -->
    <aside id="sidebar" class="fixed md:sticky top-0 left-0 z-40 h-[100dvh] w-64 bg-slate-800 text-slate-300 flex flex-col shadow-xl transition-transform duration-300 transform -translate-x-full md:translate-x-0 flex-shrink-0">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center flex-shrink-0">
            <div class="flex items-center gap-2">
                <img id="sidebar_logo" src="" class="hidden h-8 w-auto max-w-[40px] object-contain">
                <span id="sidebar-company-name" class="text-xl font-bold text-white">Boi Chokro</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-red-400 hover:text-red-300 bg-slate-700 px-2 py-1 rounded text-sm">✕</button>
        </div>
        
        <nav class="flex-grow flex flex-col p-2 overflow-y-auto">
            <div class="flex flex-col gap-1">
                <button onclick="showSection('home')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">📊 হোম (ড্যাশবোর্ড)</button>
                <button onclick="showSection('all-books')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">📚 সব বই</button>
                <button onclick="showSection('add-book')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">➕ অ্যাড নিউ বুক</button>
                <button onclick="showSection('confirm-booking')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">📦 অর্ডার ম্যানেজমেন্ট</button>
                <button onclick="showSection('add-meta')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">🏷️ ক্যাটাগরি/লেখক/প্রকাশনী</button>
                <button onclick="showSection('blog-management')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">📝 ব্লগ ম্যানেজমেন্ট</button>
                <button onclick="showSection('review-management')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">⭐ রিভিউ ম্যানেজমেন্ট</button>
                <button onclick="showSection('coupon-management')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">🎟️ কুপন ম্যানেজমেন্ট</button>
                <button id="menu-customers" onclick="showSection('customer-list')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full hidden">👥 কাস্টমার লিস্ট</button>
                <button id="menu-newsletter" onclick="showSection('newsletter-list')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full hidden">📧 নিউজলেটার লিস্ট</button>
                <button onclick="showSection('report')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">📄 রিপোর্ট</button>
                <a href="/admin-chat.html" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">💬 লাইভ চ্যাট</a>
                <button id="menu-employee" onclick="showSection('employee')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full hidden">⚙️ ইম্পলয়ি ম্যানেজমেন্ট</button>
                <button id="menu-logs" onclick="showSection('activity-logs')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full hidden">📋 কার্যক্রমের লগ</button>
                <button onclick="showSection('settings')" class="nav-item text-left px-4 py-3 rounded-md hover:bg-slate-700 transition flex items-center gap-3 w-full">⚙️ সাইট সেটিংস</button>
                
                <div class="border-t border-slate-700 mt-2 pt-2">
                    <button onclick="handleLogout()" class="w-full text-left px-4 py-3 rounded-md bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white transition flex items-center gap-3 border border-red-900/50">🚪 লগআউট</button>
                </div>
            </div>
        </nav>
    </aside>

    <!-- মেইন কন্টেন্ট -->
    <div class="flex-1 flex flex-col h-[100dvh] overflow-hidden w-full relative">
        
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-30 flex-shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-gray-700 text-2xl focus:outline-none md:hidden">☰</button>
                <h1 class="text-xl font-bold text-blue-600 hidden md:block" id="mobile-header-title">ড্যাশবোর্ড</h1>
            </div>
        </header>

        <main class="flex-grow p-4 md:p-8 overflow-y-auto relative">

            <!-- সাইট সেটিংস -->
            <section id="section-settings" class="section-content active">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">সাইট সেটিংস</h2>
                <div class="bg-white p-6 rounded-xl shadow-sm max-w-2xl">
                    <form id="siteSettingsForm" class="space-y-4">
                        <div><label class="block text-sm font-medium text-gray-700">কোম্পানির নাম</label><input type="text" id="set_company_name" required class="mt-1 w-full px-3 py-2 border rounded-md"></div>
                        <div><label class="block text-sm font-medium text-gray-700">কোম্পানির টাইটেল / স্লোগান</label><input type="text" id="set_tagline" required class="mt-1 w-full px-3 py-2 border rounded-md"></div>
                        
                        <div class="border-t pt-4 mt-4">
                            <h3 class="font-bold text-gray-800 mb-3">ডেলিভারি চার্জ সেটিংস</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="block text-sm font-medium text-gray-700">ঢাকার ভেতরে (৳)</label><input type="number" id="set_del_dhaka" required class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="60"></div>
                                <div><label class="block text-sm font-medium text-gray-700">ঢাকার বাইরে (৳)</label><input type="number" id="set_del_outside" required class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="120"></div>
                            </div>
                            <div class="mt-3"><label class="block text-sm font-medium text-gray-700">ফ্রি ডেলিভারি (কত টাকার বেশি কিনলে)</label><input type="number" id="set_free_del" required class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="1000 (0 দিলে অফ হবে)"></div>
                        </div>

                        <div class="border-t pt-4 mt-4">
                            <h3 class="font-bold text-gray-800 mb-3">হোম পেজ ব্যানার সেটিংস</h3>
                            <div class="space-y-3">
                                <div><label class="block text-sm font-medium text-gray-700">ব্যানার বড় টাইটেল (লেখা)</label><input type="text" id="set_banner_text" required class="mt-1 w-full px-3 py-2 border rounded-md"></div>
                                <div><label class="block text-sm font-medium text-gray-700">ব্যানার ছোট বিবরণী (সাব-টাইটেল)</label><input type="text" id="set_sub_tagline" class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="সেরা লেখকদের বইয়ের বিশাল সংগ্রহ..."></div>
                                <div><label class="block text-sm font-medium text-gray-700">ব্যানার ইমেজ</label><div class="flex items-center gap-4 mt-1"><img id="current_banner" src="" class="h-12 w-24 object-cover border rounded hidden"><input type="file" id="set_banner_file" accept="image/*" class="w-full px-3 py-2 border rounded-md bg-gray-50 text-sm"></div></div>
                            </div>
                        </div>

                        <div><label class="block text-sm font-medium text-gray-700">কোম্পানির লোগো</label><div class="flex items-center gap-4 mt-1"><img id="current_logo" src="" class="h-12 w-12 object-contain border rounded hidden"><input type="file" id="set_logo_file" accept="image/*" class="w-full px-3 py-2 border rounded-md bg-gray-50 text-sm"></div></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium text-gray-700">ফোন নাম্বার</label><input type="text" id="set_phone" class="mt-1 w-full px-3 py-2 border rounded-md"></div>
                            <div><label class="block text-sm font-medium text-gray-700">ঠিকানা</label><input type="text" id="set_address" class="mt-1 w-full px-3 py-2 border rounded-md"></div>
                        </div>
                        <div><label class="block text-sm font-medium text-gray-700">ফুটার টেক্সট (কপিরাইট)</label><input type="text" id="set_footer_text" class="mt-1 w-full px-3 py-2 border rounded-md"></div>
                        <button type="submit" id="saveSettingsBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">সেটিংস সেভ করুন</button>
                    </form>
                    <div id="settingsMessage" class="mt-3 text-center font-bold hidden"></div>
                </div>
            </section>

        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let siteSettings = null; 

        window.showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-animate px-6 py-4 rounded-lg shadow-2xl text-white font-bold flex items-center gap-3 ${isError ? 'bg-red-600 border-l-4 border-red-800' : 'bg-green-600 border-l-4 border-green-800'}`;
            toast.innerHTML = `<span class="text-2xl">${isError ? '⚠️' : '✅'}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 4000);
        };

        async function fetchGlobalSettings() {
            const { data } = await supabaseClient.from('site_settings').select('*').limit(1).maybeSingle();
            if (data) {
                siteSettings = data;
                document.getElementById('sidebar-company-name').innerText = data.company_name || 'Boi Chokro';
                document.getElementById('mobile-header-title').innerText = data.company_name || 'Boi Chokro';
            }
        }

        async function loadSettings() {
            if (!siteSettings) await fetchGlobalSettings();
            if(siteSettings) {
                document.getElementById('set_company_name').value = siteSettings.company_name || '';
                document.getElementById('set_tagline').value = siteSettings.tagline || '';
                document.getElementById('set_phone').value = siteSettings.phone || '';
                document.getElementById('set_address').value = siteSettings.address || '';
                document.getElementById('set_footer_text').value = siteSettings.footer_text || '';
                document.getElementById('set_banner_text').value = siteSettings.banner_text || '';
                document.getElementById('set_sub_tagline').value = siteSettings.sub_tagline || '';
                document.getElementById('set_del_dhaka').value = siteSettings.delivery_dhaka || 60;
                document.getElementById('set_del_outside').value = siteSettings.delivery_outside || 120;
                document.getElementById('set_free_del').value = siteSettings.free_delivery_amount || 0;

                if (siteSettings.logo_url) {
                    const logoImg = document.getElementById('current_logo');
                    logoImg.src = siteSettings.logo_url;
                    logoImg.classList.remove('hidden');
                }
                if (siteSettings.banner_url) {
                    const bannerImg = document.getElementById('current_banner');
                    bannerImg.src = siteSettings.banner_url;
                    bannerImg.classList.remove('hidden');
                }
            }
        }

        document.getElementById('siteSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveSettingsBtn');
            const msgDiv = document.getElementById('settingsMessage');
            btn.innerText = 'সেভ হচ্ছে...'; 
            btn.disabled = true;
            msgDiv.classList.add('hidden');

            try {
                let logo_url = siteSettings ? siteSettings.logo_url : null;
                let banner_url = siteSettings ? siteSettings.banner_url : null;

                const logoFile = document.getElementById('set_logo_file').files[0];
                if (logoFile) {
                    const fileName = `logo_${Date.now()}.${logoFile.name.split('.').pop()}`;
                    const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, logoFile);
                    if (uploadError) throw new Error("লোগো আপলোড সমস্যা: " + uploadError.message);
                    const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                    logo_url = data.publicUrl;
                }

                const bannerFile = document.getElementById('set_banner_file').files[0];
                if (bannerFile) {
                    const fileName = `banner_${Date.now()}.${bannerFile.name.split('.').pop()}`;
                    const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, bannerFile);
                    if (uploadError) throw new Error("ব্যানার আপলোড সমস্যা: " + uploadError.message);
                    const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                    banner_url = data.publicUrl;
                }

                const settingsData = {
                    company_name: document.getElementById('set_company_name').value,
                    tagline: document.getElementById('set_tagline').value,
                    phone: document.getElementById('set_phone').value,
                    address: document.getElementById('set_address').value,
                    footer_text: document.getElementById('set_footer_text').value,
                    banner_text: document.getElementById('set_banner_text').value,
                    sub_tagline: document.getElementById('set_sub_tagline').value,
                    delivery_dhaka: parseFloat(document.getElementById('set_del_dhaka').value) || 60,
                    delivery_outside: parseFloat(document.getElementById('set_del_outside').value) || 120,
                    free_delivery_amount: parseFloat(document.getElementById('set_free_del').value) || 0,
                    logo_url: logo_url,
                    banner_url: banner_url
                };

                let error;
                if (siteSettings && siteSettings.id) {
                    const { error: updateError } = await supabaseClient.from('site_settings').update(settingsData).eq('id', siteSettings.id);
                    error = updateError;
                } else {
                    const { error: insertError } = await supabaseClient.from('site_settings').insert([settingsData]);
                    error = insertError;
                }

                if (error) throw new Error(error.message);

                siteSettings = settingsData;
                fetchGlobalSettings();

                showToast('✅ সাইট সেটিংস ও ব্যানার সফলভাবে সেভ হয়েছে!');
                msgDiv.innerText = '✅ সফলভাবে সেভ করা হয়েছে!';
                msgDiv.className = 'mt-3 text-center font-bold text-green-600';
                msgDiv.classList.remove('hidden');

            } catch (err) {
                showToast('❌ সেভ করতে সমস্যা হয়েছে: ' + err.message, true);
                msgDiv.innerText = '❌ ' + err.message;
                msgDiv.className = 'mt-3 text-center font-bold text-red-600';
                msgDiv.classList.remove('hidden');
            } finally {
                btn.innerText = 'সেটিংস সেভ করুন'; 
                btn.disabled = false;
            }
        });

        async function init() {
            await fetchGlobalSettings();
            loadSettings();
        }
        init();
    </script>
</body>
</html>
