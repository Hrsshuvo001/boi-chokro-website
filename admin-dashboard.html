<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-slate-800 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Boi Chokro - Admin</h1>
        <button id="logoutBtn" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">লগআউট</button>
    </nav>

    <div class="max-w-6xl mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- নতুন বই যোগ করার ফর্ম -->
        <div class="bg-white p-6 rounded-lg shadow-md md:col-span-1 h-fit">
            <h2 class="text-xl font-bold mb-4 text-gray-800">নতুন বই যোগ করুন</h2>
            <form id="addBookForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">বইয়ের নাম</label>
                    <input type="text" id="title" required class="mt-1 w-full px-3 py-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">লেখকের নাম</label>
                    <input type="text" id="author" required class="mt-1 w-full px-3 py-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">দাম (টাকা)</label>
                    <input type="number" id="price" required class="mt-1 w-full px-3 py-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">বইয়ের বিবরণ (Description)</label>
                    <textarea id="description" rows="3" class="mt-1 w-full px-3 py-2 border rounded-md"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">বইয়ের ছবি আপলোড করুন</label>
                    <input type="file" id="cover_file" accept="image/*" class="mt-1 w-full px-3 py-2 border rounded-md bg-gray-50">
                </div>
                <button type="submit" id="addBtn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">বই যোগ করুন</button>
            </form>
            <div id="message" class="mt-3 text-sm text-center hidden"></div>
        </div>

        <!-- বইয়ের লিস্ট -->
        <div class="md:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-gray-800">সব বই</h2>
            <div id="bookList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <p class="text-gray-500">বই লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const bookListDiv = document.getElementById('bookList');
        const addBookForm = document.getElementById('addBookForm');
        const messageDiv = document.getElementById('message');

        // অ্যাডমিন চেক এবং বই লোড
        async function initDashboard() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = '/admin-login.html';
                return;
            }
            loadBooks();
        }

        // বই লোড করা
        async function loadBooks() {
            const { data: books, error } = await supabaseClient
                .from('books')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                bookListDiv.innerHTML = `<p class="text-red-500">বই লোড করতে সমস্যা হয়েছে!</p>`;
                return;
            }

            if (books.length === 0) {
                bookListDiv.innerHTML = `<p class="text-gray-500">এখনো কোনো বই যোগ করা হয়নি।</p>`;
                return;
            }

            bookListDiv.innerHTML = books.map(book => `
                <div class="bg-white p-4 rounded-lg shadow border-t-4 border-blue-500 flex flex-col justify-between">
                    <div>
                        <img src="${book.cover_url || 'https://via.placeholder.com/150'}" alt="${book.title}" class="w-full h-40 object-cover rounded mb-3">
                        <h3 class="font-bold text-lg">${book.title}</h3>
                        <p class="text-sm text-gray-600">লেখক: ${book.author}</p>
                        <p class="text-blue-600 font-bold mt-2">৳ ${book.price}</p>
                        <p class="text-sm text-gray-500 mt-1 truncate">${book.description || 'কোনো বিবরণ নেই'}</p>
                    </div>
                    <button onclick="deleteBook('${book.id}')" class="mt-3 w-full bg-red-100 text-red-600 py-1 rounded text-sm hover:bg-red-200">ডিলিট করুন</button>
                </div>
            `).join('');
        }

        // নতুন বই যোগ করা (ছবি আপলোড সহ)
        addBookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            btn.innerText = 'যোগ হচ্ছে...';
            btn.disabled = true;

            try {
                const file = document.getElementById('cover_file').files[0];
                let cover_url = '';

                // ১. যদি ছবি সিলেক্ট করা থাকে, তবে সেটি Supabase Storage-এ আপলোড করব
                if (file) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`; // ইউনিক ফাইল নাম
                    
                    const { data: uploadData, error: uploadError } = await supabaseClient
                        .storage
                        .from('book-covers')
                        .upload(fileName, file);

                    if (uploadError) throw new Error("ছবি আপলোড ব্যর্থ হয়েছে: " + uploadError.message);

                    // আপলোড হওয়া ছবির পাবলিক লিংক বের করা
                    const { data: publicUrlData } = supabaseClient
                        .storage
                        .from('book-covers')
                        .getPublicUrl(fileName);
                    
                    cover_url = publicUrlData.publicUrl;
                }

                // ২. ডাটাবেসে বইয়ের তথ্য সেভ করা
                const newBook = {
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value,
                    price: parseFloat(document.getElementById('price').value),
                    description: document.getElementById('description').value,
                    cover_url: cover_url // আপলোড করা ছবির লিংক
                };

                const { error: insertError } = await supabaseClient.from('books').insert([newBook]);
                if (insertError) throw insertError;

                messageDiv.className = 'mt-3 text-sm text-center text-green-600 block';
                messageDiv.innerText = 'সফলভাবে বই যোগ হয়েছে!';
                addBookForm.reset();
                loadBooks(); // লিস্ট রিফ্রেশ

            } catch (error) {
                messageDiv.className = 'mt-3 text-sm text-center text-red-600 block';
                messageDiv.innerText = '⚠️ ' + error.message;
            } finally {
                btn.innerText = 'বই যোগ করুন';
                btn.disabled = false;
            }
        });

        // বই ডিলিট
        window.deleteBook = async (id) => {
            if(!confirm("আপনি কি নিশ্চিত এই বইটি ডিলিট করতে চান?")) return;
            const { error } = await supabaseClient.from('books').delete().eq('id', id);
            if(error) alert("ডিলিট করা যায়নি: " + error.message);
            else loadBooks();
        };

        // লগআউট
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/admin-login.html';
        });

        initDashboard();
    </script>
</body>
</html>
