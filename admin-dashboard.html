<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - Boi Chokro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- নেভিগেশন বার -->
    <nav class="bg-slate-800 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Boi Chokro - Admin Panel</h1>
        <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">
            লগআউট
        </button>
    </nav>

    <!-- মেইন কন্টেন্ট -->
    <div class="max-w-4xl mx-auto mt-10 p-4">
        <div class="bg-white p-8 rounded-lg shadow-md border-t-4 border-blue-600">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">স্বাগতম, অ্যাডমিন!</h2>
            <p class="text-gray-600 mb-6">
                আপনার অ্যাকাউন্ট: <strong id="userEmail" class="text-blue-600">লোড হচ্ছে...</strong>
            </p>
            
            <div class="border-t pt-6">
                <h3 class="text-lg font-semibold mb-2">অ্যাডমিন কন্ট্রোল:</h3>
                <p class="text-sm text-gray-500 mb-4">এখান থেকে আপনি বই যোগ করা, ইউজার ম্যানেজ করা বা অন্যান্য অ্যাডমিন কাজ করতে পারবেন।</p>
                
                <!-- উদাহরণস্বরূপ কয়েকটি বাটন -->
                <div class="flex gap-4">
                    <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">নতুন বই যোগ করুন</button>
                    <button class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">ইউজার লিস্ট</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ১. Supabase কনফিগারেশন
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const userEmailElement = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        // ২. অ্যাডমিন সেশন এবং রোল চেক
        async function checkAdminAccess() {
            // প্রথমে চেক করি ইউজার লগইন আছে কি না
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

            if (sessionError || !session) {
                // লগইন না থাকলে লগইন পেজে পাঠাবে
                window.location.href = '/login.html';
                return;
            }

            const user = session.user;
            userEmailElement.innerText = user.email;

            // এবার ডাটাবেসের 'profiles' টেবিল থেকে ইউজারের role চেক করি
            const { data: profile, error: profileError } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();

            if (profileError) {
                console.error("Error fetching profile:", profileError);
                alert("প্রোফাইল যাচাই করতে সমস্যা হয়েছে!");
                await supabaseClient.auth.signOut();
                window.location.href = '/login.html';
                return;
            }

            // যদি ইউজারের রোল 'admin' না হয়
            if (profile.role !== 'admin') {
                alert("দুঃখিত! আপনি অ্যাডমিন নন। এই পেজে আপনার প্রবেশাধিকার নেই।");
                // তাকে সাধারণ ড্যাশবোর্ডে বা হোম পেজে পাঠিয়ে দিন
                window.location.href = '/dashboard.html'; 
            }
            // যদি অ্যাডমিন হয়, তাহলে তাকে পেজে থাকতে দেবে (কিছু করার দরকার নেই)
        }

        // ৩. লগআউট ফাংশন
        async function handleLogout() {
            logoutBtn.innerText = 'অপেক্ষা করুন...';
            await supabaseClient.auth.signOut();
            window.location.href = '/admin-login.html';
        }

        logoutBtn.addEventListener('click', handleLogout);

        // পেজ লোড হলেই চেক করবে
        checkAdminAccess();
    </script>
</body>
</html>
