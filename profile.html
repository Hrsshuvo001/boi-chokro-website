<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার প্রোফাইল - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="flex items-center gap-2">
                <span class="text-2xl font-extrabold text-blue-600 tracking-tight">Boi Chokro</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="/cart.html" class="relative flex items-center gap-1.5 bg-blue-50 text-blue-600 px-4 py-2 rounded-lg font-semibold transition border border-blue-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span class="text-sm hidden sm:inline">কার্ট</span>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white shadow-sm">0</span>
                </a>
                <a href="/index.html" class="text-sm font-semibold text-gray-600 hover:text-blue-600 transition">হোমে ফিরে যান</a>
            </div>
        </div>
    </nav>

    <!-- মেইন কন্টেন্ট -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8">
        
        <h1 class="text-3xl font-bold text-gray-900 mb-8 border-b pb-4">আমার প্রোফাইল</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- বাম দিক: প্রোফাইল কার্ড ও ট্যাব -->
            <div class="md:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col items-center sticky top-24">
                    
                    <!-- প্রোফাইল ছবি -->
                    <div class="relative group">
                        <img id="profileDisplayImage" src="https://via.placeholder.com/150" class="w-32 h-32 rounded-full object-cover border-4 border-blue-100 shadow-sm">
                        <label for="profileImageUpload" class="absolute bottom-0 right-0 bg-blue-600 text-white p-2 rounded-full cursor-pointer hover:bg-blue-700 transition shadow-md">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                        </label>
                        <input type="file" id="profileImageUpload" accept="image/*" class="hidden">
                    </div>

                    <h2 id="displayName" class="text-xl font-bold mt-4 text-gray-900">লোড হচ্ছে...</h2>
                    <p id="displayEmail" class="text-sm text-gray-500 mb-6">...</p>

                    <!-- ট্যাব বাটন -->
                    <div class="w-full flex flex-col gap-2">
                        <button onclick="switchTab('info')" id="tabBtnInfo" class="w-full text-left px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-semibold transition border border-blue-100 flex items-center gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            ব্যক্তিগত তথ্য
                        </button>
                        <button onclick="switchTab('orders')" id="tabBtnOrders" class="w-full text-left px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 font-semibold transition border border-transparent flex items-center gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                            আমার অর্ডার
                        </button>
                        <button onclick="switchTab('reviews')" id="tabBtnReviews" class="w-full text-left px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 font-semibold transition border border-transparent flex items-center gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>
                            আমার রিভিউ
                        </button>
                    </div>
                </div>
            </div>

            <!-- ডান দিক: ট্যাব কন্টেন্ট -->
            <div class="md:col-span-2">
                
                <!-- ১. ব্যক্তিগত তথ্য (Info Tab) -->
                <div id="tabContentInfo" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
                    <h3 class="text-xl font-bold text-gray-900 mb-6">ব্যক্তিগত তথ্য আপডেট করুন</h3>
                    <form id="profileForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">পুরো নাম</label>
                                <input type="text" id="profName" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">মোবাইল নম্বর</label>
                                <input type="text" id="profPhone" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">ঠিকানা</label>
                            <textarea id="profAddress" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">ইমেইল (পরিবর্তনযোগ্য নয়)</label>
                            <input type="email" id="profEmail" class="w-full px-4 py-2 border rounded-lg bg-gray-200 text-gray-500 cursor-not-allowed" readonly>
                        </div>
                        <button type="submit" id="updateProfileBtn" class="bg-blue-600 text-white font-bold py-2.5 px-6 rounded-lg hover:bg-blue-700 transition shadow-md mt-4">
                            তথ্য সেভ করুন
                        </button>
                    </form>
                </div>

                <!-- ২. অর্ডার হিস্ট্রি (Orders Tab) -->
                <div id="tabContentOrders" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 hidden">
                    <h3 class="text-xl font-bold text-gray-900 mb-6">আমার অর্ডারসমূহ</h3>
                    <div id="ordersList" class="space-y-4">
                        <p class="text-gray-500 text-center">অর্ডার লোড হচ্ছে...</p>
                    </div>
                </div>

                <!-- ৩. রিভিউ (Reviews Tab) -->
                <div id="tabContentReviews" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 hidden">
                    <h3 class="text-xl font-bold text-gray-900 mb-6">আমার দেওয়া রিভিউ</h3>
                    <div id="reviewsList" class="space-y-4">
                        <p class="text-gray-500 text-center">রিভিউ লোড হচ্ছে...</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-auto">
        <p class="text-sm font-medium">&copy; 2024 Boi Chokro. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }

        async function checkAuthAndLoadProfile() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = '/login.html';
                return;
            }
            currentUser = session.user;

            // প্রোফাইল ডাটা আনা
            const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            if (profile) {
                currentProfile = profile;
                document.getElementById('displayName').innerText = profile.full_name || currentUser.email.split('@')[0];
                document.getElementById('displayEmail').innerText = currentUser.email;
                
                document.getElementById('profName').value = profile.full_name || '';
                document.getElementById('profPhone').value = profile.phone || '';
                document.getElementById('profAddress').value = profile.address || '';
                document.getElementById('profEmail').value = currentUser.email;

                if(profile.profile_image) {
                    document.getElementById('profileDisplayImage').src = profile.profile_image;
                }
            }
        }

        // ট্যাব সুইচ লজিক
        window.switchTab = (tabName) => {
            // কন্টেন্ট হাইড করা
            document.getElementById('tabContentInfo').classList.add('hidden');
            document.getElementById('tabContentOrders').classList.add('hidden');
            document.getElementById('tabContentReviews').classList.add('hidden');

            // বাটন স্টাইল রিসেট
            document.getElementById('tabBtnInfo').className = "w-full text-left px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 font-semibold transition border border-transparent flex items-center gap-3";
            document.getElementById('tabBtnOrders').className = "w-full text-left px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 font-semibold transition border border-transparent flex items-center gap-3";
            document.getElementById('tabBtnReviews').className = "w-full text-left px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 font-semibold transition border border-transparent flex items-center gap-3";

            // এক্টিভ কন্টেন্ট ও বাটন দেখানো
            if(tabName === 'info') {
                document.getElementById('tabContentInfo').classList.remove('hidden');
                document.getElementById('tabBtnInfo').className = "w-full text-left px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-semibold transition border border-blue-100 flex items-center gap-3";
            } else if (tabName === 'orders') {
                document.getElementById('tabContentOrders').classList.remove('hidden');
                document.getElementById('tabBtnOrders').className = "w-full text-left px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-semibold transition border border-blue-100 flex items-center gap-3";
                loadOrders();
            } else if (tabName === 'reviews') {
                document.getElementById('tabContentReviews').classList.remove('hidden');
                document.getElementById('tabBtnReviews').className = "w-full text-left px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-semibold transition border border-blue-100 flex items-center gap-3";
                loadReviews();
            }
        }

        // প্রোফাইল ইমেজ আপলোড
        document.getElementById('profileImageUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;

            // প্রিভিউ দেখানো
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('profileDisplayImage').src = e.target.result;
            reader.readAsDataURL(file);

            // Supabase এ আপলোড
            const fileName = `profile_${currentUser.id}_${Date.now()}.${file.name.split('.').pop()}`;
            const { error } = await supabaseClient.storage.from('book-covers').upload(fileName, file);
            
            if(!error) {
                const { data } = supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                // ডাটাবেসে সেভ
                await supabaseClient.from('profiles').update({ profile_image: data.publicUrl }).eq('id', currentUser.id);
                alert('প্রোফাইল ছবি আপডেট হয়েছে!');
            } else {
                alert('ছবি আপলোড ব্যর্থ হয়েছে!');
            }
        });

        // প্রোফাইল ফর্ম সাবমিট
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('updateProfileBtn');
            btn.innerText = 'সেভ হচ্ছে...'; btn.disabled = true;

            const updates = {
                full_name: document.getElementById('profName').value,
                phone: document.getElementById('profPhone').value,
                address: document.getElementById('profAddress').value
            };

            const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUser.id);
            
            if(error) alert('সমস্যা হয়েছে: ' + error.message);
            else {
                alert('তথ্য সফলভাবে সেভ হয়েছে!');
                document.getElementById('displayName').innerText = updates.full_name;
            }
            btn.innerText = 'তথ্য সেভ করুন'; btn.disabled = false;
        });

        // অর্ডার লোড করা
        async function loadOrders() {
            const list = document.getElementById('ordersList');
            list.innerHTML = `<p class="text-gray-500 text-center py-4">লোড হচ্ছে...</p>`;

            const { data: orders, error } = await supabaseClient.from('orders')
                .select('*')
                .or(`user_id.eq.${currentUser.id},customer_phone.eq.${currentProfile?.phone}`) // আইডি বা ফোন দিয়ে খোঁজা
                .order('created_at', { ascending: false });

            if(error || !orders || orders.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-8">আপনি এখনো কোনো অর্ডার করেননি।</p>`;
                return;
            }

            list.innerHTML = orders.map(order => `
                <div class="border border-gray-200 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:shadow-sm transition">
                    <div>
                        <p class="text-sm font-bold text-gray-800">অর্ডার আইডি: <span class="text-blue-600">#${order.id.split('-')[0]}</span></p>
                        <p class="text-xs text-gray-500 mt-1">তারিখ: ${new Date(order.created_at).toLocaleDateString('bn-BD')}</p>
                        <p class="text-xs text-gray-500">মোবাইল: ${order.customer_phone || 'N/A'}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-extrabold text-gray-900 mb-1">৳ ${order.total_amount}</p>
                        <span class="text-xs font-bold px-2 py-1 rounded-md ${order.status === 'completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${order.status === 'completed' ? 'ডেলিভারি সম্পন্ন' : 'পেন্ডিং'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // রিভিউ লোড করা
        async function loadReviews() {
            const list = document.getElementById('reviewsList');
            list.innerHTML = `<p class="text-gray-500 text-center py-4">লোড হচ্ছে...</p>`;

            const { data: reviews, error } = await supabaseClient.from('reviews')
                .select(`*, books (title)`)
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if(error || !reviews || reviews.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-8">আপনি এখনো কোনো রিভিউ দেননি।</p>`;
                return;
            }

            list.innerHTML = reviews.map(rev => `
                <div class="border border-gray-200 rounded-xl p-4 hover:shadow-sm transition">
                    <div class="flex justify-between items-start mb-2">
                        <p class="font-bold text-gray-800">${rev.books?.title || 'অজানা বই'}</p>
                        <div class="flex text-yellow-400">
                            ${Array(rev.rating).fill('<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>`).join('')}
                        </div>
                    </div>
                    <p class="text-sm text-gray-600">${rev.comment || 'কোনো মন্তব্য নেই'}</p>
                </div>
            `).join('');
        }

        checkAuthAndLoadProfile(); 
        updateCartCount();
    </script>
</body>
</html>
