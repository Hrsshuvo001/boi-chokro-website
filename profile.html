    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        const urlParams = new URLSearchParams(window.location.search);
        const profileId = urlParams.get('id'); 
        let isOwnProfile = false;
        let viewingUserId = null;
        let currentGallery = [];

        // ড্রপডাউন ডেট পিকার অপশন পপুলেট করা
        function populateDobDropdowns() {
            const daySelect = document.getElementById('dobDay');
            const yearSelect = document.getElementById('dobYear');
            for(let i=1; i<=31; i++) {
                daySelect.innerHTML += `<option value="${i < 10 ? '0'+i : i}">${i}</option>`;
            }
            const currentYear = new Date().getFullYear();
            for(let y=currentYear; y>=1940; y--) {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            }
        }
        populateDobDropdowns();

        window.showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `toast-animate px-5 py-4 rounded-lg shadow-2xl text-white font-bold flex items-center gap-3 ${isError ? 'bg-red-600 border-l-4 border-red-800' : 'bg-green-600 border-l-4 border-green-800'}`;
            toast.innerHTML = `<span class="text-2xl">${isError ? '⚠️' : '✅'}</span><span class="text-sm md:text-base pr-2">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transform = 'translateX(100%)'; 
                toast.style.transition = 'all 0.3s ease'; 
                setTimeout(() => toast.remove(), 300); 
            }, 4000);
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // সেন্সরশিপ / নুড ও সেক্সুয়াল ছবি ডিটেকশন ফাংশন
        async function checkNudeOrExplicitImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                const reader = new FileReader();
                reader.onload = (e) => {
                    img.src = e.target.result;
                };
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 100; // ফাস্ট চেকের জন্য ছোট সাইজ
                    canvas.height = 100;
                    ctx.drawImage(img, 0, 0, 100, 100);
                    
                    const imgData = ctx.getImageData(0, 0, 100, 100);
                    let skinPixelCount = 0;
                    const totalPixels = imgData.data.length / 4;

                    for (let i = 0; i < imgData.data.length; i += 4) {
                        const r = imgData.data[i];
                        const g = imgData.data[i + 1];
                        const b = imgData.data[i + 2];

                        // কালার হিউম্যান স্কিন টোন রেঞ্জ ডিটেকশন ফর্মুলা
                        if ((r > 95 && g > 40 && b > 20 && Math.max(r, g, b) - Math.min(r, g, b) > 15 && Math.abs(r - g) > 15 && r > g && r > b) ||
                            (r > 220 && g > 210 && b > 170 && Math.abs(r - g) <= 15 && r > b && g > b)) {
                            skinPixelCount++;
                        }
                    }

                    const skinPercentage = (skinPixelCount / totalPixels) * 100;
                    // যদি ছবির ৬০% এর বেশি অংশ স্কিন টোন বা নুড হিউম্যান বডি কালার হয়, তবে ব্লক করবে
                    if (skinPercentage > 60) {
                        resolve(true); // নুড বা আপত্তিকর শনাক্ত হয়েছে
                    } else {
                        resolve(false); // নিরাপদ
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) currentUser = session.user;

            if (!profileId && !currentUser) { 
                window.location.href = '/login.html'; 
                return; 
            }

            viewingUserId = profileId || currentUser?.id;
            isOwnProfile = (currentUser && viewingUserId === currentUser.id);

            await loadProfileDetails();
            if(isOwnProfile) checkAndNotifyBirthday();

            if (isOwnProfile) {
                const savedTab = localStorage.getItem('active_profile_tab') || 'myBlogs';
                switchTab(savedTab, false);
            } else {
                switchTab('myBlogs', false);
            }
        }

        async function checkAndNotifyBirthday() {
            if(!currentUser) return;
            const today = new Date().toISOString().slice(5, 10);
            const lastCheckKey = `bday_checked_${currentUser.id}_${new Date().toISOString().slice(0, 10)}`;
            if(localStorage.getItem(lastCheckKey)) return;

            const { data: profile } = await supabaseClient.from('profiles').select('dob, full_name').eq('id', currentUser.id).maybeSingle();
            if(!profile || !profile.dob) return;

            if(profile.dob.slice(5, 10) === today) {
                const { data: friends } = await supabaseClient.from('friends')
                    .select('*')
                    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
                    .eq('status', 'accepted');

                if(friends && friends.length > 0) {
                    for(let f of friends) {
                        const friendId = f.sender_id === currentUser.id ? f.receiver_id : f.sender_id;
                        await supabaseClient.from('notifications').insert([{
                            user_id: friendId,
                            message: `🎉 আজ আপনার বন্ধু ${profile.full_name || 'কারো'} এর জন্মদিন! তাকে জন্মদিনের শুভেচ্ছা জানান।`,
                            is_read: false
                        }]);
                    }
                    localStorage.setItem(lastCheckKey, 'true');
                }
            }
        }

        async function loadProfileDetails() {
            let { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', viewingUserId).maybeSingle();
            
            if ((!profile || error) && isOwnProfile && currentUser) {
                const newProfile = {
                    id: currentUser.id,
                    full_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
                    email: currentUser.email
                };
                await supabaseClient.from('profiles').upsert([newProfile]);
                const res = await supabaseClient.from('profiles').select('*').eq('id', viewingUserId).maybeSingle();
                profile = res.data;
            }

            if (!profile) {
                document.getElementById('displayName').innerText = "প্রোফাইল পাওয়া যায়নি!";
                return;
            }

            const userName = profile.full_name || profile.name || currentUser?.user_metadata?.full_name || 'নামহীন ব্যবহারকারী';
            document.getElementById('displayName').innerText = userName;
            document.getElementById('displayEmail').innerText = profile.email || currentUser?.email || '';
            document.getElementById('displayBio').innerText = profile.bio ? `"${profile.bio}"` : '';
            document.getElementById('displayOccupation').innerText = profile.occupation ? `💼 ${profile.occupation}` : '';
            document.getElementById('displayAddress').innerText = profile.address ? `📍 ${profile.address}` : '';

            const profileImg = profile.profile_image ? profile.profile_image : `https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=random&size=200`;
            document.getElementById('profileImageDisplay').src = profileImg;
            
            const coverImgEl = document.getElementById('coverImageDisplay');
            if(profile.cover_image) {
                coverImgEl.src = profile.cover_image;
                coverImgEl.classList.remove('hidden');
            } else {
                coverImgEl.classList.add('hidden');
            }

            currentGallery = profile.gallery_images || [];

            let actionButtons = '';
            let friendStatus = 'none';

            if (currentUser && !isOwnProfile) {
                const { data: friendReq } = await supabaseClient.from('friends')
                    .select('*')
                    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${viewingUserId}),and(sender_id.eq.${viewingUserId},receiver_id.eq.${currentUser.id})`)
                    .maybeSingle();

                if (friendReq) {
                    if (friendReq.status === 'accepted') friendStatus = 'friends';
                    else if (friendReq.sender_id === currentUser.id) friendStatus = 'pending_sent';
                    else if (friendReq.receiver_id === currentUser.id) friendStatus = 'pending_received';
                }
            }

            if (isOwnProfile) {
                document.getElementById('myProfileTabs').classList.remove('hidden');
                document.getElementById('coverUploadLabel').classList.remove('hidden');
                document.getElementById('profileUploadLabel').classList.remove('hidden');
                document.getElementById('galleryUploadLabel').classList.remove('hidden');
                document.getElementById('createPostBtn').classList.remove('hidden');

                document.getElementById('profName').value = profile.full_name || profile.name || '';
                document.getElementById('profPhone').value = profile.phone || '';
                document.getElementById('profBio').value = profile.bio || '';
                document.getElementById('profOccupation').value = profile.occupation || '';
                document.getElementById('profAddress').value = profile.address || '';
                
                if(profile.dob) {
                    const dobParts = profile.dob.split('-');
                    if(dobParts.length === 3) {
                        document.getElementById('dobYear').value = dobParts[0];
                        document.getElementById('dobMonth').value = dobParts[1];

                }
            } else if (currentUser) {

                } else if (friendStatus === 'pending_sent') {

                } else if (friendStatus === 'pending_received') {
                    actionButtons = `<button onclick="acceptFriendRequest()" class="w-full mt-4 bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 transition">✅ রিকোয়েস্ট একসেপ্ট</button>`;
                } else if (friendStatus === 'friends') {
                    actionButtons = `<a href="/inbox.html?user=${viewingUserId}" class="block text-center w-full mt-4 bg-green-100 text-green-700 border border-green-300 px-4 py-2 rounded-lg font-bold hover:bg-green-200 transition">💬 মেসেজ পাঠান</a>`;
                }
            }

            document.getElementById('actionButtonsContainer').innerHTML = actionButtons;

            if (!isOwnProfile) {

                document.getElementById('blogHeaderTitle').innerText = "এই ব্যবহারকারীর পোস্টসমূহ";
                loadMyBlogs(viewingUserId);
            }
        }

        window.uploadGalleryImages = async (event) => {
            const files = event.target.files;
            if(!files.length || !currentUser) return;

            let { data: currProf } = await supabaseClient.from('profiles').select('gallery_images').eq('id', currentUser.id).maybeSingle();
            let newGallery = currProf?.gallery_images ? [...currProf.gallery_images] : [];
            let uploadCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const isExplicit = await checkNudeOrExplicitImage(file);
                if(isExplicit) {
                    showToast(`⚠️ ছবি #${i+1} আপত্তিকর হওয়ায় ব্লক করা হয়েছে!`, true);
                    continue;
                }

                const fileName = `gallery_${currentUser.id}_${Date.now()}_${i}.${file.name.split('.').pop()}`;
                const { error: uploadError } = await supabaseClient.storage.from('book-covers').upload(fileName, file);
                
                if(!uploadError) {
                    const { data } = await supabaseClient.storage.from('book-covers').getPublicUrl(fileName);
                    newGallery.unshift(data.publicUrl);
                    uploadCount++;
                }
            }

            if (uploadCount > 0) {
                const { error: dbError } = await supabaseClient.from('profiles').upsert([{ 
                    id: currentUser.id,
                    gallery_images: newGallery 
                }]);
                if(dbError) {
                    showToast('গ্যালারি সেভে সমস্যা: ' + dbError.message, true);
                } else {
                    currentGallery = newGallery;
                    renderGallery();
                    showToast('✅ নিরাপদ ছবি সফলভাবে আপলোড হয়েছে!');
                }

            }
        }
