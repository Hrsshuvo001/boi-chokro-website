<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার প্রোফাইল - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printableInvoice, #printableInvoice * { visibility: visible; }
            #printableInvoice { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors min-h-screen flex flex-col">

    <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="text-2xl font-extrabold text-blue-600 dark:text-blue-400 tracking-tight">Boi Chokro</a>
            <div class="flex items-center gap-4">
                <a href="/cart.html" class="relative flex items-center gap-1.5 bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-400 px-4 py-2 rounded-lg font-semibold transition border border-blue-100 dark:border-gray-600">
                    <span class="text-sm hidden sm:inline">কার্ট</span>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">0</span>
                </a>
                <a href="/index.html" class="text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-blue-600 transition">হোম</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8 no-print">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- বাম দিক: প্রোফাইল কার্ড ও মেনু -->
            <div class="md:col-span-1">
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 flex flex-col items-center sticky top-24">
                    <img id="profileDisplayImage" src="https://via.placeholder.com/150" class="w-32 h-32 rounded-full object-cover border-4 border-blue-100 shadow-sm">
                    <h2 id="displayName" class="text-xl font-bold mt-4 text-gray-900 dark:text-white">লোড হচ্ছে...</h2>
                    <p id="displayEmail" class="text-sm text-gray-500 mb-6">...</p>

                    <div class="w-full flex flex-col gap-2">
                        <button onclick="switchTab('info')" id="tabBtnInfo" class="w-full text-left px-4 py-3 rounded-xl bg-blue-50 dark:bg-gray-700 text-blue-700 dark:text-white font-semibold transition border border-blue-100 dark:border-gray-600 flex items-center gap-3">👤 ব্যক্তিগত তথ্য</button>
                        <button onclick="switchTab('orders')" id="tabBtnOrders" class="w-full text-left px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 font-semibold transition border border-transparent flex items-center gap-3">📦 আমার অর্ডার</button>
                        <button onclick="switchTab('friends')" id="tabBtnFriends" class="w-full text-left px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 font-semibold transition border border-transparent flex items-center gap-3">👥 ফ্রেন্ড লিস্ট</button>
                        <button onclick="switchTab('myBlogs')" id="tabBtnMyBlogs" class="w-full text-left px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 font-semibold transition border border-transparent flex items-center gap-3">📝 আমার ব্লগ</button>
                    </div>
                </div>
            </div>

            <!-- ডান দিক: কন্টেন্ট এরিয়া -->
            <div class="md:col-span-2">
                
                <!-- পার্সোনাল ইনফো -->
                <div id="tabContentInfo" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 md:p-8">
                    <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6">ব্যক্তিগত তথ্য আপডেট করুন</h3>
                    <form id="profileForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">পুরো নাম</label><input type="text" id="profName" class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600"></div>
                            <div><label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">মোবাইল নম্বর</label><input type="text" id="profPhone" class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600"></div>
                        </div>
                        <div><label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">ঠিকানা</label><textarea id="profAddress" rows="3" class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600"></textarea></div>
                        <div><label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">ইমেইল (পরিবর্তনযোগ্য নয়)</label><input type="email" id="profEmail" class="w-full px-4 py-2 border rounded-lg bg-gray-200 dark:bg-gray-600 text-gray-500 cursor-not-allowed" readonly></div>
                        <button type="submit" id="updateProfileBtn" class="bg-blue-600 text-white font-bold py-2.5 px-6 rounded-lg hover:bg-blue-700 transition shadow-md mt-4">তথ্য সেভ করুন</button>
                    </form>
                </div>

                <!-- অর্ডারস -->
                <div id="tabContentOrders" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 md:p-8 hidden">
                    <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6">আমার অর্ডারসমূহ</h3>
                    <div id="ordersList" class="space-y-6"><p class="text-gray-500 text-center">লোড হচ্ছে...</p></div>
                </div>

                <!-- ফ্রেন্ড লিস্ট (নতুন) -->
                <div id="tabContentFriends" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 md:p-8 hidden">
                    <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6">আমার ফ্রেন্ড লিস্ট</h3>
                    <div id="friendList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <p class="text-gray-500 text-center col-span-full">লোড হচ্ছে...</p>
                    </div>
                </div>

                <!-- আমার ব্লগ -->
                <div id="tabContentMyBlogs" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 md:p-8 hidden">
                    <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6">আমার লেখা ব্লগ</h3>
                    <div id="myBlogsList" class="space-y-4"><p class="text-gray-500 text-center">লোড হচ্ছে...</p></div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        async function checkAuthAndLoadProfile() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = '/login.html'; return; }
            currentUser = session.user;

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            if (profile) {
                document.getElementById('displayName').innerText = profile.full_name || currentUser.email.split('@')[0];
                document.getElementById('displayEmail').innerText = currentUser.email;
                
                document.getElementById('profName').value = profile.full_name || '';
                document.getElementById('profPhone').value = profile.phone || '';
                document.getElementById('profAddress').value = profile.address || '';
                document.getElementById('profEmail').value = currentUser.email;

                if(profile.profile_image) document.getElementById('profileDisplayImage').src = profile.profile_image;
            }
        }

        window.switchTab = (tabName) => {
            document.getElementById('tabContentInfo').classList.add('hidden');
            document.getElementById('tabContentOrders').classList.add('hidden');
            document.getElementById('tabContentFriends').classList.add('hidden');
            document.getElementById('tabContentMyBlogs').classList.add('hidden');

            const baseClass = "w-full text-left px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 font-semibold transition border border-transparent flex items-center gap-3";
            document.getElementById('tabBtnInfo').className = baseClass;
            document.getElementById('tabBtnOrders').className = baseClass;
            document.getElementById('tabBtnFriends').className = baseClass;
            document.getElementById('tabBtnMyBlogs').className = baseClass;

            const activeClass = "w-full text-left px-4 py-3 rounded-xl bg-blue-50 dark:bg-gray-700 text-blue-700 dark:text-white font-semibold transition border border-blue-100 dark:border-gray-600 flex items-center gap-3";

            if(tabName === 'info') { document.getElementById('tabContentInfo').classList.remove('hidden'); document.getElementById('tabBtnInfo').className = activeClass; }
            else if (tabName === 'orders') { document.getElementById('tabContentOrders').classList.remove('hidden'); document.getElementById('tabBtnOrders').className = activeClass; loadOrders(); }
            else if (tabName === 'friends') { document.getElementById('tabContentFriends').classList.remove('hidden'); document.getElementById('tabBtnFriends').className = activeClass; loadFriends(); }
            else if (tabName === 'myBlogs') { document.getElementById('tabContentMyBlogs').classList.remove('hidden'); document.getElementById('tabBtnMyBlogs').className = activeClass; loadMyBlogs(); }
        }

        // ফ্রেন্ড লিস্ট লোড করা
        async function loadFriends() {
            const list = document.getElementById('friendList');
            list.innerHTML = '<p class="text-gray-500 text-center col-span-full">লোড হচ্ছে...</p>';

            // যারা আমাকে ফলো করছে বা আমি যাদের ফলো করছি
            const { data: follows, error } = await supabaseClient
                .from('followers')
                .select('following_id, profiles!followers_following_id_fkey(full_name, email, profile_image)')
                .eq('follower_id', currentUser.id);

            if (error || !follows || follows.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center col-span-full py-10">আপনার কোনো ফ্রেন্ড নেই। ব্লগ পেজ থেকে লেখকদের ফলো করুন।</p>`;
                return;
            }

            list.innerHTML = follows.map(f => {
                const p = f.profiles;
                const name = p?.full_name || p?.email?.split('@')[0] || 'Unknown';
                const img = p?.profile_image || 'https://via.placeholder.com/50';
                return `
                <div class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-700 rounded-lg border border-gray-100 dark:border-gray-600">
                    <img src="${img}" class="w-12 h-12 rounded-full object-cover">
                    <div>
                        <p class="font-bold text-sm text-gray-800 dark:text-white">${name}</p>
                        <p class="text-xs text-gray-500">${p?.email || ''}</p>
                    </div>
                </div>
                `;
            }).join('');
        }

        // আমার ব্লগ লোড করা
        async function loadMyBlogs() {
            const list = document.getElementById('myBlogsList');
            list.innerHTML = '<p class="text-gray-500 text-center">লোড হচ্ছে...</p>';

            const { data: blogs, error } = await supabaseClient.from('blogs').select('*').eq('author_id', currentUser.id).order('created_at', { ascending: false });

            if (error || !blogs || blogs.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-8">আপনি এখনো কোনো ব্লগ লেখেননি।</p>`;
                return;
            }

            list.innerHTML = blogs.map(blog => {
                const statusColor = blog.status === 'approved' ? 'bg-green-100 text-green-700' : (blog.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700');
                const statusText = blog.status === 'approved' ? 'প্রকাশিত' : (blog.status === 'pending' ? 'অ্যাপ্রুভালের অপেক্ষায়' : 'বাতিল');
                return `
                <div class="border border-gray-200 dark:border-gray-700 rounded-xl p-4 bg-gray-50 dark:bg-gray-800 mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-gray-800 dark:text-white">${blog.title}</h4>
                        <span class="text-xs font-bold px-2 py-1 rounded ${statusColor}">${statusText}</span>
                    </div>
                    <p class="text-sm text-gray-600 dark:text-gray-300 line-clamp-2">${blog.content}</p>
                </div>
                `;
            }).join('');
        }

        // অর্ডার লোড (আগের কোড অনুযায়ী)
        async function loadOrders() {
            const list = document.getElementById('ordersList');
            const { data: orders } = await supabaseClient.from('orders').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            if(!orders || orders.length === 0) { list.innerHTML = `<p class="text-gray-500 text-center">কোনো অর্ডার নেই।</p>`; return; }
            
            list.innerHTML = orders.map(o => `
                <div class="border rounded-xl p-4 bg-gray-50 dark:bg-gray-700 mb-3">
                    <p class="font-bold text-sm">অর্ডার আইডি: #${o.id.split('-')[0]}</p>
                    <p class="text-sm">মোট: ৳ ${o.total_amount}</p>
                    <p class="text-xs text-gray-500">স্ট্যাটাস: ${o.status}</p>
                </div>
            `).join('');
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('updateProfileBtn');
            btn.innerText = 'সেভ হচ্ছে...'; btn.disabled = true;

            const updates = {
                full_name: document.getElementById('profName').value,
                phone: document.getElementById('profPhone').value,
                address: document.getElementById('profAddress').value
            };
            const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUser.id);
            if(error) alert('সমস্যা: ' + error.message);
            else { alert('তথ্য সেভ হয়েছে!'); document.getElementById('displayName').innerText = updates.full_name; }
            btn.innerText = 'তথ্য সেভ করুন'; btn.disabled = false;
        });

        checkAuthAndLoadProfile();
    </script>
</body>
</html>
