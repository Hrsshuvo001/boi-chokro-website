<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff" id="themeColor">
<title>লাইভ চ্যাট — Boi Chokro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700;800&display=swap');
:root{--page:#f9fafb;--surface:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--mine:#2563eb;--other:#f3f4f6;--footer:#111827}
html.dark{--page:#111827;--surface:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--line:#374151;--other:#374151;--footer:#030712}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:'Hind Siliguri',system-ui,'Noto Sans Bengali',sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;transition:background .25s,color .25s}
button,a{font:inherit}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.04);position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.brand-logo{width:42px;height:42px;object-fit:contain;border-radius:9px;display:none}
.brand-name{font-size:21px;font-weight:800;color:#2563eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.dark .brand-name{color:#60a5fa}
.top-actions{display:flex;align-items:center;gap:8px}
.top-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 12px;text-decoration:none;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.top-btn:hover{background:var(--page)}
.page{width:min(760px,100%);margin:22px auto;padding:0 12px;flex:1;display:flex;flex-direction:column}
.chat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:65dvh;max-height:calc(100dvh - 175px);overflow:hidden;box-shadow:0 5px 22px rgba(0,0,0,.05)}
.chat-heading{padding:16px;border-bottom:1px solid var(--line)}
.chat-heading h1{font-size:20px;font-weight:700;margin:0}
.chat-heading p{font-size:13px;color:var(--muted);margin:4px 0 0}
#status{font-size:12px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line)}
#messages{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}
.mine{align-self:flex-end;background:var(--mine);color:#fff;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:var(--other);color:var(--text);border-bottom-left-radius:4px}
.time{font-size:10px;opacity:.7;margin-top:4px;text-align:right}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;min-width:0;max-height:100px;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--page);color:var(--text);font:inherit;outline:none}
textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.15)}
#send{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:700;cursor:pointer}
#send:disabled{opacity:.5;cursor:not-allowed}
.notice{padding:14px;margin:auto;text-align:center;color:var(--muted);font-size:13px}
.site-footer{background:var(--footer);color:#9ca3af;padding:28px 16px 20px;margin-top:auto;border-top:4px solid #2563eb;text-align:center}
.footer-inner{max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:7px}
#footerText{font-size:13px;margin:0;white-space:pre-wrap}
#footerContact{font-size:12px;margin:0;white-space:pre-wrap}
@media(max-width:600px){.topbar-inner{padding:10px 12px}.brand-logo{width:35px;height:35px}.brand-name{font-size:17px}.top-btn{padding:7px 9px;font-size:11px}.page{margin:10px auto;padding:0 8px}.chat-card{min-height:72dvh;max-height:calc(100dvh - 145px);border-radius:12px}.msg{max-width:90%}.chat-heading h1{font-size:18px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Boi Chokro হোম">
      <img id="siteLogo" class="brand-logo" alt="Website Logo">
      <span id="companyName" class="brand-name">Boi Chokro</span>
    </a>
    <div class="top-actions">
      <button class="top-btn" id="themeToggle" type="button">🌙 ডার্ক মোড</button>
      <a class="top-btn" href="/">← ওয়েবসাইটে ফিরুন</a>
    </div>
  </div>
</header>
<main class="page">
  <section class="chat-card">
    <div class="chat-heading">
      <h1>🎧 কাস্টমার সাপোর্ট</h1>
      <p>আপনার প্রশ্ন লিখুন। সাপোর্ট টিম উত্তর দিলে এখানে দেখতে পাবেন।</p>
    </div>
    <div id="status">অ্যাকাউন্ট যাচাই হচ্ছে...</div>
    <div id="messages" aria-live="polite"><div class="notice">চ্যাট লোড হচ্ছে...</div></div>
    <form id="form" class="composer">
      <textarea id="message" rows="1" maxlength="2000" placeholder="আপনার মেসেজ লিখুন..." disabled required></textarea>
      <button id="send" type="submit" disabled>পাঠান</button>
    </form>
  </section>
</main>
<footer class="site-footer">
  <div class="footer-inner">
    <p id="footerText">© 2026 Boi Chokro. All rights reserved.</p>
    <p id="footerContact"></p>
  </div>
</footer>
<script>
(() => {
  const SUPABASE_URL='https://jhbpaezbpkfwjfmazdcn.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
  const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const $=id=>document.getElementById(id);
  let user=null,chatChannel=null,settingsChannel=null,busy=false;

  function applyTheme(value){
    const dark=value==='dark';
    document.documentElement.classList.toggle('dark',dark);
    localStorage.setItem('theme',dark?'dark':'light');
    $('themeColor').content=dark?'#111827':'#ffffff';
    $('themeToggle').textContent=dark?'☀️ লাইট মোড':'🌙 ডার্ক মোড';
  }
  function loadTheme(){applyTheme(localStorage.getItem('theme')==='dark'?'dark':'light')}
  $('themeToggle').addEventListener('click',()=>{
    applyTheme(document.documentElement.classList.contains('dark')?'light':'dark');
  });
  window.addEventListener('storage',event=>{
    if(event.key==='theme')applyTheme(event.newValue==='dark'?'dark':'light');
  });

  async function loadSiteSettings(){
    try{
      const {data,error}=await db.from('site_settings').select('*').limit(1).maybeSingle();
      if(error)throw error;
      if(!data)return;
      const name=data.company_name||'Boi Chokro';
      $('companyName').textContent=name;
      document.title='লাইভ চ্যাট — '+name;
      const logoUrl=data.logo_url||data.logo||'';
      if(logoUrl){$('siteLogo').src=logoUrl;$('siteLogo').style.display='block'}
      else{$('siteLogo').removeAttribute('src');$('siteLogo').style.display='none'}
      $('footerText').textContent=data.footer_text||('© '+new Date().getFullYear()+' '+name+'. All rights reserved.');
      const contacts=[];
      if(data.phone)contacts.push('📞 ফোন: '+data.phone);
      if(data.address)contacts.push('📍 ঠিকানা: '+data.address);
      $('footerContact').textContent=contacts.join('  |  ');
    }catch(error){console.error('Site settings load error:',error)}
  }
  function listenForSettings(){
    settingsChannel=db.channel('live-chat-site-settings')
      .on('postgres_changes',{event:'*',schema:'public',table:'site_settings'},loadSiteSettings)
      .subscribe();
  }

  function addMessage(message){
    if(!message||!message.id||document.querySelector('[data-message-id="'+CSS.escape(String(message.id))+'"]'))return;
    const row=document.createElement('div');
    row.className='msg '+(message.is_admin?'other':'mine');
    row.dataset.messageId=String(message.id);
    const body=document.createElement('div');
    body.textContent=message.message||'';
    row.appendChild(body);
    const time=document.createElement('div');
    time.className='time';
    const date=new Date(message.created_at);
    time.textContent=Number.isNaN(date.getTime())?'':date.toLocaleString('bn-BD',{hour:'2-digit',minute:'2-digit'});
    row.appendChild(time);
    $('messages').appendChild(row);
    $('messages').scrollTop=$('messages').scrollHeight;
  }

  async function markAdminMessagesRead(){
    const {error}=await db.from('chat_messages').update({is_read:true})
      .eq('user_id',user.id).eq('is_admin',true).eq('is_read',false);
    if(error)console.warn('Read status update:',error.message);
  }

  async function loadHistory(){
    const {data,error}=await db.from('chat_messages').select('id,user_id,message,is_admin,is_read,created_at')
      .eq('user_id',user.id).order('created_at',{ascending:true}).limit(200);
    if(error){$('status').textContent='চ্যাট লোড হয়নি। ডেটাবেস নীতিমালা পরীক্ষা করুন।';console.error(error);return}
    $('messages').replaceChildren();
    (data||[]).forEach(addMessage);
    if(!data||!data.length){
      const p=document.createElement('p');p.className='notice';
      p.textContent='এখনো কোনো মেসেজ নেই। নিচে লিখে কথোপকথন শুরু করুন।';
      $('messages').appendChild(p);
    }
    await markAdminMessagesRead();
  }

  function listenForMessages(){
    if(chatChannel)db.removeChannel(chatChannel);
    chatChannel=db.channel('customer-support-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'user_id=eq.'+user.id},async payload=>{
        if(payload.new&&payload.new.user_id===user.id){
          const notice=$('messages').querySelector('.notice');if(notice)notice.remove();
          addMessage(payload.new);
          if(payload.new.is_admin){
            await db.from('chat_messages').update({is_read:true}).eq('id',payload.new.id).eq('user_id',user.id);
          }
        }
      }).subscribe();
  }

  $('form').addEventListener('submit',async event=>{
    event.preventDefault();
    const message=$('message').value.trim();
    if(!user||!message||busy)return;
    busy=true;$('send').disabled=true;$('message').disabled=true;
    const {error}=await db.from('chat_messages').insert({user_id:user.id,message,is_admin:false,is_read:false});
    if(error){$('status').textContent='মেসেজ পাঠানো যায়নি। আবার চেষ্টা করুন।';console.error(error)}
    else{$('message').value='';$('status').textContent='মেসেজ পাঠানো হয়েছে · সাপোর্ট টিমের উত্তরের অপেক্ষায়'}
    busy=false;$('send').disabled=false;$('message').disabled=false;$('message').focus();
  });
  $('message').addEventListener('keydown',event=>{
    if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('form').requestSubmit()}
  });

  async function init(){
    loadTheme();
    await loadSiteSettings();
    listenForSettings();
    const {data:{session},error}=await db.auth.getSession();
    if(error||!session){location.replace('/login.html?redirect='+encodeURIComponent('/live-chat.html'));return}
    user=session.user;
    $('status').textContent='● সংযুক্ত · '+(user.email||'আপনার অ্যাকাউন্ট');
    $('message').disabled=false;$('send').disabled=false;
    await loadHistory();
    listenForMessages();
    db.auth.onAuthStateChange((event,nextSession)=>{
      if(event==='SIGNED_OUT'||!nextSession)location.replace('/login.html');
    });
  }
  window.addEventListener('beforeunload',()=>{
    if(chatChannel)db.removeChannel(chatChannel);
    if(settingsChannel)db.removeChannel(settingsChannel);
  });
  init();
})();
</script>
</body>
</html>
