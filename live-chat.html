<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>লাইভ চ্যাট</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--mine:#2563eb;--other:#e5e7eb}
html.dark{--bg:#111827;--card:#1f2937;--text:#f9fafb;--muted:#9ca3af;--line:#374151;--other:#374151}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans Bengali',sans-serif;min-height:100dvh;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800}.brand img{width:38px;height:38px;object-fit:contain;display:none}
button,a{font:inherit}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:8px 12px;text-decoration:none;cursor:pointer}
main{width:min(760px,100%);margin:20px auto;padding:0 12px;flex:1;display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:65dvh;max-height:calc(100dvh - 145px);overflow:hidden}
.heading{padding:14px 16px;border-bottom:1px solid var(--line)}.heading h1{font-size:18px;margin:0}.heading p{font-size:12px;color:var(--muted);margin:4px 0 0}
#status{font-size:12px;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--line)}
#messages{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6}
.mine{align-self:flex-end;background:var(--mine);color:#fff;border-bottom-right-radius:4px}.other{align-self:flex-start;background:var(--other);color:var(--text);border-bottom-left-radius:4px}
.time{font-size:10px;opacity:.7;margin-top:4px;text-align:right}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}textarea{flex:1;resize:none;min-width:0;max-height:100px;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--bg);color:var(--text);font:inherit}#send{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:700}#send:disabled{opacity:.5}
footer{text-align:center;padding:16px;color:var(--muted);font-size:12px}.notice{padding:14px;margin:auto;text-align:center;color:var(--muted)}
@media(max-width:600px){main{margin:8px auto;padding:0 8px}.card{min-height:72dvh;max-height:calc(100dvh - 125px)}}
</style>
</head>
<body>
<header><a class="brand" href="/"><img id="logo" alt=""><span id="company">Boi Chokro</span></a><div><button class="btn" id="theme">🌙</button> <a class="btn" href="/">হোম</a></div></header>
<main><section class="card">
<div class="heading"><h1>🎧 কাস্টমার সাপোর্ট</h1><p>আপনার প্রশ্ন লিখুন। সাপোর্ট টিম উত্তর দিলে এখানে দেখতে পাবেন।</p></div>
<div id="status">অ্যাকাউন্ট যাচাই হচ্ছে...</div>
<div id="messages"><div class="notice">চ্যাট লোড হচ্ছে...</div></div>
<form id="form"><textarea id="message" rows="1" maxlength="2000" placeholder="আপনার মেসেজ লিখুন..." disabled required></textarea><button id="send" disabled>পাঠান</button></form>
</section></main>
<footer id="footer">© Boi Chokro</footer>
<script>
(() => {
const URL='https://jhbpaezbpkfwjfmazdcn.supabase.co';
const KEY='sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
const db=supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let user=null,channel=null,busy=false,lastMessageId=null;
function theme(){const dark=localStorage.getItem('theme')==='dark';document.documentElement.classList.toggle('dark',dark);$('theme').textContent=dark?'☀️':'🌙'}
$('theme').onclick=()=>{localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'light':'dark');theme()};
window.addEventListener('storage',e=>{if(e.key==='theme')theme()});theme();
async function settings(){const {data}=await db.from('site_settings').select('company_name,logo_url,logo,footer_text').limit(1).maybeSingle();if(!data)return;$('company').textContent=data.company_name||'Boi Chokro';document.title='লাইভ চ্যাট — '+(data.company_name||'Boi Chokro');const src=data.logo_url||data.logo;if(src){$('logo').src=src;$('logo').style.display='block'}if(data.footer_text)$('footer').textContent=data.footer_text}
function addMessage(m){if(!m||!m.id||m.id===lastMessageId)return;lastMessageId=m.id;const row=document.createElement('div');row.className='msg '+(m.is_admin?'other':'mine');const body=document.createElement('div');body.textContent=m.message||'';row.appendChild(body);const time=document.createElement('div');time.className='time';time.textContent=new Date(m.created_at).toLocaleString('bn-BD',{hour:'2-digit',minute:'2-digit'});row.appendChild(time);$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight}
async function loadHistory(){const {data,error}=await db.from('chat_messages').select('id,user_id,message,is_admin,is_read,created_at').eq('user_id',user.id).order('created_at',{ascending:true}).limit(200);if(error){$('status').textContent='চ্যাট লোড হয়নি। ডেটাবেস নীতিমালা পরীক্ষা করুন।';return}$('messages').innerHTML='';lastMessageId=null;(data||[]).forEach(addMessage);if(!data?.length){const p=document.createElement('p');p.className='notice';p.textContent='এখনো কোনো মেসেজ নেই। নিচে লিখে কথোপকথন শুরু করুন।';$('messages').appendChild(p)}await db.from('chat_messages').update({is_read:true}).eq('user_id',user.id).eq('is_admin',true).eq('is_read',false)}
function realtime(){if(channel)db.removeChannel(channel);channel=db.channel('customer-support-'+user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'user_id=eq.'+user.id},async payload=>{if(payload.new.user_id===user.id){const p=$('messages').querySelector('.notice');if(p)p.remove();addMessage(payload.new);if(payload.new.is_admin)await db.from('chat_messages').update({is_read:true}).eq('id',payload.new.id).eq('user_id',user.id)}}).subscribe()}
$('form').addEventListener('submit',async e=>{e.preventDefault();const text=$('message').value.trim();if(!user||!text||busy)return;busy=true;$('send').disabled=true;$('message').disabled=true;const {error}=await db.from('chat_messages').insert({user_id:user.id,message:text,is_admin:false,is_read:false});if(error){$('status').textContent='মেসেজ পাঠানো যায়নি। আবার চেষ্টা করুন।';console.error(error)}else{$('message').value='';$('status').textContent='মেসেজ পাঠানো হয়েছে · সাপোর্ট টিমের উত্তরের অপেক্ষায়'}busy=false;$('send').disabled=false;$('message').disabled=false;$('message').focus()});
$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
async function init(){await settings();const {data:{session},error}=await db.auth.getSession();if(error||!session){location.replace('/login.html?redirect='+encodeURIComponent('/live-chat.html'));return}user=session.user;$('status').textContent='● সংযুক্ত · '+(user.email||'আপনার অ্যাকাউন্ট');$('message').disabled=false;$('send').disabled=false;await loadHistory();realtime();db.auth.onAuthStateChange((event,next)=>{if(event==='SIGNED_OUT'||!next)location.replace('/login.html')})}
window.addEventListener('beforeunload',()=>{if(channel)db.removeChannel(channel)});init();
})();
</script>
</body></html>
