<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>উইশলিস্ট - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-animate { animation: slideInRight 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-300">

    <div id="toast-container" class="fixed top-20 right-4 md:right-10 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <!-- নেভবার -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-extrabold text-blue-600 dark:text-blue-400">Boi Chokro</a>
            <a href="/" class="text-sm font-semibold text-gray-600 dark:text-gray-300 hover:text-blue-600">← হোম ফিরে যান</a>
        </div>
    </nav>

    <!-- মূল কনটেন্ট -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
        <div class="flex justify-between items-center mb-6 border-b pb-4 dark:border-gray-700">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white">💖 আমার উইশলিস্ট</h1>
            <span id="wishlistCountHeader" class="text-sm text-gray-500 font-semibold">০ টি বই</span>
        </div>

        <div id="wishlistGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 sm:gap-6">
            <p class="text-gray-500 col-span-full text-center py-12">উইশলিস্ট লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- ফুটার -->
    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-auto">
        <p>&copy; 2026 Boi Chokro. All rights reserved.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        window.showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-animate px-5 py-4 rounded-lg shadow-2xl text-white font-bold flex items-center gap-3 ${isError ? 'bg-red-600' : 'bg-green-600'}`;
            toast.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        async function loadWishlistBooks() {
            const grid = document.getElementById('wishlistGrid');
            const headerCount = document.getElementById('wishlistCountHeader');
            
            let wishlistIds = JSON.parse(localStorage.getItem('boiChokroWishlist')) || [];

            if (wishlistIds.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 space-y-4">
                        <p class="text-gray-400 text-lg">আপনার উইশলিস্টে কোনো বই নেই।</p>
                        <a href="/" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition">বই দেখুন</a>
                    </div>
                `;
                if(headerCount) headerCount.innerText = '০ টি বই';
                return;
            }

            if(headerCount) headerCount.innerText = `${wishlistIds.length} টি বই`;

            // ডাটাবেজ থেকে উইশলিস্টে থাকা আইডিগুলোর বই ফেচ করা
            const { data: books, error } = await supabaseClient
                .from('books')
                .select('*')
                .in('id', wishlistIds);

            if (error || !books || books.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-12">উইশলিস্টের বইগুলো লোড করা যায়নি।</p>`;
                return;
            }

            grid.innerHTML = books.map(book => {
                const bookId = book.id;
                const bookTitle = book.title || book.name || 'বইয়ের নাম নেই';
                const bookAuthor = book.author || 'অজ্ঞাত লেখক';
                const currentPrice = book.discount_price || book.price || 0;
                const originalPrice = book.original_price || 0;
                const hasDiscount = originalPrice && currentPrice && originalPrice > currentPrice;
                let discountPercent = hasDiscount ? Math.round(((originalPrice - currentPrice) / originalPrice) * 100) : 0;
                
                let rawImg = book.cover_url || book.image_url || '';
                let bookImage = rawImg.startsWith('http') ? rawImg : 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300';

                return `
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col overflow-hidden relative group">
                    <button onclick="removeFromWishlist('${bookId}')" class="absolute top-2 right-2 z-20 bg-white/90 dark:bg-gray-800/95 p-2 rounded-full shadow hover:scale-110 transition text-red-500" title="উইশলিস্ট থেকে সরান">
                        ❌
                    </button>

                    <a href="/book-details.html?id=${bookId}" class="block w-full aspect-[3/4] bg-gray-100 dark:bg-gray-700 overflow-hidden relative">
                        ${hasDiscount ? `<div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-md z-10">${discountPercent}% ছাড়</div>` : ''}
                        <img src="${bookImage}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300'">
                    </a>
                    <div class="p-3 flex flex-col flex-grow justify-between">
                        <div>
                            <a href="/book-details.html?id=${bookId}">
                                <h3 class="font-bold text-sm text-gray-900 dark:text-white leading-snug line-clamp-2 mb-1 hover:text-blue-600 transition">${escapeHTML(bookTitle)}</h3>
                            </a>
                            <p class="text-xs text-gray-500 mb-3">${escapeHTML(bookAuthor)}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-bold text-blue-600 dark:text-blue-400">৳ ${currentPrice}</span>
                            ${hasDiscount ? `<span class="text-gray-400 line-through text-xs">৳ ${originalPrice}</span>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        window.removeFromWishlist = (bookId) => {
            let wishlist = JSON.parse(localStorage.getItem('boiChokroWishlist')) || [];
            wishlist = wishlist.filter(id => id !== bookId);
            localStorage.setItem('boiChokroWishlist', JSON.stringify(wishlist));
            showToast('উইশলিস্ট থেকে বইটি সরিয়ে ফেলা হয়েছে!');
            loadWishlistBooks();
        }

        loadWishlistBooks();
    </script>
</body>
</html>
