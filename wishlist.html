<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার উইশলিস্ট - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors min-h-screen flex flex-col">

    <nav class="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center">
        <a href="/index.html" class="text-xl font-bold text-blue-600 dark:text-blue-400">&larr; হোমে ফিরে যান</a>
        <h1 class="text-xl font-bold text-gray-800 dark:text-white">আমার উইশলিস্ট</h1>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
        <div id="wishlistGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
            <p class="text-center col-span-full py-10">লোড হচ্ছে...</p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        async function loadWishlist() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = '/login.html'; return; }

            const { data: wishlist, error } = await supabaseClient
                .from('wishlists')
                .select('book_id, books(*)')
                .eq('user_id', session.user.id);

            const grid = document.getElementById('wishlistGrid');
            if (error || !wishlist || wishlist.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16">
                    <p class="text-gray-500 text-lg">আপনার উইশলিস্টে কোনো বই নেই।</p>
                    <a href="/index.html" class="text-blue-600 hover:underline mt-2 inline-block">বই দেখতে যান</a>
                </div>`;
                return;
            }

            grid.innerHTML = wishlist.map(item => {
                const book = item.books;
                const currentPrice = book.discount_price || book.original_price || 0;
                return `
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 relative group flex flex-col">
                    <button onclick="removeWishlist('${book.id}')" class="absolute top-2 right-2 z-20 p-1.5 bg-white/80 dark:bg-gray-900/80 backdrop-blur rounded-full shadow-sm text-red-500 hover:scale-110 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                    </button>
                    
                    <a href="/book-details.html?id=${book.id}" class="block w-full aspect-[3/4] bg-gray-100 overflow-hidden relative rounded-t-xl">
                        <img src="${book.cover_url || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    </a>
                    
                    <div class="p-3 flex flex-col flex-grow">
                        <h3 class="font-bold text-sm sm:text-base text-gray-900 dark:text-white leading-snug line-clamp-2 mb-1">${book.title}</h3>
                        <p class="text-xs text-gray-500 mb-2">${book.author}</p>
                        <div class="mt-auto pt-2 flex items-center justify-between">
                            <span class="text-lg font-bold text-blue-600 dark:text-blue-400">৳ ${currentPrice}</span>
                            <button onclick="moveToCart('${book.id}', '${book.title}', ${currentPrice}, '${book.cover_url}')" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded font-bold hover:bg-green-200">কার্টে নিন</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        window.removeWishlist = async (bookId) => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            await supabaseClient.from('wishlists').delete().eq('user_id', session.user.id).eq('book_id', bookId);
            loadWishlist();
        }

        window.moveToCart = (id, title, price, image) => {
            let cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            if (!cart.find(item => item.id === id)) {
                cart.push({ id, title, price, image }); 
                localStorage.setItem('boiChokroCart', JSON.stringify(cart));
                alert('সফলভাবে কার্টে যোগ হয়েছে!');
            } else {
                alert('বইটি আগেই কার্টে আছে!');
            }
        }

        loadWishlist();
    </script>
</body>
</html>
