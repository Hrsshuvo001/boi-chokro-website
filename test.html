<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Test Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #f0f0f0;">
    <h1>ডেটাবেস টেস্ট</h1>
    <div id="output" style="background: white; padding: 15px; border-radius: 8px; white-space: pre-wrap;">লোড হচ্ছে...</div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function runTest() {
            let output = "";
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                output += "❌ আপনি লগইন করা নেই!\n\n";
            } else {
                output += `✅ আপনি লগইন আছেন (ID: ${session.user.id})\n\n`;
            }

            // ১. মেসেজ চেক
            const { data: messages, error: msgErr } = await supabaseClient.from('messages').select('*');
            if (msgErr) {
                output += `❌ মেসেজ টেবিল এরর: ${msgErr.message}\n\n`;
            } else {
                output += `✅ মোট মেসেজ পাওয়া গেছে: ${messages.length} টি\n`;
                output += `মেসেজ ডেটা: ${JSON.stringify(messages, null, 2)}\n\n`;
            }

            // ২. বই চেক
            const { data: books, error: bookErr } = await supabaseClient.from('books').select('id, title, stock_quantity');
            if (bookErr) {
                output += `❌ বই টেবিল এরর: ${bookErr.message}\n\n`;
            } else {
                output += `✅ মোট বই পাওয়া গেছে: ${books.length} টি\n`;
                output += `বইয়ের স্টক ডেটা: ${JSON.stringify(books, null, 2)}\n\n`;
            }

            document.getElementById('output').innerText = output;
        }

        runTest();
    </script>
</body>
</html>
