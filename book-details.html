<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বইয়ের বিবরণ - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="text-2xl font-bold text-blue-600 tracking-tight">Boi Chokro</a>
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="/cart.html" class="relative text-gray-600 hover:text-blue-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span id="cartCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </a>
                <div id="authButtons" class="flex items-center gap-3"></div>
            </div>
        </div>
    </nav>

    <!-- মেইন কন্টেন্ট -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
        
        <!-- বইয়ের ডিটেইলস কন্টেইনার (কোনো লোডিং স্পিনার নেই, সরাসরি ডেটা বসবে) -->
        <div id="bookDetailsContainer" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-10 mb-12">
            <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে বইয়ের তথ্য সরাসরি বসে যাবে -->
        </div>

    </main>

    <!-- ফুটার -->
    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-auto">
        <p class="text-sm font-medium">&copy; 2024 Boi Chokro. All rights reserved.</p>
    </footer>

    <script>
        // ১. সুপাবেস কানেকশন
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        const urlParams = new URLSearchParams(window.location.search);
        const currentBookId = urlParams.get('id');

        // ২. কার্ট কাউন্ট আপডেট
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            const cartEl = document.getElementById('cartCount');
            if(cartEl) cartEl.innerText = cart.length;
        }

        // ৩. ইউজার লগইন চেক
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtons = document.getElementById('authButtons');
            if (!authButtons) return;

            if (session) {
                currentUser = session.user;
                authButtons.innerHTML = `
                    <a href="/profile.html" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">প্রোফাইল</a>
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-sm font-semibold border border-red-200 hover:bg-red-100 transition">লগআউট</button>
                `;
            } else {
                currentUser = null;
                authButtons.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">লগইন</a>`;
            }
        }

        // ==========================================
        // ৪. বইয়ের ডিটেইলস লোড করা (সরাসরি রেন্ডার)
        // ==========================================
        async function loadBookDetails() {
            const container = document.getElementById('bookDetailsContainer');
            
            if (!currentBookId) {
                container.innerHTML = `<div class="text-center py-10"><p class="text-red-500 font-bold text-lg mb-2">⚠️ কোনো বই সিলেক্ট করা হয়নি!</p><a href="/index.html" class="mt-4 inline-block bg-blue-600 text-white px-6 py-2 rounded-lg">হোমে ফিরে যান</a></div>`;
                return;
            }

            // সুপাবেস থেকে ডেটা আনা
            const { data: book, error } = await supabaseClient.from('books').select('*').eq('id', currentBookId).maybeSingle();
            
            if (error) {
                container.innerHTML = `<div class="text-center py-10"><p class="text-red-500 font-bold text-lg mb-2">⚠️ ডেটাবেস এরর!</p><p class="text-sm bg-red-50 p-4 rounded-lg">${error.message}</p></div>`;
                return;
            }

            if (!book) {
                container.innerHTML = `<div class="text-center py-10"><p class="text-red-500 font-bold text-lg mb-2">❌ বইটি পাওয়া যায়নি!</p><p class="text-gray-500 text-sm">URL-এর আইডির সাথে কোনো বই ম্যাচ করেনি।</p><a href="/index.html" class="mt-4 inline-block bg-blue-600 text-white px-6 py-2 rounded-lg">হোমে ফিরে যান</a></div>`;
                return;
            }

            // ডেটা পাওয়া গেলে সরাসরি বইয়ের তথ্য রেন্ডার করা
            const currentPrice = book.discount_price || book.original_price || 0;
            const hasDiscount = book.original_price && book.discount_price && book.original_price > book.discount_price;
            const isOutOfStock = (book.stock_quantity !== undefined && book.stock_quantity !== null) ? book.stock_quantity <= 0 : false;
            let discountPercent = 0;
            if (hasDiscount) discountPercent = Math.round(((book.original_price - book.discount_price) / book.original_price) * 100);

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
                    <!-- বাম দিক: ছবি -->
                    <div class="bg-gray-50 rounded-xl overflow-hidden p-4 flex items-center justify-center border relative h-96 md:h-[500px]">
                        ${hasDiscount ? `<div class="absolute top-4 left-4 bg-red-500 text-white font-bold px-3 py-1 rounded shadow z-10">${discountPercent}% ছাড়</div>` : ''}
                        ${isOutOfStock ? `<div class="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-10"><span class="bg-red-600 text-white font-bold px-4 py-2 rounded-lg text-lg">স্টক নেই</span></div>` : ''}
                        <img src="${book.cover_url || 'https://via.placeholder.com/300x400?text=No+Image'}" class="max-h-full w-auto object-contain drop-shadow-xl">
                    </div>
                    
                    <!-- ডান দিক: তথ্য ও বাটন -->
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-blue-600 tracking-wider mb-2 uppercase">${book.category || 'সাধারণ'}</span>
                        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 leading-tight mb-2">${book.title || 'নামহীন বই'}</h1>
                        
                        <p class="text-lg text-gray-600 mb-1">লেখক: <span class="font-semibold text-blue-600">${book.author || 'অজানা'}</span></p>
                        <p class="text-lg text-gray-600 mb-4">প্রকাশনী: <span class="font-semibold text-blue-600">${book.publisher || 'অজানা'}</span></p>
                        
                        <div class="flex items-end gap-3 mb-4 bg-gray-50 p-4 rounded-lg w-fit border border-gray-200">
                            <span class="text-4xl font-bold text-green-600">৳ ${currentPrice}</span>
                            ${hasDiscount ? `<span class="text-gray-400 line-through text-lg mb-1">৳ ${book.original_price}</span>` : ''}
                        </div>

                        <p class="text-sm font-bold mb-6 ${isOutOfStock ? 'text-red-500' : 'text-green-600'}">
                            ${isOutOfStock ? '❌ বর্তমানে স্টকে নেই' : `✅ স্টকে আছে (${book.stock_quantity || 0} কপি)`}
                        </p>

                        <div class="prose text-gray-600 mb-8">
                            <h3 class="text-sm font-bold text-gray-900 mb-1">বইয়ের বিবরণ:</h3>
                            <p class="text-sm leading-relaxed whitespace-pre-line">${book.description || 'এই বইটির কোনো বিবরণ দেওয়া হয়নি।'}</p>
                        </div>

                        <div class="mt-auto pt-6 border-t flex flex-col gap-3">
                            ${isOutOfStock ? `
                                <button disabled class="w-full bg-gray-200 text-gray-500 font-bold py-3.5 rounded-xl text-lg cursor-not-allowed">স্টক নেই</button>
                            ` : `
                                <div class="grid grid-cols-2 gap-3">
                                    <button onclick="addToCart('${book.id}', '${book.title.replace(/'/g, "\\'")}', ${currentPrice}, '${book.cover_url}', false)" class="w-full bg-green-100 text-green-700 hover:bg-green-200 border border-green-300 font-bold py-3.5 rounded-xl transition text-lg flex justify-center items-center gap-2">
                                        কার্টে যোগ করুন
                                    </button>
                                    <button onclick="addToCart('${book.id}', '${book.title.replace(/'/g, "\\'")}', ${currentPrice}, '${book.cover_url}', true)" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl transition text-lg flex justify-center items-center gap-2 shadow-lg">
                                        বায় নাও
                                    </button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // ৫. কার্ট ফাংশন
        // ==========================================
        window.addToCart = (id, title, price, image, buyNow = false) => {
            if (!currentUser) {
                alert('অর্ডার করতে অনুগ্রহ করে প্রথমে লগইন করুন!');
                window.location.href = '/login.html'; return;
            }
            let cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            
            if (!cart.find(item => item.id === id)) {
                cart.push({ id, title, price, image });
                localStorage.setItem('boiChokroCart', JSON.stringify(cart));
                updateCartCount(); 
            }
            
            if (buyNow) {
                window.location.href = '/checkout.html';
            } else {
                alert('সফলভাবে কার্টে যোগ হয়েছে!');
            }
        }

        window.handleLogout = async () => { await supabaseClient.auth.signOut(); checkAuth(); alert('লগআউট হয়েছে।'); }

        // ==========================================
        // পেজ লোড হলে সরাসরি ফাংশনগুলো কল হবে
        // ==========================================
        checkAuth(); 
        loadBookDetails(); 
        updateCartCount();
    </script>
</body>
</html>
