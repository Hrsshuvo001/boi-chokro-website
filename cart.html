<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার কার্ট - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <nav class="bg-white shadow-sm p-4 flex justify-between items-center">
        <a href="/index.html" class="text-xl font-bold text-blue-600">&larr; হোমে ফিরে যান</a>
        <h1 class="text-xl font-bold text-gray-800">আমার কার্ট</h1>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full p-4 mt-8">
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div id="cartItems" class="divide-y divide-gray-200">
                <!-- কার্ট আইটেম লোড হবে -->
            </div>
            
            <div class="p-6 bg-gray-50 border-t border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-lg font-semibold text-gray-700">সর্বমোট:</span>
                    <span id="cartTotal" class="text-2xl font-bold text-blue-600">৳ 0</span>
                </div>
                <button onclick="proceedToCheckout()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">চেকআউট করুন</button>
            </div>
        </div>
    </main>

    <script>
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            const cartDiv = document.getElementById('cartItems');
            const totalDiv = document.getElementById('cartTotal');

            if (cart.length === 0) {
                cartDiv.innerHTML = `<div class="p-10 text-center text-gray-500">আপনার কার্ট বর্তমানে খালি আছে।</div>`;
                totalDiv.innerText = '৳ 0';
                return;
            }

            let total = 0;
            cartDiv.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="flex items-center p-4 gap-4">
                        <img src="${item.image || 'https://via.placeholder.com/80'}" class="w-20 h-24 object-cover rounded">
                        <div class="flex-grow">
                            <h3 class="font-bold text-gray-800">${item.title}</h3>
                            <p class="text-blue-600 font-bold mt-1">৳ ${item.price}</p>
                        </div>
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 font-semibold text-sm border border-red-200 px-3 py-1 rounded">বাদ দিন</button>
                    </div>
                `;
            }).join('');

            totalDiv.innerText = '৳ ' + total;
        }

        window.removeItem = (index) => {
            let cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('boiChokroCart', JSON.stringify(cart));
            loadCart();
        }

        window.proceedToCheckout = () => {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            if (cart.length === 0) {
                alert('কার্টে কোনো বই নেই!');
                return;
            }
            window.location.href = '/checkout.html'; // চেকআউট পেজে যাবে
        }

        loadCart();
    </script>
</body>
</html>
