<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - Boi Chokro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">লগইন করুন</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">ইমেইল</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">পাসওয়ার্ড</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition duration-300">
                লগইন
            </button>
        </form>

        <!-- এরর বা সাকসেস মেসেজ দেখানোর জায়গা -->
        <div id="message" class="text-center font-semibold text-sm mt-4 hidden"></div>
    </div>

    <script>
        // ১. আপনার Supabase URL এবং Publishable Key
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';

        // ⚠️ সবচেয়ে গুরুত্বপূর্ণ ধাপ: ক্লায়েন্ট তৈরি করে একটি ভেরিয়েবলে রাখা
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ২. DOM এলিমেন্ট সিলেক্ট করা
        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');

        // ৩. ফর্ম সাবমিট ইভেন্ট
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // পেজ রিলোড হওয়া আটকায়

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // বাটনে লোডিং টেক্সট দেখানো
            loginBtn.innerText = 'অপেক্ষা করুন...';
            loginBtn.disabled = true;
            messageDiv.classList.add('hidden'); // আগের মেসেজ লুকানো

            try {
                // ৪. Supabase Login API কল
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                // ৫. এরর হ্যান্ডলিং
                if (error) {
                    messageDiv.classList.remove('hidden', 'text-green-600');
                    messageDiv.classList.add('text-red-600');
                    
                    if (error.message === 'Invalid login credentials') {
                        messageDiv.innerText = '⚠️ ভুল ইমেইল বা পাসওয়ার্ড! আবার চেষ্টা করুন।';
                    } else if (error.message === 'Email not confirmed') {
                        messageDiv.innerText = '⚠️ আপনার ইমেইল ভেরিফাই করা হয়নি। ইনবক্স চেক করুন।';
                    } else {
                        // Network Error বা অন্যান্য এরর এখানে দেখাবে
                        messageDiv.innerText = `⚠️ ${error.message}`;
                    }
                    return; // এরর হলে নিচের রিডাইরেক্ট কোড রান হবে না
                }

                // ৬. সফল হলে
                if (data.user) {
                    messageDiv.classList.remove('hidden', 'text-red-600');
                    messageDiv.classList.add('text-green-600');
                    messageDiv.innerText = '✅ সফলভাবে লগইন হয়েছে! ড্যাশবোর্ডে নিয়ে যাচ্ছি...';
                    
                    // ১.৫ সেকেন্ড পর ড্যাশবোর্ডে রিডাইরেক্ট করবে
                    setTimeout(() => {
                        // এখানে আপনার ড্যাশবোর্ড পেজের নাম দিন (যেমন: /dashboard.html বা /index.html)
                        window.location.href = '/admin-dashboard.html'; 
                    }, 1500);
                }
            } catch (err) {
                // কোনো নেটওয়ার্ক সমস্যা হলে এখানে আসবে
                messageDiv.classList.remove('hidden', 'text-green-600');
                messageDiv.classList.add('text-red-600');
                messageDiv.innerText = '⚠️ নেটওয়ার্ক সমস্যা! ইন্টারনেট চেক করুন।';
            } finally {
                // বাটন আবার আগের অবস্থায় ফিরিয়ে আনা
                loginBtn.innerText = 'লগইন';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
