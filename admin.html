<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | বই চক্র</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">অ্যাডমিন লগইন</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">ইমেইল</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">পাসওয়ার্ড</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">লগইন করুন</button>
            
            <!-- মেসেজ দেখানোর জায়গা -->
            <p id="message" class="text-center font-semibold text-sm mt-3 hidden"></p>
        </form>
    </div>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ⚠️ এখানে আপনার Supabase Project URL এবং Anon Key বসান
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';

        // Supabase ক্লায়েন্ট তৈরি
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const messageEl = document.getElementById('message');
        const btn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // পেজ রিফ্রেশ হওয়া আটকায়
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // বাটন ডিজেবল করা এবং লোডিং টেক্সট দেখানো
            btn.innerText = 'লগইন হচ্ছে...';
            btn.disabled = true;
            messageEl.classList.add('hidden');

            try {
                // Supabase-এ লগইন রিকোয়েস্ট পাঠানো
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    // লগইন ব্যর্থ হলে
                    messageEl.innerText = "ভুল ইমেইল বা পাসওয়ার্ড! আবার চেষ্টা করুন।";
                    messageEl.className = "text-center font-semibold text-sm mt-3 text-red-500";
                    messageEl.classList.remove('hidden');
                    btn.innerText = 'লগইন করুন';
                    btn.disabled = false;
                } else {
                    // লগইন সফল হলে
                    messageEl.innerText = "সফলভাবে লগইন হয়েছে! ড্যাশবোর্ডে নিয়ে যাচ্ছে...";
                    messageEl.className = "text-center font-semibold text-sm mt-3 text-green-600";
                    messageEl.classList.remove('hidden');
                    
                    // ২ সেকেন্ড পর ড্যাশবোর্ডে রিডাইরেক্ট করবে
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard.html';
                    }, 2000);
                }
            } catch (err) {
                // কোনো নেটওয়ার্ক সমস্যা হলে
                messageEl.innerText = "কিছু একটা ভুল হয়েছে! ইন্টারনেট চেক করুন।";
                messageEl.className = "text-center font-semibold text-sm mt-3 text-red-500";
                messageEl.classList.remove('hidden');
                btn.innerText = 'লগইন করুন';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
