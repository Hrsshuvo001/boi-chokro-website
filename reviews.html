<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বইয়ের রিভিউ - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <!-- নেভিগেশন বার -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="text-2xl font-bold text-blue-600 tracking-tight">Boi Chokro</a>
            <div class="flex items-center gap-4 sm:gap-6">
                <a href="/cart.html" class="relative text-gray-600 hover:text-blue-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span id="cartCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </a>
                <div id="authButtons" class="flex items-center gap-3"></div>
            </div>
        </div>
    </nav>

    <!-- মেইন কন্টেন্ট -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8 relative">
        
        <!-- টোস্ট নোটিফিকেশন (মেসেজ দেখানোর জন্য) -->
        <div id="toastMessage" class="fixed top-20 right-4 md:right-10 transform translate-x-[150%] transition-transform duration-300 ease-in-out z-[100]">
            <div id="toastBox" class="bg-green-600 text-white px-6 py-3 rounded-lg shadow-xl flex items-center gap-3 font-semibold">
                <span id="toastText">রিভিউ সফলভাবে জমা হয়েছে!</span>
            </div>
        </div>

        <!-- বইয়ের নাম দেখানোর এরিয়া -->
        <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <a href="#" id="backToBookBtn" class="text-blue-600 text-sm font-semibold hover:underline mb-2 inline-block">&larr; বইয়ের পেজে ফিরে যান</a>
            <h1 id="pageTitle" class="text-2xl font-bold text-gray-900">বইয়ের রিভিউ লোড হচ্ছে...</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- বাম দিক: রিভিউ লেখার ফর্ম -->
            <div class="md:col-span-1">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 sticky top-24">
                    <h3 class="font-bold text-lg mb-2 text-gray-800">রিভিউ দিন</h3>
                    <p class="text-xs text-gray-500 mb-4">* আপনার রিভিউটি অ্যাডমিন অ্যাপ্রুভ করার পর প্রকাশিত হবে।</p>
                    
                    <form id="reviewForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">রেটিং দিন</label>
                            <select id="reviewRating" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                                <option value="5">⭐⭐⭐⭐⭐ (৫ স্টার - অসাধারণ)</option>
                                <option value="4">⭐⭐⭐⭐ (৪ স্টার - ভালো)</option>
                                <option value="3">⭐⭐⭐ (৩ স্টার - মাঝারি)</option>
                                <option value="2">⭐⭐ (২ স্টার - খারাপ)</option>
                                <option value="1">⭐ (১ স্টার - খুব খারাপ)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">আপনার মতামত</label>
                            <textarea id="reviewComment" required rows="4" placeholder="বইটি সম্পর্কে আপনার মতামত লিখুন..." class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50"></textarea>
                        </div>
                        <button type="submit" id="submitReviewBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition shadow-md">
                            রিভিউ সাবমিট করুন
                        </button>
                    </form>
                </div>
            </div>

            <!-- ডান দিক: সব রিভিউয়ের লিস্ট -->
            <div class="md:col-span-2">
                <div id="reviewsList" class="space-y-4">
                    <p class="text-gray-500 text-center py-10">লোড হচ্ছে...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-auto">
        <p class="text-sm font-medium">&copy; 2024 Boi Chokro. All rights reserved.</p>
    </footer>

    <script>
        // সুপাবেস কনফিগারেশন
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        const urlParams = new URLSearchParams(window.location.search);
        const currentBookId = urlParams.get('id');

        // টোস্ট মেসেজ ফাংশন (স্ক্রিনে মেসেজ দেখানোর জন্য)
        function showToast(message, isError = false) {
            const toast = document.getElementById('toastMessage');
            const toastBox = document.getElementById('toastBox');
            const toastText = document.getElementById('toastText');
            
            if (isError) {
                toastBox.className = 'bg-red-600 text-white px-6 py-3 rounded-lg shadow-xl flex items-center gap-3 font-semibold';
            } else {
                toastBox.className = 'bg-green-600 text-white px-6 py-3 rounded-lg shadow-xl flex items-center gap-3 font-semibold';
            }
            
            toastText.innerText = message;
            toast.classList.remove('translate-x-[150%]');
            toast.classList.add('translate-x-0');
            
            setTimeout(() => {
                toast.classList.remove('translate-x-0');
                toast.classList.add('translate-x-[150%]');
            }, 4000);
        }

        // কার্ট কাউন্ট
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boiChokroCart')) || [];
            const cartEl = document.getElementById('cartCount');
            if(cartEl) cartEl.innerText = cart.length;
        }

        // ইউজার চেক
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authButtons = document.getElementById('authButtons');
            if (!authButtons) return;

            if (session) {
                currentUser = session.user;
                authButtons.innerHTML = `
                    <a href="/profile.html" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">প্রোফাইল</a>
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-sm font-semibold border border-red-200 hover:bg-red-100 transition">লগআউট</button>
                `;
            } else {
                currentUser = null;
                authButtons.innerHTML = `<a href="/login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">লগইন</a>`;
            }
        }

        // ==========================================
        // ১. পেজ সেটআপ ও রিভিউ লোড করা (Read)
        // ==========================================
        async function initPage() {
            const list = document.getElementById('reviewsList');
            
            if (!currentBookId) {
                document.getElementById('pageTitle').innerText = "⚠️ কোনো বই সিলেক্ট করা হয়নি!";
                list.innerHTML = `<p class="text-red-500 text-center py-10">দয়া করে হোম পেজ থেকে একটি বই সিলেক্ট করুন।</p>`;
                return;
            }

            // বইয়ের নাম আনা
            try {
                const { data: book } = await supabaseClient.from('books').select('title').eq('id', currentBookId).maybeSingle();
                if (book) document.getElementById('pageTitle').innerText = `"${book.title}" এর রিভিউ`;
            } catch (e) {
                document.getElementById('pageTitle').innerText = "রিভিউ পেজ";
            }

            document.getElementById('backToBookBtn').href = `/book-details.html?id=${currentBookId}`;

            // রিভিউ লোড করা
            list.innerHTML = `<p class="text-gray-500 text-center py-10">রিভিউ লোড হচ্ছে...</p>`;
            try {
                const { data: reviews, error } = await supabaseClient
                    .from('reviews')
                    .select('*')
                    .eq('book_id', currentBookId)
                    .order('created_at', { ascending: false });

                if (error) throw new Error(error.message);

                if (!reviews || reviews.length === 0) {
                    list.innerHTML = `<div class="text-center py-10 bg-white rounded-xl border border-gray-100 shadow-sm"><p class="text-gray-500">এই বইয়ের জন্য এখনো কোনো রিভিউ নেই।</p></div>`;
                    return;
                }

                // শুধুমাত্র approved রিভিউ দেখানো
                const approved = reviews.filter(r => r.status === 'approved');

                if (approved.length === 0) {
                    list.innerHTML = `<div class="text-center py-10 bg-white rounded-xl border border-gray-100 shadow-sm"><p class="text-gray-500">এই বইয়ের কোনো রিভিউ এখনো পাবলিশ হয়নি।</p></div>`;
                    return;
                }

                list.innerHTML = approved.map(rev => {
                    const date = new Date(rev.created_at).toLocaleDateString('bn-BD');
                    const stars = Array(rev.rating || 5).fill('<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>`).join('');

                    return `
                    <div class="border border-gray-100 rounded-xl p-4 bg-white shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-lg uppercase">প</div>
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">একজন পাঠক</p>
                                    <p class="text-xs text-gray-500">${date}</p>
                                </div>
                            </div>
                            <div class="flex text-yellow-400">${stars}</div>
                        </div>
                        <p class="text-gray-600 text-sm mt-2">${rev.comment || 'কোনো মন্তব্য নেই'}</p>
                    </div>
                    `;
                }).join('');

            } catch (err) {
                list.innerHTML = `<div class="text-center py-6 bg-red-50 rounded-xl border border-red-200">
                    <p class="text-red-600 font-bold mb-1">⚠️ রিভিউ লোড সমস্যা!</p>
                    <p class="text-gray-700 text-xs">${err.message}</p>
                </div>`;
            }
        }

        // ==========================================
        // ২. নতুন রিভিউ সাবমিট (Create)
        // ==========================================
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentUser) {
                showToast('রিভিউ দিতে প্রথমে লগইন করুন!', true);
                setTimeout(() => { window.location.href = '/login.html'; }, 1500);
                return;
            }

            const btn = document.getElementById('submitReviewBtn');
            const rating = parseInt(document.getElementById('reviewRating').value);
            const comment = document.getElementById('reviewComment').value;

            btn.innerText = 'সেভ হচ্ছে...'; 
            btn.disabled = true;

            try {
                // ডেটাবেসে ইনসার্ট
                const { error } = await supabaseClient.from('reviews').insert([{
                    book_id: currentBookId,
                    user_id: currentUser.id,
                    rating: rating,
                    comment: comment,
                    status: 'pending'
                }]);

                if (error) throw new Error(error.message);

                // সফল হলে সবুজ মেসেজ দেখাবে
                showToast('✅ রিভিউ সফলভাবে জমা হয়েছে!', false);
                document.getElementById('reviewForm').reset();

            } catch (err) {
                // এরর হলে লাল মেসেজ দেখাবে
                showToast('❌ রিভিউ সেভ হয়নি! কারণ: ' + err.message, true);
            } finally {
                btn.innerText = 'রিভিউ সাবমিট করুন'; 
                btn.disabled = false;
            }
        });

        window.handleLogout = async () => { await supabaseClient.auth.signOut(); checkAuth(); alert('লগআউট হয়েছে।'); }

        // শুরু
        checkAuth(); 
        initPage(); 
        updateCartCount();
    </script>
</body>
</html>
