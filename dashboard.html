<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ড্যাশবোর্ড - Boi Chokro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Boi Chokro</h1>
        <button id="logoutBtn" class="bg-blue-800 px-4 py-2 rounded hover:bg-blue-900 text-sm">লগআউট</button>
    </nav>

    <div class="max-w-7xl mx-auto mt-8 p-4">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">সব বই</h2>
        <div id="bookGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- লোডিং -->
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhbpaezbpkfwjfmazdcn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oBzutzPKvIvujmSG7icXug_SwwveL5g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadBooks() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = '/login.html';

            const { data: books, error } = await supabaseClient.from('books').select('*').order('created_at', { ascending: false });
            const bookGrid = document.getElementById('bookGrid');

            if (error || books.length === 0) {
                bookGrid.innerHTML = `<p class="text-gray-500 col-span-full">কোনো বই পাওয়া যায়নি।</p>`;
                return;
            }

            bookGrid.innerHTML = books.map(book => `
                <div class="bg-white rounded-lg shadow-sm hover:shadow-xl transition duration-300 overflow-hidden flex flex-col border border-gray-100 relative">
                    
                    ${book.original_price && book.original_price > book.discount_price ? 
                        `<div class="absolute top-2 left-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded shadow">ডিসকাউন্ট</div>` : ''}

                    <img src="${book.cover_url || 'https://via.placeholder.com/150'}" class="w-full h-56 object-cover">
                    
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="font-bold text-lg text-gray-800 leading-tight mb-1">${book.title}</h3>
                        <p class="text-sm text-gray-500 mb-2">লেখক: ${book.author}</p>
                        
                        <div class="flex items-end gap-2 mb-3 mt-auto">
                            <span class="text-2xl font-bold text-blue-600">৳ ${book.discount_price}</span>
                            ${book.original_price ? `<span class="text-gray-400 line-through text-sm mb-1">৳ ${book.original_price}</span>` : ''}
                        </div>

                        ${book.payment_info ? `<div class="bg-gray-50 p-2 rounded text-xs text-gray-600 mb-3 border border-gray-200">💳 পেমেন্ট: ${book.payment_info}</div>` : ''}

                        <!-- বাই বাটন -->
                        <a href="${book.purchase_link || '#'}" target="_blank" class="w-full block text-center ${book.is_affiliate ? 'bg-purple-600 hover:bg-purple-700' : 'bg-green-600 hover:bg-green-700'} text-white font-bold py-2 rounded transition">
                            ${book.is_affiliate ? 'অন্য সাইট থেকে কিনুন' : 'এখনই কিনুন'}
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/login.html';
        });

        loadBooks();
    </script>
</body>
</html>
